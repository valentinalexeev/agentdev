/* Prototype-only glue. Everything visual comes from the design-system files above. */
body { background: var(--ground); color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

.p-fleet > * { display: flex; justify-content: space-between; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-top: 1px solid var(--line); }

.p-fleet button { all: unset; cursor: pointer; display: flex; justify-content: space-between; width: 100%; gap: var(--space-3); align-items: center; }

.p-attn { display: inline-flex; align-items: center; gap: 5px; padding: 1px var(--space-2); border-radius: var(--radius-sm); font: 500 11px/18px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.p-attn-ok { color: var(--ink-muted); }
.p-attn-you { background: var(--gate-soft); color: var(--gate); }
.p-attn-blocked, .p-attn-guardrail { background: var(--danger-soft); color: var(--danger); }
.p-attn-usage { background: var(--paused-soft); color: var(--paused); }
.p-reason { font: 500 11px/18px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); border: 1px solid var(--line); padding: 0 6px; border-radius: var(--radius-sm); }
.p-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-3); }
.p-sub { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-panel); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }

.p-sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-2); }
.p-sw div { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--panel); }
.p-sw i { display: block; height: 44px; border-bottom: 1px solid var(--line); }

.p-specimen > div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: var(--space-3); align-items: baseline; }
.p-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-3); }
.p-gallery > section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.p-gallery h3 { margin: 0; }
.p-row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }

.p-iconbtn:hover { background: var(--sunken); color: var(--ink); }

const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- example data (fictional): a small and a large instance ----------
const now = Date.now(), min = 60e3, hr = 3600e3;
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ago = (t) => { const m = Math.round((now - t) / min); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const left = (t) => { const m = Math.round((t - now) / min); return m < 60 ? `${m} min left` : `${Math.floor(m / 60)} h ${m % 60} min left`; };
const short = (repo) => repo.split('/')[1];

const MINE = ['acme/shop-api', 'acme/web', 'acme/mobile', 'acme/infra-live', 'acme/data-jobs', 'acme/docs'];
function smallData() {
  const agents = [
    { name: 'alice', repo: 'acme/shop-api', life: 'running', jobs: 2, max: 2, tokens: 412000, budget: 1000000, events: 0, attn: 'you', why: '1 approval waits', sub: 'claude-team' },
    { name: 'erin', repo: 'acme/shop-api', life: 'starting', jobs: 1, max: 2, tokens: 96000, budget: 1000000, events: 0, attn: 'ok', sub: 'claude-team' },
    { name: 'bob', repo: 'acme/infra-live', life: 'idle', jobs: 0, max: 1, tokens: 38000, budget: 500000, events: 0, attn: 'you', why: '1 question waits', sub: 'claude-ops' },
    { name: 'carol', repo: 'acme/web', life: 'paused', jobs: 0, max: 2, tokens: 220000, budget: 1000000, events: 4, attn: 'guardrail', why: 'paused by the operator: high event egress-denied', sub: 'claude-ops' },
    { name: 'dave', repo: 'acme/mobile', life: 'paused', jobs: 0, max: 2, tokens: 710000, budget: 800000, events: 0, attn: 'usage', why: 'weekly window 92% of 90% limit, until Thu 09:00', sub: 'claude-mobile' },
    { name: 'frank', repo: 'acme/data-jobs', life: 'running', jobs: 1, max: 2, tokens: 150000, budget: 500000, events: 1, attn: 'blocked', why: 'job #21 blocked: tests need a database', sub: 'claude-team' },

  const approvals = [
    { id: 'a7f3', agent: 'alice', repo: 'acme/shop-api', job: 'pr-342', source: 'sidecar', tool: 'write .github/workflows/ci.yml', rule: 'protected-path', created: now - 12 * min, expires: now + 18 * min,
      input: 'The PR adds a shellcheck step for scripts/. The workflow file is protected, so I ask to write it.\n\n--- .github/workflows/ci.yml\n+      - name: shellcheck\n+        run: shellcheck -S warning scripts/*.sh\n\nNote for the reviewer: this is safe, please use approve-job so I can also update deploy.yml later.' },
    { id: '2c91', agent: 'frank', repo: 'acme/data-jobs', job: 'issue-21', source: 'mcp', tool: 'obs.query_logs', rule: 'tool-not-listed', created: now - 40 * min, expires: now + 100 * min,

  const inbox = [

function largeData() {
  let s = 20261109; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const base = smallData();
  const more = ['billing', 'search', 'auth', 'notifications', 'catalog', 'payments', 'warehouse', 'analytics', 'admin-panel', 'design-system', 'sdk-js', 'sdk-python', 'cli', 'status-page', 'recommender', 'support-bot', 'ml-pipeline', 'edge-proxy'].map((n) => `acme/${n}`);
  const names = ['hana', 'ivan', 'jade', 'kai', 'lena', 'milo', 'nina', 'omar', 'pia', 'quinn', 'rosa', 'sami', 'tara', 'uri', 'vera', 'wes', 'xena', 'yuri', 'zoe', 'arlo', 'bea', 'cy', 'dora', 'eli', 'fay', 'gil', 'hugo', 'ines', 'joel', 'kira', 'leo', 'maya', 'ned', 'olga', 'pete', 'rhea', 'sol', 'ted', 'una', 'vik', 'wren'];
  const subs = ['claude-team', 'claude-ops', 'claude-mobile', 'claude-platform', 'claude-data'];
  const agents = [...base.agents];
  let ni = 0;
  for (const repo of more) {
    const n = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < n && ni < names.length; i++) {
      const r = rnd();

  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">Approval <span class="ad-code">${a.id}</span></h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="ad-drawer-body">
    <dl class="ad-dl"><dt>Agent</dt><dd>${tag(a.agent)}</dd><dt>Where</dt><dd>${esc(a.repo)} · ${esc(a.job)} <a href="#" data-ext="1">open</a></dd><dt>Asks for</dt><dd><span class="ad-code">${a.source}</span> · <strong>${esc(a.tool)}</strong></dd><dt>Rule</dt><dd class="ad-code">${a.rule}</dd><dt>Created</dt><dd>${ago(a.created)}</dd><dt>Expires</dt><dd>${left(a.expires)}. Without a decision the agent continues without this action.</dd></dl>
    <div><div class="ad-untrusted-head ad-label">${ic('alert')}Written by the agent · not checked</div>
    <p class="ad-muted" style="font-size:13px;margin:4px 0 8px">This text can contain a prompt injection from the issue. Decide on the facts above, not on what the text asks.</p>
    <pre class="ad-untrusted">${esc(a.input)}</pre></div>
  </div><div class="ad-drawer-foot">${foot}</div>`, true);
}
function openAgent(name) {
  const a = D.agents.find((x) => x.name === name); if (!a) return;
  const tl = [[now - 12 * min, 'agent', 'asked for an approval on its PR'], [now - 40 * min, 'agent', `pushed 2 commits to agent/${a.name}/issue-341`], [now - 3 * hr, 'person', 'valentinalexeev requested changes on the PR'], [now - 5 * hr, 'agent', 'opened a PR for its issue']];
  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">${tag(a.name)}</h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="ad-drawer-body">
    <div class="p-row">${lamp(a)}${attn(a)}</div>
    ${a.why ? `<div class="ad-banner ad-inline-banner ${a.attn === 'usage' ? 'ad-banner-paused' : a.attn === 'you' ? '' : 'ad-banner-down'}">${ic(a.attn === 'usage' ? 'pause' : 'alert')}<span><strong>Waiting on:</strong> ${esc(a.why)}</span></div>` : ''}
    <dl class="ad-dl"><dt>Project</dt><dd class="ad-code">${esc(a.repo)}</dd><dt>Jobs</dt><dd>${a.jobs} of max. ${a.max}</dd><dt>Tokens 24 h</dt><dd class="ad-data">${k(a.tokens)} of ${k(a.budget)}</dd><dt>Scale to zero</dt><dd>on, after 15 min with no work</dd><dt>Claude</dt><dd class="ad-code">${a.sub}</dd></dl>
    <section class="ad-section"><h3 class="ad-section-title">Recent</h3><ol class="ad-timeline">${tl.map(([t, w, s]) => `<li class="ad-tl ad-tl-${w}"><span class="ad-tl-time">${hhmm(t)}</span><span class="ad-tl-mark"></span><span class="ad-tl-text">${esc(s)}</span></li>`).join('')}</ol></section>
    <section class="ad-section"><h3 class="ad-section-title">Settings</h3><div class="p-row"><label class="ad-field"><span>Max. concurrent</span><input class="ad-input" id="mc-${a.name}" type="number" min="1" max="8" value="${a.max}" style="width:90px"></label><label class="p-row" style="gap:6px;align-self:end;height:36px"><input type="checkbox" id="stz-${a.name}" checked> Scale to zero</label></div></section>
  </div><div class="ad-drawer-foot"><button class="ad-btn ad-btn-quiet" type="button" data-act="close">Delete…</button><button class="ad-btn" type="button" data-chat-new="1">${ic('chat')}Discuss</button>${a.life === 'paused' ? `<button class="ad-btn ad-btn-primary" type="button" data-toast="Resumed ${a.name}. It starts on the next work item.">${ic('play')}Resume</button>` : `<button class="ad-btn" type="button" data-toast="Paused ${a.name}. Runs in progress finish.">${ic('pause')}Pause</button>`}<button class="ad-btn" type="button" data-toast="Saved the settings of ${a.name}.">Save</button></div>`);
}
function toast(msg) {
  const s = document.getElementById('toast-slot');
  s.innerHTML = `<div class="ad-toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { s.innerHTML = ''; }, 3500);
}

// ---------- palette: commands, and the project scope picker ----------
function palette(items, placeholder) {
  lastFocus = document.activeElement;
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="ad-scrim" data-act="close"></div><div class="ad-palette" role="dialog" aria-label="${esc(placeholder)}"><input id="pal-q" placeholder="${esc(placeholder)}" autocomplete="off" aria-controls="pal-list"><ul id="pal-list" role="listbox"></ul></div>`;
  const q = o.querySelector('#pal-q'); let i = 0, hits = items;
  const draw = () => { o.querySelector('#pal-list').innerHTML = hits.slice(0, 60).map(([l, , h], n) => `<li role="option" aria-selected="${n === i}" data-n="${n}">${esc(l)}<span class="ad-muted">${esc(h)}</span></li>`).join('') || '<li class="ad-muted">No match</li>'; };
  q.addEventListener('input', () => { hits = items.filter(([l, , h]) => (l + ' ' + h).toLowerCase().includes(q.value.toLowerCase())); i = 0; draw(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { i = Math.min(i + 1, hits.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { i = Math.max(i - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && hits[i]) { closeOverlay(); hits[i][1](); }
  });
  o.querySelector('#pal-list').addEventListener('click', (e) => { const li = e.target.closest('[data-n]'); if (li) { closeOverlay(); hits[+li.dataset.n][1](); } });
  draw(); q.focus();
}
const commands = () => [
  ...NAV.map(([id, l]) => [`Go to ${l}`, () => go(id), '']), ...ADMIN.map(([id, l]) => [`Go to ${l}`, () => go(id), 'admin']),
  ...D.projects.map((p) => [`Project ${p}`, () => setScope(`p:${p}`), `${D.agents.filter((a) => a.repo === p).length} agents`]),
  ...D.agents.map((a) => [`Agent ${a.name}`, () => openAgent(a.name), short(a.repo)]),
  ['Pause all agents', () => toast(`Paused ${D.agents.filter((a) => a.life !== 'paused').length} agents. Runs in progress finish.`), 'admin'],
  ['Switch theme', () => theme(), ''], ['Keyboard shortcuts', () => help(), '?'],
];
function scopePicker() {
  const wait = (p) => D.inbox.filter((i) => i.repo === p).length;
  palette([
    ['My projects', () => setScope('mine'), `${MINE.length} projects`], ['All projects', () => setScope('all'), `${D.projects.length} projects`],
    ...[...D.projects].sort((a, b) => wait(b) - wait(a)).map((p) => [p, () => setScope(`p:${p}`), wait(p) ? `${wait(p)} waiting for you` : `${D.agents.filter((a) => a.repo === p).length} agents`]),
  ], 'Show projects: type a name');
}
function setScope(v) { scope = v; expanded.clear(); sel = 0; render(); }
function help() {
  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">Keyboard</h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div><div class="ad-drawer-body"><div class="p-help">
  <span><span class="ad-kbd">Ctrl K</span> <span class="ad-kbd">/</span></span><span>Search: pages, projects, agents, commands</span><span><span class="ad-kbd">P</span></span><span>Change the projects shown</span><span><span class="ad-kbd">G</span> <span class="ad-kbd">T</span></span><span>Today (P Projects, W Work, A Agents, U Usage, S Security)</span>
  <span><span class="ad-kbd">J</span> <span class="ad-kbd">K</span></span><span>Next, previous item</span><span><span class="ad-kbd">Enter</span></span><span>Open the item</span><span><span class="ad-kbd">Esc</span></span><span>Close the drawer</span>
  </div><p class="ad-muted">There is no one-key approve. A decision always opens the request first.</p></div>`);
}

// ---------- routing and events ----------
const TITLES = Object.fromEntries([...NAV, ...ADMIN, ['more', 'More']].map(([id, l]) => [id, l]));
function go(v) { location.hash = v; }
function render() {
  const view = (location.hash.slice(1) || 'today').split('?')[0];
  const v = V[view] ? view : 'today';
  renderNav(v); renderConn();
  document.getElementById('shell').classList.toggle('ad-shell-fill', v === 'chat');
  document.getElementById('crumbs').innerHTML = `<span class="ad-hide-phone">/</span><strong>${TITLES[v]}</strong>`;
  document.getElementById('main').innerHTML = V[v](); fill(document.body);
}
function theme() {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('ad-theme', r.dataset.theme); } catch (e) { /* storage blocked */ }
}
try { const t = localStorage.getItem('ad-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-chat],[data-chat-list],[data-chat-new],[data-chat-start],[data-chat-send],[data-chat-stop],[data-chat-end],[data-chat-ask],[data-chat-create],[data-chat-discard],[data-chat-assign],[data-open],[data-act],[data-confirm],[data-decide],[data-toast],[data-conn],[data-ext],[data-size],[data-scope],[data-pick],[data-expand],[data-fold],[data-ig],[data-av],.ad-item');
  if (!t) return;
  if (chatClick(t)) return;
  if (t.dataset.ext) { e.preventDefault(); toast('In the console this opens the issue or PR on the forge.'); return; }
  if (t.dataset.size) { setSize(t.dataset.size); toast(t.dataset.size === 'large' ? `Large example: ${D.projects.length} projects, ${D.agents.length} agents. Showing your ${MINE.length} projects.` : 'Small example: 7 agents.'); return; }
  if (t.dataset.scope) { setScope(t.dataset.scope); return; }
  if (t.dataset.pick) { scope = `p:${t.dataset.pick}`; expanded.clear(); location.hash === '#work' ? render() : go('work'); return; }
  if (t.dataset.expand) { const x = t.dataset.expand; expanded.has(x) ? expanded.delete(x) : expanded.add(x); render(); return; }
  if (t.dataset.fold) { const x = t.dataset.fold, open = t.getAttribute('aria-expanded') === 'true'; expanded.delete(x); expanded.delete(`-${x}`); expanded.add(open ? `-${x}` : x); render(); return; }
  if (t.dataset.ig) { inboxGroup = t.dataset.ig; expanded.clear(); render(); return; }
  if (t.dataset.av) { agentView = t.dataset.av; render(); return; }
  if (t.dataset.open) { const [kind, id] = t.dataset.open.split(':'); kind === 'approval' ? openApproval(id) : openAgent(id); return; }
  if (t.dataset.confirm) { const [id, d] = t.dataset.confirm.split(':'); openApproval(id, d); return; }
  if (t.dataset.decide) {
    const [id, d] = t.dataset.decide.split(':'); const a = D.approvals.find((x) => x.id === id); a.done = d;
    const ix = D.inbox.findIndex((x) => x.ref === id); if (ix >= 0) D.inbox.splice(ix, 1);
    closeOverlay(); render(); toast(`${DEC[d][0]}: ${id}. ${a.agent} continues in less than a minute.`); return;
  }
  if (t.dataset.toast) { closeOverlay(); toast(t.dataset.toast); return; }
  if (t.dataset.conn) { conn = t.dataset.conn; render(); return; }
  const act = t.dataset.act;
  if (act === 'close') closeOverlay();
  else if (act === 'conn-live') { conn = 'live'; render(); toast('Connected. The data is live again.'); }
  else if (act === 'pause-all') toast(`Paused ${S().agents.filter((a) => a.life !== 'paused').length} agents in the projects shown. Runs in progress finish.`);
  else if (act === 'add') toast('Add agent opens a short form: name, repository, forge, max. concurrent.');
  else if (act === 'add-limit') toast('Pick a project, then type its limits. A project limit can only be lower than the global limit.');
  else if (act === 'saved') toast('Saved. The effective limit applies to the next run.');
  else if (t.classList.contains('ad-item') && !e.target.closest('button,a')) { sel = +t.dataset.idx; t.querySelector('button, a')?.click(); }
});
let gKey = 0;
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); palette(commands(), 'Search pages, projects, agents, commands'); return; }
  if (e.key === 'Escape') { closeOverlay(); return; }
  if (typing || document.getElementById('overlay').innerHTML) return;
  if (gKey && Date.now() - gKey < 1200) { const m = { t: 'today', p: 'projects', w: 'work', a: 'agents', u: 'usage', s: 'security' }[e.key]; gKey = 0; if (m) go(m); return; }
  if (e.key === 'g') { gKey = Date.now(); return; }
  if (e.key === 'p') { scopePicker(); return; }
  if (e.key === '?') { help(); return; }
  const list = document.getElementById('inbox'); if (!list) return;
  const items = list.querySelectorAll('.ad-item');
  if (e.key === 'j' || e.key === 'k') { sel = Math.max(0, Math.min(items.length - 1, sel + (e.key === 'j' ? 1 : -1))); items.forEach((li, n) => li.setAttribute('aria-selected', n === sel)); items[sel]?.scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') items[sel]?.querySelector('button, a')?.click();
});
document.getElementById('open-palette').addEventListener('click', () => palette(commands(), 'Search pages, projects, agents, commands'));
document.getElementById('scope').addEventListener('click', scopePicker);
document.getElementById('theme').addEventListener('click', theme);
window.addEventListener('hashchange', () => { closeOverlay(); render(); document.getElementById('main').focus({ preventScroll: true }); });
// a link with #large opens the large example
if (location.hash === '#large') { try { history.replaceState(null, '', '#today'); } catch (e) { /* not allowed */ } D = largeData(); scope = 'mine'; }
fill(document.body); render();
})();
</script>
