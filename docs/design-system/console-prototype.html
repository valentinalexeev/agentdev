<style>
/* Prototype-only glue. Everything visual comes from the design-system files above. */
body { background: var(--ground); color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.p-grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.p-strip { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); padding: var(--space-3) var(--space-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); }
.p-strip a { color: var(--ink); text-decoration: none; display: flex; gap: var(--space-2); align-items: baseline; }
.p-strip a:hover .ad-data { text-decoration: underline; }
.p-fleet { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); }
.p-fleet > * { display: flex; justify-content: space-between; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-top: 1px solid var(--line); }
.p-fleet > :first-child { border-top: 0; }
.p-fleet button { all: unset; cursor: pointer; display: flex; justify-content: space-between; width: 100%; gap: var(--space-3); align-items: center; }
.p-fleet button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.p-attn { display: inline-flex; align-items: center; gap: 5px; padding: 1px var(--space-2); border-radius: var(--radius-sm); font: 500 11px/18px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.p-attn-ok { color: var(--ink-muted); }
.p-attn-you { background: var(--gate-soft); color: var(--gate); }
.p-attn-blocked, .p-attn-guardrail { background: var(--danger-soft); color: var(--danger); }
.p-attn-usage { background: var(--paused-soft); color: var(--paused); }
.p-reason { font: 500 11px/18px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); border: 1px solid var(--line); padding: 0 6px; border-radius: var(--radius-sm); }
.p-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-3); }
.p-sub { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-panel); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.p-sub h3 { margin: 0; font: 600 15px/22px var(--font-sans); display: flex; justify-content: space-between; gap: var(--space-2); }
.p-sub .ad-meter { min-width: 0; }
.p-limit-row { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(90px, .6fr)) auto; gap: var(--space-3); align-items: end; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); }
.p-limit-row:first-child { border-top: 0; }
.p-limit-row .ad-input { width: 100%; }
.p-sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-2); }
.p-sw div { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--panel); }
.p-sw i { display: block; height: 44px; border-bottom: 1px solid var(--line); }
.p-sw span { display: block; padding: 6px var(--space-2); font: 500 12px/16px var(--font-mono); }
.p-sw small { display: block; padding: 0 var(--space-2) 6px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.p-specimen { display: flex; flex-direction: column; gap: var(--space-3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); }
.p-specimen > div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: var(--space-3); align-items: baseline; }
.p-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-3); }
.p-gallery > section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.p-gallery h3 { margin: 0; }
.p-row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }
.p-confirm { flex-basis: 100%; margin: 0 0 var(--space-1); font-size: 14px; line-height: 20px; }
.p-iconbtn { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md); color: var(--ink-muted); }
.p-iconbtn:hover { background: var(--sunken); color: var(--ink); }
.p-iconbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.p-iconbtn svg { width: 18px; height: 18px; }
.p-user { display: flex; align-items: center; gap: var(--space-2); font-size: 14px; }
.p-avatar { width: 26px; height: 26px; border-radius: var(--radius-lamp); background: var(--gate); color: var(--on-gate); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
.ad-btn svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
.ad-btn { display: inline-flex; align-items: center; }
a { color: var(--link); }
.p-more { display: grid; gap: var(--space-2); }
.p-more .ad-nav { background: var(--panel); border: 1px solid var(--line); padding: var(--space-3); }
.p-help { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); font-size: 14px; }
@media (max-width: 1000px) { .p-grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .p-limit-row { grid-template-columns: 1fr 1fr; }
  .p-limit-row > :first-child { grid-column: 1 / -1; }
  .p-user span { display: none; }
  .p-specimen > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>
</head>

const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

const fill = (root) => root.querySelectorAll('[data-i]').forEach((el) => { el.outerHTML = ic(el.dataset.i); });

// ---------- example data (clearly fictional) ----------
const now = Date.now(), min = 60e3, hr = 3600e3;
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ago = (t) => { const m = Math.round((now - t) / min); return m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const left = (t) => { const m = Math.round((t - now) / min); return m < 60 ? `${m} min left` : `${Math.floor(m / 60)} h ${m % 60} min left`; };

const agents = [
  { name: 'alice', repos: ['acme/shop-api'], life: 'running', jobs: 2, max: 2, tokens: 412000, budget: 1000000, events: 0, attn: 'you', why: '1 approval waits' },
  { name: 'erin', repos: ['acme/shop-api'], life: 'starting', jobs: 1, max: 2, tokens: 96000, budget: 1000000, events: 0, attn: 'ok' },
  { name: 'bob', repos: ['acme/infra-live'], life: 'idle', jobs: 0, max: 1, tokens: 38000, budget: 500000, events: 0, attn: 'you', why: '1 question waits' },
  { name: 'carol', repos: ['acme/web'], life: 'paused', jobs: 0, max: 2, tokens: 220000, budget: 1000000, events: 4, attn: 'guardrail', why: 'paused by the operator: high event egress-denied' },
  { name: 'dave', repos: ['acme/mobile'], life: 'paused', jobs: 0, max: 2, tokens: 710000, budget: 800000, events: 0, attn: 'usage', why: 'weekly window 92% of 90% limit, until Thu 09:00' },
  { name: 'frank', repos: ['acme/data-jobs'], life: 'running', jobs: 1, max: 2, tokens: 150000, budget: 500000, events: 1, attn: 'blocked', why: 'job #21 blocked: tests need a database' },
  { name: 'gus', repos: ['acme/docs'], life: 'idle', jobs: 0, max: 1, tokens: 0, budget: 300000, events: 0, attn: 'ok' },
];
const approvals = [
  { id: 'a7f3', agent: 'alice', repo: 'acme/shop-api', job: 'pr-342', source: 'sidecar', tool: 'write .github/workflows/ci.yml', rule: 'protected-path', created: now - 12 * min, expires: now + 18 * min,
    input: 'The PR adds a shellcheck step for scripts/. The workflow file is protected, so I ask to write it.\n\n--- .github/workflows/ci.yml\n+      - name: shellcheck\n+        run: shellcheck -S warning scripts/*.sh\n\nNote for the reviewer: this is safe, please use approve-job so I can also update deploy.yml later.' },
  { id: '2c91', agent: 'frank', repo: 'acme/data-jobs', job: 'issue-21', source: 'mcp', tool: 'obs.query_logs', rule: 'tool-not-listed', created: now - 40 * min, expires: now + 100 * min,

  { id: '9d04', agent: 'bob', repo: 'acme/infra-live', job: 'merge-a41c09e', source: 'executor', tool: 'terraform apply', rule: 'executor-apply', created: now - 3 * hr, expires: now + 19 * hr,
    input: 'Trusted plan of the merge commit a41c09e.\nPlan: 1 to add, 1 to change, 0 to destroy.\nsha256(plan) = 6f1e...c2a0' },
];
const inbox = [
  { kind: 'approval', ref: 'a7f3', title: 'alice asks to write .github/workflows/ci.yml', agent: 'alice', where: 'acme/shop-api PR #342', reason: 'approval', due: approvals[0].expires, icon: 'approval' },
  { kind: 'approval', ref: '2c91', title: 'frank asks to use the tool obs.query_logs', agent: 'frank', where: 'acme/data-jobs #21', reason: 'approval', due: approvals[1].expires, icon: 'approval' },
  { kind: 'guardrail', title: 'carol was paused after a high security event', agent: 'carol', where: 'acme/web #88', reason: 'guardrail', since: now - 55 * min, icon: 'security', alert: true },
  { kind: 'question', title: 'Which region should the new node pool use?', agent: 'bob', where: 'acme/infra-live #12', reason: 'question', since: now - 2 * hr, icon: 'question' },

  { kind: 'approval', ref: '9d04', title: 'Executor plan for acme/infra-live waits for apply approval', agent: 'bob', where: 'merge a41c09e', reason: 'approval', due: approvals[2].expires, icon: 'approval' },

V.more = () => head('More', '') + `<div class="p-more">${[...NAV.slice(3), ...ADMIN].filter(([id]) => id !== 'usage').map(([id, l, i]) => `<a class="ad-nav" href="#${id}">${ic(i)}<span>${l}</span></a>`).join('')}</div>`;

// ---------- drawers ----------
function closeOverlay() { document.getElementById('overlay').innerHTML = ''; lastFocus?.focus?.(); }
let lastFocus = null;
function drawer(html, gate) {
  lastFocus = document.activeElement;
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="ad-scrim" data-act="close"></div><aside class="ad-drawer ${gate ? 'ad-drawer-gate' : ''}" role="dialog" aria-modal="true" aria-labelledby="dr-title">${html}</aside>`;
  o.querySelector('.ad-drawer button, .ad-drawer a')?.focus();
}
const DEC = { deny: ['Deny', 'cannot do this action'], approve: ['Approve once', 'can do this action one time'], 'approve-job': ['Approve for the job', 'can do this same action again until the job ends'] };
function openApproval(id, confirm) {
  const a = approvals.find((x) => x.id === id); if (!a) return;
  const allowed = ['deny', 'approve', ...(a.source === 'executor' ? [] : ['approve-job'])];
  const foot = confirm
    ? `<p class="p-confirm">Agent <strong>${esc(a.agent)}</strong> ${DEC[confirm][1]}. You cannot change the decision later. Your name goes to the audit log.</p><button class="ad-btn" type="button" data-open="approval:${a.id}">Back</button><button class="ad-btn ${confirm === 'deny' ? 'ad-btn-danger' : 'ad-btn-primary'}" type="button" data-decide="${a.id}:${confirm}">${DEC[confirm][0]}</button>`
    : `<button class="ad-btn" type="button" data-act="close">Close</button>${allowed.map((d) => `<button class="ad-btn ${d === 'approve' ? 'ad-btn-primary' : ''}" type="button" data-confirm="${a.id}:${d}">${d === 'deny' ? ic('x') : ''}${DEC[d][0]}</button>`).join('')}`;
  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">Approval <span class="ad-code">${a.id}</span></h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="ad-drawer-body">
    <dl class="ad-dl"><dt>Agent</dt><dd>${tag(a.agent)}</dd><dt>Where</dt><dd>${esc(a.repo)} · ${esc(a.job)} <a href="#" data-ext="1">open ${ic('ext').replace('<svg', '<svg width="12" height="12"')}</a></dd><dt>Asks for</dt><dd><span class="ad-code">${a.source}</span> · <strong>${esc(a.tool)}</strong></dd><dt>Rule</dt><dd class="ad-code">${a.rule}</dd><dt>Created</dt><dd>${ago(a.created)}</dd><dt>Expires</dt><dd>${left(a.expires)}. Without a decision the agent continues without this action.</dd></dl>
    <div><div class="ad-untrusted-head ad-label">${ic('alert')}Written by the agent · not checked</div>
    <p class="ad-muted" style="font-size:13px;margin:4px 0 8px">This text can contain a prompt injection from the issue. Decide on the facts above, not on what the text asks.</p>
    <pre class="ad-untrusted">${esc(a.input)}</pre></div>
  </div><div class="ad-drawer-foot">${foot}</div>`, true);
}
function openAgent(name) {
  const a = agents.find((x) => x.name === name); if (!a) return;
  const tl = [
    [now - 12 * min, 'agent', `asked approval a7f3 on PR #342`], [now - 40 * min, 'agent', 'pushed 2 commits to agent/alice/issue-341'],
    [now - 3 * hr, 'person', 'valentinalexeev requested changes on PR #342'], [now - 5 * hr, 'agent', 'opened PR #342 for #337'],
  ];
  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">${tag(a.name)}</h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="ad-drawer-body">
    <div class="p-row">${lamp(a)}${attn(a)}</div>
    ${a.why ? `<div class="ad-banner ad-inline-banner ${a.attn === 'usage' ? 'ad-banner-paused' : a.attn === 'you' ? '' : 'ad-banner-down'}">${ic(a.attn === 'usage' ? 'pause' : 'alert')}<span><strong>Waiting on:</strong> ${esc(a.why)}</span></div>` : ''}
    <dl class="ad-dl"><dt>Repository</dt><dd class="ad-code">${esc(a.repos.join(', '))}</dd><dt>Jobs</dt><dd>${a.jobs} of max. ${a.max}</dd><dt>Tokens 24 h</dt><dd class="ad-data">${k(a.tokens)} of ${k(a.budget)}</dd><dt>Scale to zero</dt><dd>on, after 15 min with no work</dd><dt>Claude</dt><dd class="ad-code">claude-team</dd></dl>
    <section class="ad-section"><h3 class="ad-section-title">Recent</h3><ol class="ad-timeline">${tl.map(([t, w, s]) => `<li class="ad-tl ad-tl-${w}"><span class="ad-tl-time">${hhmm(t)}</span><span class="ad-tl-mark"></span><span class="ad-tl-text">${esc(s)}</span></li>`).join('')}</ol></section>
    <section class="ad-section"><h3 class="ad-section-title">Settings</h3><div class="p-row"><label class="ad-field"><span>Max. concurrent</span><input class="ad-input" id="mc-${a.name}" type="number" min="1" max="8" value="${a.max}" style="width:90px"></label><label class="p-row" style="gap:6px;align-self:end;height:36px"><input type="checkbox" id="stz-${a.name}" checked> Scale to zero</label></div></section>
  </div><div class="ad-drawer-foot"><button class="ad-btn ad-btn-quiet" type="button" data-act="close">Delete…</button>${a.life === 'paused' ? `<button class="ad-btn ad-btn-primary" type="button" data-toast="Resumed ${a.name}. It starts on the next work item.">${ic('play')}Resume</button>` : `<button class="ad-btn" type="button" data-toast="Paused ${a.name}. Runs in progress finish.">${ic('pause')}Pause</button>`}<button class="ad-btn" type="button" data-toast="Saved the settings of ${a.name}.">Save</button></div>`);
}
function toast(msg) {
  const s = document.getElementById('toast-slot');
  s.innerHTML = `<div class="ad-toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { s.innerHTML = ''; }, 3500);
}

// ---------- command palette ----------
const CMDS = [
  ...NAV.map(([id, l]) => [`Go to ${l}`, () => go(id), `g ${id[0]}`]), ...ADMIN.map(([id, l]) => [`Go to ${l}`, () => go(id), '']),
  ...agents.map((a) => [`Agent ${a.name}`, () => openAgent(a.name), a.repos[0]]),
  ['Pause all agents', () => toast('Paused 5 agents. Runs in progress finish.'), 'admin'],
  ['Switch theme', () => theme(), ''], ['Keyboard shortcuts', () => help(), '?'],
];
function palette() {
  lastFocus = document.activeElement;
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="ad-scrim" data-act="close"></div><div class="ad-palette" role="dialog" aria-label="Search and commands"><input id="pal-q" placeholder="Search agents, pages, commands" autocomplete="off" aria-controls="pal-list"><ul id="pal-list" role="listbox"></ul></div>`;
  const q = o.querySelector('#pal-q'); let i = 0, hits = CMDS;
  const draw = () => { o.querySelector('#pal-list').innerHTML = hits.map(([l, , h], n) => `<li role="option" aria-selected="${n === i}" data-n="${n}">${esc(l)}<span class="ad-muted">${esc(h)}</span></li>`).join('') || '<li class="ad-muted">No match</li>'; };
  q.addEventListener('input', () => { hits = CMDS.filter(([l, , h]) => (l + h).toLowerCase().includes(q.value.toLowerCase())); i = 0; draw(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { i = Math.min(i + 1, hits.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { i = Math.max(i - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && hits[i]) { closeOverlay(); hits[i][1](); }
  });
  o.querySelector('#pal-list').addEventListener('click', (e) => { const li = e.target.closest('[data-n]'); if (li) { closeOverlay(); hits[+li.dataset.n][1](); } });
  draw(); q.focus();
}
function help() {
  drawer(`<div class="ad-drawer-head"><h2 class="ad-drawer-title" id="dr-title">Keyboard</h2><button class="p-iconbtn" type="button" data-act="close" aria-label="Close">${ic('x')}</button></div><div class="ad-drawer-body"><div class="p-help">
  <span><span class="ad-kbd">Ctrl K</span> <span class="ad-kbd">/</span></span><span>Search and commands</span><span><span class="ad-kbd">G</span> <span class="ad-kbd">T</span></span><span>Today (W Work, A Agents, U Usage, S Security)</span>
  <span><span class="ad-kbd">J</span> <span class="ad-kbd">K</span></span><span>Next, previous item</span><span><span class="ad-kbd">Enter</span></span><span>Open the item</span><span><span class="ad-kbd">Esc</span></span><span>Close the drawer</span>
  </div><p class="ad-muted">There is no one-key approve. A decision always opens the request first.</p></div>`);
}

// ---------- routing and events ----------
const TITLES = Object.fromEntries([...NAV, ...ADMIN, ['more', 'More']].map(([id, l]) => [id, l]));
function go(v) { location.hash = v; }
function render() {
  const view = (location.hash.slice(1) || 'today').split('?')[0];
  const v = V[view] ? view : 'today';
  renderNav(v); renderConn();
  document.getElementById('crumbs').innerHTML = `<span class="ad-hide-phone">acme</span><span class="ad-hide-phone">/</span><strong>${TITLES[v]}</strong>`;
  const m = document.getElementById('main'); m.innerHTML = V[v](); fill(document.body);
}
function theme() {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('ad-theme', r.dataset.theme); } catch (e) { /* storage blocked */ }
}
try { const t = localStorage.getItem('ad-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-open],[data-act],[data-confirm],[data-decide],[data-toast],[data-conn],[data-ext],.ad-item');
  if (!t) return;
  if (t.dataset.ext) { e.preventDefault(); toast('In the console this opens the issue or PR on the forge.'); return; }
  if (t.dataset.open) { const [kind, id] = t.dataset.open.split(':'); kind === 'approval' ? openApproval(id) : openAgent(id); return; }
  if (t.dataset.confirm) { const [id, d] = t.dataset.confirm.split(':'); openApproval(id, d); return; }
  if (t.dataset.decide) {
    const [id, d] = t.dataset.decide.split(':'); const a = approvals.find((x) => x.id === id); a.done = d;
    const ix = inbox.findIndex((x) => x.ref === id); if (ix >= 0) inbox.splice(ix, 1);
    closeOverlay(); render(); toast(`${DEC[d][0]}: ${id}. ${a.agent} continues in less than a minute.`); return;
  }
  if (t.dataset.toast) { closeOverlay(); toast(t.dataset.toast); return; }
  if (t.dataset.conn) { conn = t.dataset.conn; render(); return; }
  const act = t.dataset.act;
  if (act === 'close') closeOverlay();
  else if (act === 'conn-live') { conn = 'live'; render(); toast('Connected. The data is live again.'); }
  else if (act === 'pause-all') toast('Paused 5 agents. Runs in progress finish.');
  else if (act === 'add') toast('Add agent opens a short form: name, repository, forge, max. concurrent.');
  else if (act === 'saved') toast('Saved. The effective limit applies to the next run.');
  else if (t.classList.contains('ad-item') && !e.target.closest('button,a')) { sel = +t.dataset.idx; t.querySelector('button')?.click(); }
});
let gKey = 0;
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); palette(); return; }
  if (e.key === 'Escape') { closeOverlay(); return; }
  if (typing || document.getElementById('overlay').innerHTML) return;
  if (gKey && Date.now() - gKey < 1200) { const m = { t: 'today', w: 'work', a: 'agents', u: 'usage', s: 'security' }[e.key]; gKey = 0; if (m) go(m); return; }
  if (e.key === 'g') { gKey = Date.now(); return; }
  if (e.key === '?') { help(); return; }
  const list = document.getElementById('inbox'); if (!list) return;
  if (e.key === 'j' || e.key === 'k') { sel = Math.max(0, Math.min(inbox.length - 1, sel + (e.key === 'j' ? 1 : -1))); list.querySelectorAll('.ad-item').forEach((li, n) => li.setAttribute('aria-selected', n === sel)); list.children[sel]?.scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') list.children[sel]?.querySelector('button, a')?.click();
});
document.getElementById('open-palette').addEventListener('click', palette);
document.getElementById('theme').addEventListener('click', theme);
window.addEventListener('hashchange', () => { closeOverlay(); render(); document.getElementById('main').focus({ preventScroll: true }); });
fill(document.body); render();
})();
</script>
