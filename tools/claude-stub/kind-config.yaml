# kind cluster of the compatibility e2e (#178): as manifests/kind-config.yaml, but Gitea on host port 13000 and no
# Coder port, so it can run next to a development cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
    runtime_type = "io.containerd.runsc.v1"
nodes:
- role: control-plane
  extraPortMappings:
  - {containerPort: 30300, hostPort: 13000, protocol: TCP}
- role: worker
  labels:
    agentdev/pool: sandboxes
