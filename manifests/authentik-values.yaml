# authentik Helm values (#45), shared by kind (09-authentik.sh) and GKE. No instance values here: configuration and
# credentials come from Secret `authentik` (created by 09-authentik.sh; on GKE from Secret Manager, #51).
authentik:
  enabled: false                  # the chart must not create its own config Secret
  existingSecret: {secretName: authentik}
global:
  podLabels: {agentdev/db-client: "true"}     # allowed through the platform-db NetworkPolicy
  env:
    - {name: AUTHENTIK_POSTGRESQL__PORT, value: "5432"}
  # company SSO settings (#122) for manifests/authentik-blueprint-sso.yaml: AGENTDEV_SSO_* keys. Optional: without
  # the Secret the SSO blueprint creates nothing. Written by 09-authentik.sh (kind stand-in) or the playbook (GKE).
  envFrom:
    - secretRef: {name: authentik-sso, optional: true}
server:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
worker:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
postgresql: {enabled: false}      # the platform Postgres (platform.yaml.tmpl)
blueprints:
  configMaps: [authentik-blueprints]   # agentdev's OIDC application (manifests/authentik-blueprint-*.yaml), applied by the worker
