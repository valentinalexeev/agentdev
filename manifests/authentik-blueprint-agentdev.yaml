# authentik blueprint (#46): the agentdev OIDC application. 09-authentik.sh puts it in ConfigMap
# authentik-blueprints, mounted by the chart; the worker applies it at start and when it changes (identifiers make it
# update in place). Public client: the UI (#48) logs in with authorization code +
# PKCE; the API accepts that client's tokens (audience = client id). No secret to store.
version: 1
metadata: {name: agentdev OIDC application}
entries:
# forge login claims (#88, #122): the API maps a person to the forge user only through forge_login_<kind> (github,
# gitea) or the fallback forge_login, never through the username (users can choose it). Source: the user attributes
# of the same names, set by the company SSO source property
# mapping or by an administrator (users cannot edit it only while no flow/prompt writes attributes.forge_login*, admin.md). No attribute: no claim, the API gives read-only.
- model: authentik_providers_oauth2.scopemapping
  id: forge-login
  identifiers: {name: "agentdev: forge login"}
  attrs:
    scope_name: forge
    description: Forge login and groups (agentdev)
    expression: |
      # groups with inherited ones (#122): the profile scope lists direct groups only, so a member of
      # agentdev-admins-sso (child of agentdev-admins, synced from the company SSO) would not get agentdev-admins.
      # authentik merges this list into the profile one.
      claims = {"groups": sorted({g.name for g in request.user.all_groups()})}
      # forge_login_<kind> per forge kind (#122), forge_login as the fallback; the API picks the one of the agent's forge
      for key in ("forge_login", "forge_login_github", "forge_login_gitea"):
          login = request.user.attributes.get(key)
          if isinstance(login, str) and login:
              claims[key] = login
      return claims
- model: authentik_providers_oauth2.oauth2provider
  id: provider
  identifiers: {name: agentdev}
  attrs:
    client_type: public
    client_id: agentdev
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
    grant_types: [authorization_code, refresh_token]
    redirect_uris:
    # strict entries also set the CORS origin authentik allows for the browser's discovery/token calls
    - {matching_mode: strict, url: 'http://localhost:8091/callback'}   # local UI (./run.sh 11 port-forward)
    - {matching_mode: regex, url: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/.*$'}   # CLI and test logins
    property_mappings:
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !KeyOf forge-login
- model: authentik_core.application
  identifiers: {slug: agentdev}
  attrs: {name: agentdev, provider: !KeyOf provider}
# Platform operators (#57, #100): the API gives this group the right to pause, add and delete any agent. Created
# empty; add people to it in authentik (docs/admin.md). The name must match the API env ADMIN_GROUP.
- model: authentik_core.group
  identifiers: {name: agentdev-admins}
  attrs: {name: agentdev-admins}
