# Gitea as the MVP forge (rootless, SQLite, no install wizard).
# In-cluster: http://gitea.forge.svc.cluster.local:3000   Host: http://localhost:3000
apiVersion: v1
kind: Namespace
metadata: {name: forge}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gitea-data, namespace: forge}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitea, namespace: forge}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
      - name: gitea
        image: gitea/gitea:28.2-rootless
        env:
        - {name: GITEA__security__INSTALL_LOCK, value: "true"}
        - {name: GITEA__database__DB_TYPE, value: sqlite3}
        - {name: GITEA__server__ROOT_URL, value: "http://localhost:3000/"}
        - {name: GITEA__server__DOMAIN, value: localhost}
        - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
        - {name: GITEA__log__LEVEL, value: Warn}
        # Webhooks to agent pods (#3). Gitea checks both the host name and the resolved IP, so the list holds
        # the agents' Service names and the cluster Service range; nothing else private is reachable.
        - {name: GITEA__webhook__ALLOWED_HOST_LIST, value: "*.${AGENTS_NS}.svc.cluster.local,${SERVICE_CIDR}"}
        - {name: GITEA__webhook__DELIVER_TIMEOUT, value: "5"}
        ports: [{containerPort: 3000}]
        readinessProbe:
          httpGet: {path: /api/healthz, port: 3000}
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/gitea}
        - {name: data, mountPath: /etc/gitea, subPath: config}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: gitea-data}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: forge}
spec:
  type: NodePort
  selector: {app: gitea}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
