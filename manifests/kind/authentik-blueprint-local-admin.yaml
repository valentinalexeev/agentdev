# kind only (#100): puts the local owner akadmin into agentdev-admins, so the e2e has an admin without manual steps.
# 09-authentik.sh mounts it on kind next to manifests/authentik-blueprint-*.yaml. Sets the members of the group (not
# the groups of akadmin), so akadmin keeps "authentik Admins". The same identifier as in
# authentik-blueprint-agentdev.yaml makes it one group, whichever blueprint applies first.
version: 1
metadata: {name: agentdev local admin (kind)}
entries:
- model: authentik_core.group
  identifiers: {name: agentdev-admins}
  attrs:
    name: agentdev-admins
    users: [!Find [authentik_core.user, [username, akadmin]]]
