# Install agentdev onto the GKE cluster created by infra/terraform (#11 phase 2).
#
#   cd infra/ansible
#   ansible-galaxy collection install -r requirements.yml
#   $(terraform -chdir=../terraform output -raw get_credentials)     # kube context
#   ansible-playbook deploy.yml --check --diff                         # dry run
#   ansible-playbook deploy.yml
#
# Uses the same manifests as the kind setup (manifests/*.tmpl), so both environments stay in step.
# Secrets come from Secret Manager at run time (gcloud as the caller) and are only ever passed to
# the Kubernetes API: every task that touches one has no_log.
# Read-only checks first (#314): Claude secret formats (#212), same release (#218), CRDs, images on ghcr.io.
# Only the checks: --tags preflight (or scripts/upgrade-check.sh). Skip them: --skip-tags preflight.
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml
  tags: [preflight]

- name: Deploy agentdev to GKE
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    k8s_common: &k8s
      context: "{{ kube_context }}"
  tasks:
    # value checks (#384): the same file runs in render.yml, so the CI of a deployment repository finds them before a merge
    - name: Value checks of the instance (labels, executors, approvals, budget, wake source)
      ansible.builtin.include_tasks: tasks/checks.yml

    - name: Check the kube context exists
      ansible.builtin.command: kubectl config get-contexts {{ kube_context }} -o name
      changed_when: false

    - name: Read platform secrets from Secret Manager
      ansible.builtin.command: >-
        gcloud secrets versions access latest --secret {{ item }} --project {{ gcp_project }}
      loop:
        - "{{ sm_claude_shared }}"
        - "{{ sm_router_register_token }}"
        - "{{ sm_forge_webhook_secret }}"
      register: platform_secrets
      changed_when: false
      no_log: true

    - name: Keep them in facts (not logged)
      ansible.builtin.set_fact:
        claude_shared_env: "{{ platform_secrets.results[0].stdout }}"
        register_token: "{{ platform_secrets.results[1].stdout }}"
        forge_webhook_secret: "{{ platform_secrets.results[2].stdout }}"
      no_log: true

    - name: Refuse a claude-shared without a recognised key (#212)
      ansible.builtin.include_tasks: tasks/claude_credential.yml
      vars:
        claude_cred_text: "{{ claude_shared_env }}"
        claude_cred_name: "{{ sm_claude_shared }}"

    - name: Forge sidecar egress credential (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="{{ sm_egress_forge_proxy }}"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
        fi
        gcloud secrets versions access latest --secret "$name" --project {{ gcp_project }}
      args: {executable: /bin/bash}
      register: forge_proxy_key
      changed_when: false
      when: not ansible_check_mode
      no_log: true

    - name: Per-agent wake tokens (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="agent-{{ item.name }}-wake-token"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
          echo created
        fi
      args: {executable: /bin/bash}
      loop: "{{ agents }}"
      register: wake_created
      changed_when: "'created' in wake_created.stdout"

    - name: Read per-agent secrets
      ansible.builtin.shell: |
        set -euo pipefail
        p={{ gcp_project }}
        {% if forge_kind == 'github' %}
        echo -   # GitHub: no per-agent forge token, the sidecar mints App installation tokens (#2)
        {% else %}
        printf '%s\n' "$(gcloud secrets versions access latest --secret agent-{{ item.name }}-forge-token --project $p)"
        {% endif %}
        printf '%s\n' "$(gcloud secrets versions access latest --secret agent-{{ item.name }}-wake-token --project $p)"
        if gcloud secrets describe agent-{{ item.name }}-claude --project $p >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret agent-{{ item.name }}-claude --project $p
        fi
      args: {executable: /bin/bash}
      loop: "{{ agents }}"
      register: agent_secrets
      changed_when: false
      no_log: true

    # An agent-<name>-claude that exists but has no recognised key would silently fall back to claude-shared (#212).
    - name: Refuse an agent-<name>-claude without a recognised key (#212)
      ansible.builtin.include_tasks: tasks/claude_credential.yml
      vars:
        claude_cred_text: "{{ agent_secrets.results[idx].stdout_lines[2:] | join('\n') }}"
        claude_cred_name: "agent-{{ item.name }}-claude"
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      when: agent_secrets.results[idx].stdout_lines[2:] | map('trim') | select | list | length > 0

    - name: GitHub App private key (#2), only for the agents' forge sidecars
      ansible.builtin.command: gcloud secrets versions access latest --secret {{ sm_github_app_private_key }} --project {{ gcp_project }}
      register: github_app_key
      changed_when: false
      no_log: true
      when: forge_kind == 'github'

    # Deterministic executors (#69), optional. Per executor: the forge token from Secret Manager
    # (exec-<name>-forge-token), optional plan/apply env Secrets (exec-<name>-plan-env, exec-<name>-apply-env: KEY=VALUE
    # lines), and on GKE two Kubernetes service accounts bound by Workload Identity to the read-only and the write
    # Google service account. The Google accounts and their IAM roles are the deployment's (terraform), never agentdev's.
    - name: Read executor secrets (forge token required; plan and apply env optional)
      ansible.builtin.shell: |
        set -euo pipefail
        s="exec-{{ item.0.name }}-{{ 'forge-token' if item.1 == 'forge' else item.1 + '-env' }}"
        if [ "{{ item.1 }}" = forge ] || gcloud secrets describe "$s" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret "$s" --project {{ gcp_project }}
        fi
      args: {executable: /bin/bash}
      loop: "{{ executors | product(['forge', 'plan', 'apply']) | list }}"
      loop_control: {label: "exec-{{ item.0.name }}-{{ item.1 }}"}
      register: exec_secrets
      changed_when: false
      no_log: true

    # Wake poll (#181): the router's read-only forge credential. GitHub: the App (the router narrows its installation
    # tokens to read access); Gitea: the optional Secret Manager entry router-poll-forge-token (a read-only token).
    - name: Gitea read-only token of the wake poll (optional)
      ansible.builtin.shell: |
        set -euo pipefail
        if gcloud secrets describe {{ sm_router_poll_token }} --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret {{ sm_router_poll_token }} --project {{ gcp_project }}
        fi
      args: {executable: /bin/bash}
      register: router_poll_token
      changed_when: false
      no_log: true
      when: forge_kind == 'gitea' and (wake_poll_seconds | int) > 0

    - name: Scale to zero on Gitea has a wake poll token or webhooks (#190)
      ansible.builtin.include_tasks: tasks/wake_source.yml
      vars: {wake_poll_token: "{{ router_poll_token.stdout | default('') }}"}
      when: forge_kind == 'gitea' and (wake_poll_seconds | int) > 0

    # ---------- Claude credential proxy (#66, same template as 06-agents.sh) ----------
    - name: Claude proxy signing key (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="{{ sm_claude_proxy_signing }}"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
          echo created
        fi
      args: {executable: /bin/bash}
      register: proxy_signing_created
      changed_when: "'created' in proxy_signing_created.stdout"
      when: claude_proxy | bool and not ansible_check_mode

    - name: Claude proxy keys of the agents (HMAC of the agent name; never the credential)
      ansible.builtin.shell: |
        set -euo pipefail
        k=$(gcloud secrets versions access latest --secret {{ sm_claude_proxy_signing }} --project {{ gcp_project }})
        for a in {{ agents | map(attribute='name') | map('quote') | join(' ') }}; do
          [[ "$a" =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]] || { echo "bad agent name" >&2; exit 1; }
          printf '%s.%s\n' "$a" "$(printf 'agentdev-claude-proxy/v1:%s' "$a" | openssl dgst -sha256 -hmac "$k" -r | cut -d' ' -f1)"
        done
        printf 'SIGNING=%s\n' "$k"
      args: {executable: /bin/bash}
      register: proxy_keys
      changed_when: false
      when: claude_proxy | bool and not ansible_check_mode
      no_log: true

    # the Claude proxy NetworkPolicy names the API server (#352). platform.kube_api_ips (terraform output platform) is the
    # source; without it the addresses are read here to fill that one value, never to choose a template (#384)
    - name: API server addresses (Service default/kubernetes) for the Claude proxy egress
      kubernetes.core.k8s_info:
        <<: *k8s
        kind: "{{ item }}"
        namespace: default
        name: kubernetes
      loop: [Service, Endpoints]
      register: kube_api
      when: claude_proxy | bool and (platform | default({})).kube_api_ips is not defined

    - name: Agents with their own Claude Secret (agent-<name>-claude has a KEY=VALUE line, issue 5)
      ansible.builtin.set_fact:
        agent_own_claude: >-
          {{ agent_own_claude | default({}) | combine({item.name:
             agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | list | length > 0}) }}
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      no_log: true

    - name: Values for the renderer (API server addresses, forge proxy credential hash)
      ansible.builtin.set_fact:
        kube_api_ips_read: >-
          {{ ((kube_api.results[0].resources | default([]))[:1] | map(attribute='spec.clusterIP') | list)
             + ((kube_api.results[1].resources | default([])) | map(attribute='subsets', default=[]) | flatten
                | map(attribute='addresses', default=[]) | flatten | map(attribute='ip') | list)
             if kube_api.results is defined else [] }}
        forge_proxy_auth_sha: "{{ (forge_proxy_key.stdout | default('') | hash('sha256'))[:16] }}"
      no_log: true

    # #449 review: a cluster that does not serve a CRD the values select fails here with a clear message, also under
    # --check. This read only checks; it never selects a template (#384 criterion 3). render.yml does not run it.
    - name: Read the CRDs the instance values need (FQDNNetworkPolicy, Gateway API)
      kubernetes.core.k8s_info:
        <<: *k8s
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.name }}"
      loop: >-
        {{ ([{'name': 'fqdnnetworkpolicies.networking.gke.io',
              'why': 'platform.egress.fqdn gke. Apply infra/terraform, or set platform.egress.fqdn: none'}]
            if deploy_fqdn == 'gke' else [])
           + ([{'name': 'gateways.gateway.networking.k8s.io',
                'why': 'ingress.mode gateway. Set Terraform public_hosts and apply, or use ingress.mode external'}]
              if deploy_gateway | bool else []) }}
      loop_control: {label: "{{ item.name }}"}
      register: deploy_crds
      vars:
        deploy_fqdn: >-
          {{ (((platform | default({})).egress | default({})).fqdn
             | default('gke' if egress_fqdn_policy | bool else 'none')) | string }}
        deploy_gateway: >-
          {{ ((ingress | default({})).host | default('') | length > 0 or (ingress | default({})).mode is defined)
             and (ingress | default({})).mode | default('gateway') == 'gateway' }}

    - name: Stop when the cluster does not serve a CRD the instance values need
      ansible.builtin.assert:
        that: item.resources | length > 0
        fail_msg: "The cluster does not serve the CRD {{ item.item.name }}. It is needed by {{ item.item.why }}."
        quiet: true
      loop: "{{ deploy_crds.results | default([]) }}"
      loop_control: {label: "{{ item.item.name }}"}

    # one renderer for deploy.yml and render.yml (#384); the objects have no secret values, the Secrets are made below
    - name: Render the instance objects (tasks/render_objects.yml)
      ansible.builtin.include_tasks: tasks/render_objects.yml

    - name: Namespaces
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.namespaces }}"
      when: agentdev_objects.namespaces | length > 0

    - name: RuntimeClass gvisor (GKE Sandbox ships it as gvisor already; ensure it exists)
      kubernetes.core.k8s:
        <<: *k8s
        state: present
        definition: {apiVersion: node.k8s.io/v1, kind: RuntimeClass, metadata: {name: gvisor}, handler: gvisor}
      failed_when: false   # GKE manages this object; an existing one is fine

    # claude-shared holds KEY=VALUE lines (ANTHROPIC_API_KEY=... or CLAUDE_CODE_OAUTH_TOKEN=...)
    - name: Shared Claude credential
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: claude-shared, namespace: "{{ agents_ns }}"}
          stringData: "{{ dict(claude_shared_env.splitlines() | select('search', '=') | map('split', '=', 1)) }}"
      no_log: true

    - name: Webhook router Secret (forge webhook secret, register token)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: webhook-router, namespace: "{{ agents_ns }}"}
          stringData:
            FORGE_SECRETS: "{{ forge_kind }}={{ forge_webhook_secret }}"
            REGISTER_TOKEN: "{{ register_token }}"
      no_log: true

    - name: Webhook router
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.router }}"
      when: agentdev_objects.router | length > 0

    - name: Forge sidecar egress credential Secret (password for the sidecar, header regex for Squid)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: egress-forge-proxy, namespace: "{{ agents_ns }}"}
          stringData:
            password: "{{ forge_proxy_key.stdout }}"
            auth: "^Basic {{ ('forge:' ~ forge_proxy_key.stdout) | b64encode }}$"
      when: not ansible_check_mode
      no_log: true

    - name: Egress allow-list (#65) - proxy and agent NetworkPolicy
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.egress }}"
      when: agentdev_objects.egress | length > 0

    # platform.egress.fqdn gke (#65, #384): Dataplane V2 enforces this on the proxy pod, so even a changed squid.conf
    # reaches nothing else. The preflight (crds) checks that the cluster serves the type.
    - name: "Egress proxy FQDNNetworkPolicy (GKE, #65)"
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.egress_fqdn }}"
      when: platform_fqdn == 'gke'

    - name: Remove the web policy of the egress proxy (the FQDN policy is on)
      kubernetes.core.k8s:
        <<: *k8s
        state: absent
        definition: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, metadata: {name: egress-proxy-web, namespace: "{{ agents_ns }}"}}
      when: platform_fqdn == 'gke'

    - name: Egress proxy may reach any address on 80/443 (FQDN policy off; Squid alone enforces the list)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.egress_web }}"
      when: platform_fqdn == 'none'

    - name: "Agent, SecurityEvent, Approval, Executor, ExecutorRun, ProjectSecret and McpProject CRDs (#47, #70, #67, #69, #202, #383)"
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.crds }}"
        # Agents below need the type to be served
        wait: true
        wait_condition: {type: Established, status: "True"}
        wait_timeout: 60

    - name: "Postgres + ContextForge, then one McpProject per project (#51, #383)"
      ansible.builtin.include_role: {name: platform}

    # authentik (#114): same chart, values and blueprints as ./run.sh 09; before the API, which uses it as the issuer
    - name: Identity provider authentik (blueprints, break-glass admin)
      ansible.builtin.include_role: {name: authentik}
      when: authentik_enabled | bool

    # Company SSO for authentik (#122): only when instance.yml sets authentik.sso. Writes the Secret authentik-sso and
    # restarts authentik (deployed by the role authentik above).
    - name: Company SSO settings for authentik (Secret authentik-sso)
      ansible.builtin.include_role: {name: authentik_sso}
      when: ((authentik | default({})).sso | default({})) | length > 0

    # Management API (#46, #104): needs an OIDC provider: api.oidc_issuer, or authentik on ingress.auth_host (#114).
    - name: Management API (database roles, Secrets, Deployment)
      ansible.builtin.include_role: {name: api}
      when: api_effective_issuer | length > 0

    # External Gitea (#442), opt-in: collaborators, labels, router webhook and branch protection through the Gitea API
    # (Job forge-init-<hash>, admin token from Secret Manager through ESO). Default: secrets-only, nothing runs here.
    - name: Optional setup of the external Gitea (forge-init Job)
      ansible.builtin.include_tasks: tasks/forge_init.yml
      when: forge_kind == 'gitea' and (forge_init.enabled | default(false) | bool)

    # Public HTTPS entry point (#120): Gateway with the Terraform static IP and managed certificate. Only the webhook
    # path of the router and the web UI (with its /api proxy) are public. Runs only when instance.yml sets ingress.host
    # or ingress.mode. ingress.mode external (#160): no Gateway; your own reverse proxy publishes the hosts.
    - name: Public entry point (Gateway, or external ingress)
      ansible.builtin.include_role: {name: ingress}
      when: (ingress | default({})).host | default('') | length > 0 or (ingress | default({})).mode is defined

    - name: "Agent StorageClass (pd-standard, #173)"
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.storage_class }}"
      when: agentdev_objects.storage_class | length > 0

    - name: Agent operator (#47); it renders every agent's StatefulSet
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.operator }}"
      when: agentdev_objects.operator | length > 0

    - name: Executors namespace labels (#184)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.exec_namespace }}"
      when: agentdev_objects.exec_namespace | length > 0

    - name: Executor egress allow-list (#135) - proxy and executor NetworkPolicy
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.exec_egress }}"
      when: agentdev_objects.exec_egress | length > 0

    - name: "Executor egress proxy FQDNNetworkPolicy (GKE, #135)"
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.exec_egress_fqdn }}"
      when: platform_fqdn == 'gke'

    - name: Remove the web policy of the executor egress proxy (the FQDN policy is on)
      kubernetes.core.k8s:
        <<: *k8s
        state: absent
        definition: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, metadata: {name: executor-egress-proxy-web, namespace: "{{ exec_ns }}"}}
      when: platform_fqdn == 'gke'

    - name: Executor egress proxy may reach any address on 80/443 (FQDN policy off)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.exec_egress_web }}"
      when: platform_fqdn == 'none'

    - name: Executor Secrets exec-<name>-forge (FORGE_TOKEN), -plan and -apply (KEY=VALUE lines)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "exec-{{ item.item.0.name }}-{{ item.item.1 }}", namespace: "{{ exec_ns }}"}
          stringData: >-
            {{ {'FORGE_TOKEN': item.stdout | trim} if item.item.1 == 'forge'
               else dict(item.stdout.splitlines() | select('search', '=') | map('split', '=', 1)) }}
      loop: "{{ exec_secrets.results | default([]) }}"
      loop_control: {label: "exec-{{ item.item.0.name }}-{{ item.item.1 }}"}
      no_log: true

    - name: Executor service accounts (GKE Workload Identity, read-only for plan, write for apply)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.exec_service_accounts }}"
      when: agentdev_objects.exec_service_accounts | length > 0

    - name: Executors (#69)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.executors }}"
      when: agentdev_objects.executors | length > 0 and not ansible_check_mode   # the type is unknown before the CRD exists

    - name: Per-agent token Secrets (agent-<name>), read by the operator-rendered pods
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "agent-{{ item.name }}", namespace: "{{ agents_ns }}"}
          # one Secret per agent in both cases, so the operator's binding agent-<name> (R21) holds
          stringData: >-
            {{ {'WAKE_TOKEN': agent_secrets.results[idx].stdout_lines[1], 'REGISTER_TOKEN': register_token}
               | combine({'GITHUB_APP_ID': github_app.app_id | string, 'GITHUB_APP_PRIVATE_KEY': github_app_key.stdout,
                          'GITHUB_INSTALLATION_ID': github_app.installation_id | default('') | string}
                         if forge_kind == 'github' else
                         {'FORGE_TOKEN': agent_secrets.results[idx].stdout_lines[0]}) }}
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      no_log: true

    - name: Wake poll credential (Secret webhook-router-poll, router pod only)
      kubernetes.core.k8s:
        <<: *k8s
        state: "{{ 'present' if (wake_poll_seconds | int) > 0 else 'absent' }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: webhook-router-poll, namespace: "{{ agents_ns }}"}
          stringData: >-
            {{ {'github-app-id': github_app.app_id | string, 'private-key.pem': github_app_key.stdout,
                'github-installation-id': github_app.installation_id | default('') | string}
               if forge_kind == 'github' else {'gitea-token': router_poll_token.stdout | default('')} }}
      no_log: true

    - name: Claude proxy signing Secret
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: claude-proxy-signing, namespace: "{{ agents_ns }}"}
          stringData: {key: "{{ proxy_keys.stdout_lines[-1] | regex_replace('^SIGNING=', '') }}"}
      when: claude_proxy | bool and not ansible_check_mode
      no_log: true

    - name: Per-agent proxy key Secrets (agent-<name>-proxy), the only Claude-related value in an agent pod
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "agent-{{ item.split('.')[0] }}-proxy", namespace: "{{ agents_ns }}"}
          stringData: {ANTHROPIC_AUTH_TOKEN: "{{ item }}"}
      loop: "{{ proxy_keys.stdout_lines[:-1] if (claude_proxy | bool and not ansible_check_mode) else [] }}"
      no_log: true

    - name: Claude credential proxy
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.claude_proxy }}"
      when: agentdev_objects.claude_proxy | length > 0

    - name: Claude proxy FQDNNetworkPolicy (egress to api.anthropic.com only)
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.claude_proxy_fqdn }}"
      when: agentdev_objects.claude_proxy_fqdn | length > 0

    - name: Claude proxy egress is not narrowed by name (platform.egress.fqdn none)
      ansible.builtin.debug:
        msg: "FQDNNetworkPolicy is off: claude-proxy may reach any public address on 443 (docs/security.md R63)"
      when: claude_proxy | bool and platform_fqdn != 'gke'

    # blocked agents (#27) stay stopped: the operator keeps agentdev/blocked StatefulSets at 0
    - name: "Agents (#57): one Agent object each; own Claude secret if present, else the shared one (#5)"
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ agentdev_objects.agents }}"
      # --check does not create the CRD, so on a first run the Agent type is unknown: skip, like the wait below.
      # agents_source git (#58): Flux applies the Agent objects from the deployment repository, not the playbook
      when: not ansible_check_mode and (agents_source | default('api')) == 'api'

    - name: Per-agent Claude secrets (only agents that have one)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "claude-{{ item.name }}", namespace: "{{ agents_ns }}"}
          stringData: "{{ dict(agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | map('split', '=', 1)) }}"
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      when: agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | list | length > 0
      no_log: true

    # SIEM outputs (#70, #71): non-secret settings from instance.yml security.siem.*, secret values (webhook secret,
    # OTLP headers, CA, client certificate and key) as KEY=VALUE lines in the optional Secret Manager secret
    # sm_security_siem. Both go into the Secret agentdev-api-siem that the API reads (manifests/api.yaml.tmpl); same
    # keys as .secrets/platform/siem-webhook on kind (10-api.sh). The role api reads it (#104).
    - name: Read the SIEM output secrets (optional)
      ansible.builtin.shell: |
        if gcloud secrets describe {{ sm_security_siem }} --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret {{ sm_security_siem }} --project {{ gcp_project }}
        fi
      register: siem_secret
      changed_when: false
      no_log: true

    - name: SIEM outputs Secret agentdev-api-siem
      vars:
        siem: "{{ security.siem | default({}) }}"
        siem_env:
          SECURITY_WEBHOOK_URL: "{{ siem.webhook_url | default('') }}"
          SECURITY_SYSLOG_ADDR: "{{ siem.syslog_addr | default('') }}"
          SECURITY_SYSLOG_SERVER_NAME: "{{ siem.syslog_server_name | default('') }}"
          SECURITY_OTLP_URL: "{{ siem.otlp_url | default('') }}"
          SECURITY_OTLP_SERVER_NAME: "{{ siem.otlp_server_name | default('') }}"
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentdev-api-siem, namespace: "{{ platform_ns }}"}
          stringData: >-
            {{ siem_env | dict2items | rejectattr('value', 'equalto', '') | items2dict
               | combine(dict(siem_secret.stdout_lines | select('search', '=') | map('split', '=', 1))) }}
      when: (security.siem | default({})) | length > 0 or siem_secret.stdout | length > 0
      no_log: true

    # same checks as run.sh 06 and 12 (rollout status): a Deployment that does not become ready fails the run (#121)
    - name: Wait for the operator, router, egress proxies and Claude proxy
      ansible.builtin.command: >-
        kubectl --context {{ kube_context }} -n {{ item.ns }} rollout status deploy/{{ item.name }} --timeout=180s
      loop: "{{ [{'ns': platform_ns, 'name': 'agentdev-operator'}, {'ns': agents_ns, 'name': 'webhook-router'},
                 {'ns': agents_ns, 'name': 'egress-proxy'}, {'ns': exec_ns, 'name': 'executor-egress-proxy'}]
                + ([{'ns': agents_ns, 'name': 'claude-proxy'}] if claude_proxy | bool else []) }}"
      loop_control: {label: "{{ item.name }}"}
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for the router and agents
      kubernetes.core.k8s_info:
        <<: *k8s
        kind: Pod
        namespace: "{{ agents_ns }}"
        wait: true
        wait_condition: {type: Ready, status: "True"}
        wait_timeout: 600
        label_selectors: ["{{ item }}"]
      loop: ["app=webhook-router", "app=coding-agent"]
      when: not ansible_check_mode

    # post-deploy smoke test (#213): the public hosts answer from outside and the forwarder is Ready. Last, after the
    # router and the UI are up. Off with ingress.smoke: false.
    - name: Post-deploy smoke test of the public hosts
      ansible.builtin.include_role: {name: ingress, tasks_from: smoke.yml}
      when:
        - not ansible_check_mode
        - (ingress | default({})).host | default('') | length > 0
        - (ingress | default({})).smoke | default(true) | bool
