# Install agentdev onto the GKE cluster created by infra/terraform (#11 phase 2).
#
#   cd infra/ansible
#   ansible-galaxy collection install -r requirements.yml
#   $(terraform -chdir=../terraform output -raw get_credentials)     # kube context
#   ansible-playbook deploy.yml --check --diff                         # dry run
#   ansible-playbook deploy.yml
#
# Uses the same manifests as the kind setup (manifests/*.tmpl), so both environments stay in step.
# Secrets come from Secret Manager at run time (gcloud as the caller) and are only ever passed to
# the Kubernetes API: every task that touches one has no_log.
- name: Deploy agentdev to GKE
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    k8s_common: &k8s
      context: "{{ kube_context }}"
  tasks:
    - name: Instance values come from the deployment repo (see example.vars.yml)
      ansible.builtin.assert:
        that:
          - gcp_project is defined and gcp_project | length > 0
          - gcp_zone is defined and gcp_zone | length > 0
          - image_tag is defined and image_tag | length > 0
          - reviewer is defined and reviewer | length > 0
          - agents is defined and agents | length > 0
        fail_msg: "Missing instance values. Pass them with -e @instance.yml (see infra/ansible/example.vars.yml)."
        quiet: true

    - name: Check the kube context exists
      ansible.builtin.command: kubectl config get-contexts {{ kube_context }} -o name
      changed_when: false

    - name: Read platform secrets from Secret Manager
      ansible.builtin.command: >-
        gcloud secrets versions access latest --secret {{ item }} --project {{ gcp_project }}
      loop:
        - "{{ sm_claude_shared }}"
        - "{{ sm_router_register_token }}"
        - "{{ sm_forge_webhook_secret }}"
      register: platform_secrets
      changed_when: false
      no_log: true

    - name: Keep them in facts (not logged)
      ansible.builtin.set_fact:
        claude_shared_env: "{{ platform_secrets.results[0].stdout }}"
        register_token: "{{ platform_secrets.results[1].stdout }}"
        forge_webhook_secret: "{{ platform_secrets.results[2].stdout }}"
      no_log: true

    - name: Namespace
      kubernetes.core.k8s:
        <<: *k8s
        definition: {apiVersion: v1, kind: Namespace, metadata: {name: "{{ agents_ns }}"}}

    - name: RuntimeClass gvisor (GKE Sandbox ships it as gvisor already; ensure it exists)
      kubernetes.core.k8s:
        <<: *k8s
        state: present
        definition: {apiVersion: node.k8s.io/v1, kind: RuntimeClass, metadata: {name: gvisor}, handler: gvisor}
      failed_when: false   # GKE manages this object; an existing one is fine

    # claude-shared holds KEY=VALUE lines (ANTHROPIC_API_KEY=... or CLAUDE_CODE_OAUTH_TOKEN=...)
    - name: Shared Claude credential
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: claude-shared, namespace: "{{ agents_ns }}"}
          stringData: "{{ dict(claude_shared_env.splitlines() | select('search', '=') | map('split', '=', 1)) }}"
      no_log: true

    - name: Webhook router
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_router) | from_yaml_all | list }}"
      vars:
        vars_router:
          src: "{{ repo_root }}/manifests/router.yaml.tmpl"
          values:
            AGENTS_NS: "{{ agents_ns }}"
            FORGE_SECRETS: "{{ forge_kind }}={{ forge_webhook_secret }}"
            REGISTER_TOKEN: "{{ register_token }}"
            ROUTER_IMAGE: "{{ router_image }}"
            IMAGE_PULL_POLICY: IfNotPresent
          replace: []
      no_log: true

    - name: Forge sidecar egress credential (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="{{ sm_egress_forge_proxy }}"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
        fi
        gcloud secrets versions access latest --secret "$name" --project {{ gcp_project }}
      args: {executable: /bin/bash}
      register: forge_proxy_key
      changed_when: false
      when: not ansible_check_mode
      no_log: true

    - name: Forge sidecar egress credential Secret (password for the sidecar, header regex for Squid)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: egress-forge-proxy, namespace: "{{ agents_ns }}"}
          stringData:
            password: "{{ forge_proxy_key.stdout }}"
            auth: "^Basic {{ ('forge:' ~ forge_proxy_key.stdout) | b64encode }}$"
      when: not ansible_check_mode
      no_log: true

    - name: Egress allow-list (#65) - proxy and agent NetworkPolicy
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_egress) | from_yaml_all | list }}"
      vars:
        vars_egress:
          src: "{{ repo_root }}/manifests/egress.yaml.tmpl"
          values:
            AGENTS_NS: "{{ agents_ns }}"
            PLATFORM_NS: "{{ platform_ns }}"
            FORGE_NS: forge
            BOTBOARD_NS: botboard
            # with the credential proxy, only claude-proxy reaches the Claude API (docs/security.md R64)
            EGRESS_HOSTS: "{{ (egress_hosts + egress_extra_hosts) | reject('in', [claude_proxy_upstream_host] if claude_proxy | bool else []) | join(' ') }}"
            FORGE_EGRESS_HOSTS: "{{ forge_egress_hosts | join(' ') }}"
            FORGE_PROXY_AUTH_SHA: "{{ (forge_proxy_key.stdout | default('') | hash('sha256'))[:16] }}"
            EGRESS_PROXY_IMAGE: "{{ egress_proxy_image }}"
          replace: []

    # Dataplane V2 enforces this on the proxy pod: even a changed squid.conf reaches nothing else. Squid's
    # ".example.com" becomes the name example.com plus the pattern *.example.com (GKE patterns match one level only);
    # the mapping lives in egress_fqdn.j2 (tested by tests/egress_fqdn.yml).
    - name: Egress hosts as FQDNNetworkPolicy matches
      ansible.builtin.set_fact:
        egress_fqdn_matches: "{{ lookup('ansible.builtin.template', 'egress_fqdn.j2') | from_yaml }}"

    - name: Is the FQDNNetworkPolicy type served (enable_fqdn_network_policy)?
      kubernetes.core.k8s_info:
        <<: *k8s
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: fqdnnetworkpolicies.networking.gke.io
      register: fqdn_crd
      when: egress_fqdn_policy | bool

    # also runs in --check (a dry run against the served type) when the type exists; without it the proxy has DNS only
    - name: "Egress proxy FQDNNetworkPolicy (GKE, #65)"
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: networking.gke.io/v1alpha1
          kind: FQDNNetworkPolicy
          metadata: {name: egress-proxy, namespace: "{{ agents_ns }}"}
          spec:
            podSelector: {matchLabels: {app: egress-proxy}}
            egress:
              - matches: "{{ egress_fqdn_matches }}"
                ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]
      when: egress_fqdn_policy | bool and (fqdn_crd.resources | default([]) | length > 0)

    - name: The FQDN policy is on, but the cluster does not serve it
      ansible.builtin.fail:
        msg: >-
          egress_fqdn_policy is true, but FQDNNetworkPolicy is not available: apply infra/terraform
          (enable_fqdn_network_policy) or set egress_fqdn_policy: false
      when: egress_fqdn_policy | bool and (fqdn_crd.resources | default([]) | length == 0) and not ansible_check_mode

    - name: Egress proxy may reach any address on 80/443 when the FQDN policy is off (Squid alone enforces the list)
      kubernetes.core.k8s:
        <<: *k8s
        state: "{{ 'absent' if egress_fqdn_policy | bool else 'present' }}"
        definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_web) | from_yaml }}"
      vars:
        vars_web:
          src: "{{ repo_root }}/manifests/egress-proxy-web.yaml.tmpl"
          values: {AGENTS_NS: "{{ agents_ns }}"}
          replace: []

    - name: Per-agent wake tokens (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="agent-{{ item.name }}-wake-token"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
          echo created
        fi
      args: {executable: /bin/bash}
      loop: "{{ agents }}"
      register: wake_created
      changed_when: "'created' in wake_created.stdout"

    - name: Read per-agent secrets
      ansible.builtin.shell: |
        set -euo pipefail
        p={{ gcp_project }}
        printf '%s\n' "$(gcloud secrets versions access latest --secret agent-{{ item.name }}-forge-token --project $p)"
        printf '%s\n' "$(gcloud secrets versions access latest --secret agent-{{ item.name }}-wake-token --project $p)"
        if gcloud secrets describe agent-{{ item.name }}-claude --project $p >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret agent-{{ item.name }}-claude --project $p
        fi
      args: {executable: /bin/bash}
      loop: "{{ agents }}"
      register: agent_secrets
      changed_when: false
      no_log: true

    - name: "Agent and SecurityEvent CRDs (#47, #70)"
      kubernetes.core.k8s:
        <<: *k8s
        src: "{{ repo_root }}/images/operator/config/crd/{{ item }}"
        # Agents below need the type to be served
        wait: true
        wait_condition: {type: Established, status: "True"}
        wait_timeout: 60
      loop: [agentdev.dev_agents.yaml, agentdev.dev_securityevents.yaml]

    - name: Platform namespace
      kubernetes.core.k8s:
        <<: *k8s
        definition: {apiVersion: v1, kind: Namespace, metadata: {name: "{{ platform_ns }}"}}

    - name: Postgres + ContextForge, then mcp-sync per project (#51)
      ansible.builtin.include_role: {name: platform}

    # Management API (#46, #104): needs an OIDC provider, so it runs only when instance.yml sets api.oidc_issuer.
    - name: Management API (database roles, Secrets, Deployment)
      ansible.builtin.include_role: {name: api}
      when: (api.oidc_issuer | default('')) | length > 0

    - name: Agent operator (#47); it renders every agent's StatefulSet
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_operator) | from_yaml_all | list }}"
      vars:
        vars_operator:
          src: "{{ repo_root }}/manifests/operator.yaml.tmpl"
          values:
            PLATFORM_NS: "{{ platform_ns }}"
            AGENTS_NS: "{{ agents_ns }}"
            OPERATOR_IMAGE: "{{ operator_image }}"
            WORKER_IMAGE: "{{ worker_image }}"
            FORGE_IMAGE: "{{ forge_image }}"
            IMAGE_PULL_POLICY: IfNotPresent
            FORGE_URL: "{{ forge_url }}"
            FORGE_PUBLIC_URL: "{{ forge_public_url | default('') }}"
            FORGE_ADMIN_USER: "{{ reviewer }}"
            BOTBOARD_URL: "{{ botboard_url }}"
            POLL_SECONDS: "{{ poll_seconds }}"
            IDLE_SECONDS: "{{ idle_seconds }}"
            EGRESS_PROXY: "http://egress-proxy.{{ agents_ns }}.svc.cluster.local:3128"
            SECURITY_PAUSE_AFTER: "{{ security.pause_after | default(5) }}"
            SECURITY_RETENTION_DAYS: "{{ security.retention_days | default(30) }}"
            SECURITY_MAX_PER_AGENT: "{{ security.max_per_agent | default(500) }}"
            SECURITY_RATE_PER_MIN: "{{ security.rate_per_min | default(10) }}"
            SECURITY_RATE_BURST: "{{ security.rate_burst | default(20) }}"
            USAGE_FIVE_HOUR: "{{ usage.five_hour | default(80) }}"
            USAGE_WEEKLY: "{{ usage.weekly | default(90) }}"
            CLAUDE_PROXY_URL: "{{ ('http://claude-proxy.' + agents_ns + '.svc.cluster.local:8080') if claude_proxy | bool else '' }}"
          replace: []

    - name: Per-agent token Secrets (agent-<name>), read by the operator-rendered pods
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "agent-{{ item.name }}", namespace: "{{ agents_ns }}"}
          stringData:
            FORGE_TOKEN: "{{ agent_secrets.results[idx].stdout_lines[0] }}"
            WAKE_TOKEN: "{{ agent_secrets.results[idx].stdout_lines[1] }}"
            REGISTER_TOKEN: "{{ register_token }}"
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      no_log: true

    # ---------- Claude credential proxy (#66, same template as 06-agents.sh) ----------
    - name: Claude proxy signing key (generated once, kept in Secret Manager)
      ansible.builtin.shell: |
        set -euo pipefail
        name="{{ sm_claude_proxy_signing }}"
        if ! gcloud secrets describe "$name" --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets create "$name" --project {{ gcp_project }} --replication-policy automatic >/dev/null
          openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
          echo created
        fi
      args: {executable: /bin/bash}
      register: proxy_signing_created
      changed_when: "'created' in proxy_signing_created.stdout"
      when: claude_proxy | bool and not ansible_check_mode

    - name: Claude proxy keys of the agents (HMAC of the agent name; never the credential)
      ansible.builtin.shell: |
        set -euo pipefail
        k=$(gcloud secrets versions access latest --secret {{ sm_claude_proxy_signing }} --project {{ gcp_project }})
        for a in {{ agents | map(attribute='name') | map('quote') | join(' ') }}; do
          [[ "$a" =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]] || { echo "bad agent name" >&2; exit 1; }
          printf '%s.%s\n' "$a" "$(printf 'agentdev-claude-proxy/v1:%s' "$a" | openssl dgst -sha256 -hmac "$k" -r | cut -d' ' -f1)"
        done
        printf 'SIGNING=%s\n' "$k"
      args: {executable: /bin/bash}
      register: proxy_keys
      changed_when: false
      when: claude_proxy | bool and not ansible_check_mode
      no_log: true

    - name: Claude proxy signing Secret
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: claude-proxy-signing, namespace: "{{ agents_ns }}"}
          stringData: {key: "{{ proxy_keys.stdout_lines[-1] | regex_replace('^SIGNING=', '') }}"}
      when: claude_proxy | bool and not ansible_check_mode
      no_log: true

    - name: Per-agent proxy key Secrets (agent-<name>-proxy), the only Claude-related value in an agent pod
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "agent-{{ item.split('.')[0] }}-proxy", namespace: "{{ agents_ns }}"}
          stringData: {ANTHROPIC_AUTH_TOKEN: "{{ item }}"}
      loop: "{{ proxy_keys.stdout_lines[:-1] if (claude_proxy | bool and not ansible_check_mode) else [] }}"
      no_log: true

    - name: Claude credential proxy
      kubernetes.core.k8s:
        <<: *k8s
        definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_proxy) | from_yaml_all | list }}"
      vars:
        vars_proxy:
          src: "{{ repo_root }}/manifests/claude-proxy.yaml.tmpl"
          values:
            AGENTS_NS: "{{ agents_ns }}"
            PLATFORM_NS: "{{ platform_ns }}"
            CLAUDE_PROXY_IMAGE: "{{ credproxy_image }}"
            IMAGE_PULL_POLICY: IfNotPresent
            CLAUDE_BUDGET_TOKENS: "{{ claude_budget_tokens | int }}"
            # one optional projected Secret source per Claude Secret (same output as scripts/claude-proxy-sources.sh)
            CLAUDE_SECRET_SOURCES: "{{ lookup('ansible.builtin.template', 'templates/claude-proxy-sources.j2') | trim }}"
          replace: []
      when: claude_proxy | bool

    # GKE (review #119): narrow the proxy's egress to the Anthropic API by name. The plain NetworkPolicy of the
    # template allows HTTPS to any public address; Dataplane V2 enforces this one in addition when the type is served
    # (infra/terraform enable_fqdn_network_policy). Not served: the playbook says so and keeps the plain policy.
    - name: Is the FQDNNetworkPolicy type served (for the Claude proxy)?
      kubernetes.core.k8s_info:
        <<: *k8s
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: fqdnnetworkpolicies.networking.gke.io
      register: proxy_fqdn_crd
      when: claude_proxy | bool

    - name: Claude proxy FQDNNetworkPolicy (egress to api.anthropic.com only)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: networking.gke.io/v1alpha1
          kind: FQDNNetworkPolicy
          metadata: {name: claude-proxy, namespace: "{{ agents_ns }}"}
          spec:
            podSelector: {matchLabels: {app: claude-proxy}}
            egress:
              - matches: [{name: "{{ claude_proxy_upstream_host }}"}]
                ports: [{protocol: TCP, port: 443}]
      when: claude_proxy | bool and (proxy_fqdn_crd.resources | default([]) | length > 0)

    - name: Claude proxy egress is not narrowed by name (FQDNNetworkPolicy not served)
      ansible.builtin.debug:
        msg: "FQDNNetworkPolicy is not available: claude-proxy may reach any public address on 443 (docs/security.md R63)"
      when: claude_proxy | bool and (proxy_fqdn_crd.resources | default([]) | length == 0)

    - name: "Agents (#57): one Agent object each; own Claude secret if present, else the shared one (#5)"
      kubernetes.core.k8s:
        <<: *k8s
        # blocked agents (#27) stay stopped: the operator keeps agentdev/blocked StatefulSets at 0
        definition:
          apiVersion: agentdev.dev/v1alpha1
          kind: Agent
          metadata: {name: "{{ item.name }}", namespace: "{{ agents_ns }}"}
          spec:
            repo: "{{ item.repos }}"
            forge: "{{ forge_kind }}"
            claudeSecret: "{{ ('claude-' + item.name) if (agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | list) else 'claude-shared' }}"
            maxConcurrent: "{{ (item.max_concurrent | default(max_concurrent)) | int }}"
            scaleToZero: "{{ (item.scale_to_zero | default(scale_to_zero)) | bool }}"
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      # --check does not create the CRD, so on a first run the Agent type is unknown: skip, like the wait below
      when: not ansible_check_mode
      no_log: true

    - name: Per-agent Claude secrets (only agents that have one)
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "claude-{{ item.name }}", namespace: "{{ agents_ns }}"}
          stringData: "{{ dict(agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | map('split', '=', 1)) }}"
      loop: "{{ agents }}"
      loop_control: {index_var: idx, label: "{{ item.name }}"}
      when: agent_secrets.results[idx].stdout_lines[2:] | select('search', '=') | list | length > 0
      no_log: true

    # SIEM outputs (#70, #71): non-secret settings from instance.yml security.siem.*, secret values (webhook secret,
    # OTLP headers, CA, client certificate and key) as KEY=VALUE lines in the optional Secret Manager secret
    # sm_security_siem. Both go into the Secret agentdev-api-siem that the API reads (manifests/api.yaml.tmpl); same
    # keys as .secrets/platform/siem-webhook on kind (10-api.sh). The role api reads it (#104).
    - name: Read the SIEM output secrets (optional)
      ansible.builtin.shell: |
        if gcloud secrets describe {{ sm_security_siem }} --project {{ gcp_project }} >/dev/null 2>&1; then
          gcloud secrets versions access latest --secret {{ sm_security_siem }} --project {{ gcp_project }}
        fi
      register: siem_secret
      changed_when: false
      no_log: true

    - name: SIEM outputs Secret agentdev-api-siem
      vars:
        siem: "{{ security.siem | default({}) }}"
        siem_env:
          SECURITY_WEBHOOK_URL: "{{ siem.webhook_url | default('') }}"
          SECURITY_SYSLOG_ADDR: "{{ siem.syslog_addr | default('') }}"
          SECURITY_SYSLOG_SERVER_NAME: "{{ siem.syslog_server_name | default('') }}"
          SECURITY_OTLP_URL: "{{ siem.otlp_url | default('') }}"
          SECURITY_OTLP_SERVER_NAME: "{{ siem.otlp_server_name | default('') }}"
      kubernetes.core.k8s:
        <<: *k8s
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentdev-api-siem, namespace: "{{ platform_ns }}"}
          stringData: >-
            {{ siem_env | dict2items | rejectattr('value', 'equalto', '') | items2dict
               | combine(dict(siem_secret.stdout_lines | select('search', '=') | map('split', '=', 1))) }}
      when: (security.siem | default({})) | length > 0 or siem_secret.stdout | length > 0
      no_log: true

    - name: Wait for the router and agents
      kubernetes.core.k8s_info:
        <<: *k8s
        kind: Pod
        namespace: "{{ agents_ns }}"
        wait: true
        wait_condition: {type: Ready, status: "True"}
        wait_timeout: 600
        label_selectors: ["{{ item }}"]
      loop: ["app=webhook-router", "app=coding-agent"]
      when: not ansible_check_mode
