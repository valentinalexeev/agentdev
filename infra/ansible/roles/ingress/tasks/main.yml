---
# Public entry point (#120, #160). ingress.mode selects who publishes the public hosts:
#   gateway  (default) the GKE Gateway of this role (tasks/gateway.yml), with the Terraform static IP and certificate
#   external a reverse proxy outside this role (for example a tailnet ingress). No Gateway, route or certificate.
# In both modes ingress.host, webhook_host and auth_host give the public URLs (authentik issuer, UI callback, webhook).
# Optional in both modes: ingress.forwarder lets a named forwarder reach the published Services (templates/forwarder.yaml.j2).
- name: Check the ingress settings (mode, hosts, forwarder)
  ansible.builtin.include_tasks: checks.yml

- name: Public HTTPS entry point (Gateway)
  ansible.builtin.include_tasks: gateway.yml
  when: ingress_mode == 'gateway'

- name: External ingress (no Gateway, route or certificate)
  ansible.builtin.debug:
    msg: >-
      ingress.mode external: publish https://{{ ingress_host }}/ (agentdev-ui.{{ platform_ns }}:8080),
      https://{{ ingress_webhook_host }}/hook only (webhook-router.{{ agents_ns }}:8080, never the internal port 8081){{
      (' and https://' ~ ingress_auth_host ~ '/ (authentik-server.' ~ platform_ns ~ ':80)') if ingress_auth | bool else '' }}
      through your own reverse proxy (docs/admin.md, External ingress).
  when: ingress_mode == 'external'

# opt-in: without ingress.forwarder the objects are removed, so the default-deny of the platform namespace applies again
- name: NetworkPolicies for the external forwarder
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if ingress_forwarder_on | bool and (item.name != 'authentik-from-forwarder' or ingress_auth | bool) else 'absent' }}"
    definition: "{{ ingress_forwarder_objects | selectattr('metadata.name', 'equalto', item.name) | first }}"
  loop: "{{ ingress_forwarder_objects | map(attribute='metadata') | list }}"
  loop_control: {label: "{{ item.name }}"}
  vars:
    ingress_forwarder_objects: "{{ lookup('ansible.builtin.template', 'forwarder.yaml.j2') | from_yaml_all | list }}"

# forwarder watch (#213): the operator reads the forwarder pods (get, list) to record a SecurityEvent when none is Ready.
# Only with ingress.forwarder namespace and pod_selector; otherwise the Role and RoleBinding are removed.
- name: Role for the operator's forwarder watch
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if ingress_forwarder_watch | bool else 'absent' }}"
    definition:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata: {name: agentdev-operator-forwarder-watch, namespace: "{{ ingress_forwarder_watch_ns }}",
                   labels: {app.kubernetes.io/part-of: agentdev}}
        rules: [{apiGroups: [""], resources: [pods], verbs: [get, list]}]
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata: {name: agentdev-operator-forwarder-watch, namespace: "{{ ingress_forwarder_watch_ns }}",
                   labels: {app.kubernetes.io/part-of: agentdev}}
        roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentdev-operator-forwarder-watch}
        subjects: [{kind: ServiceAccount, name: agentdev-operator, namespace: "{{ platform_ns }}"}]
  when: ingress_forwarder_watch_ns | length > 0
