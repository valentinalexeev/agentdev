---
# Public HTTPS entry point on GKE (#120): one Gateway (global external Application Load Balancer) on the Terraform
# static IP, with the Terraform Google-managed certificate and SSL policy. Only two paths are public:
#   https://<webhook_host>/hook...  -> webhook-router (POST deliveries, HMAC checked by the router)
#   https://<host>/...              -> agentdev-ui (static app and its /api proxy to the API)
#   https://<auth_host>/...         -> authentik-server (login and issuer, #114; only with ingress.auth_host)
# The router's /status, /register and /idle and every other Service stay cluster-internal. Port 80 only redirects.
- name: Check the ingress settings
  ansible.builtin.assert:
    that:
      - ingress_host is match('^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - ingress_webhook_host is match('^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - ingress_auth_host | length == 0 or ingress_auth_host is match('^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - ingress_certificate | length > 0
      - ingress_hsts_max_age | string is match('^[0-9]+$')
    fail_msg: >-
      ingress.host, ingress.webhook_host and ingress.auth_host must be plain DNS names, ingress.certificate the name from
      `terraform output ingress` (example.vars.yml)
    quiet: true

# CHANGELOG (#114): the login host must be in Terraform `public_hosts`, or the managed certificate does not cover it.
- name: Read the domains of the managed certificate (read-only)
  ansible.builtin.command:
    argv: [gcloud, compute, ssl-certificates, describe, "{{ ingress_certificate }}", --global, --project,
           "{{ gcp_project }}", "--format=value(managed.domains)"]
  register: ingress_cert_domains
  changed_when: false
  failed_when: false
  check_mode: false
  when: ingress_auth | bool

- name: Check that ingress.auth_host is covered by the certificate (Terraform public_hosts)
  ansible.builtin.assert:
    that: ingress_auth_host in (ingress_cert_domains.stdout | replace(';', ',') | split(','))
    fail_msg: >-
      ingress.auth_host {{ ingress_auth_host }} is not in the certificate {{ ingress_certificate }}
      ({{ ingress_cert_domains.stdout }}): add it to Terraform public_hosts, apply, and copy `terraform output ingress`
    quiet: true
  when: ingress_auth | bool and ingress_cert_domains.rc | default(1) == 0

- name: Warn when the certificate domains could not be read
  ansible.builtin.debug:
    msg: >-
      WARNING: could not read certificate {{ ingress_certificate }} ({{ ingress_cert_domains.stderr | default('') }}).
      Make sure ingress.auth_host {{ ingress_auth_host }} is in Terraform public_hosts.
  when: ingress_auth | bool and ingress_cert_domains.rc | default(1) != 0

- name: Is the Gateway API served (Terraform gateway_api_config)?
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: gateways.gateway.networking.k8s.io
  register: ingress_gateway_crd

- name: Stop when the cluster has no Gateway API
  ansible.builtin.assert:
    that: ingress_gateway_crd.resources | length > 0
    fail_msg: "The cluster does not serve the Gateway API: apply infra/terraform (gateway_api_config) first"
    quiet: true
  when: not ansible_check_mode

- name: Gateway, routes, policies and NetworkPolicy
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'gateway.yaml.j2') | from_yaml_all | list }}"
  when: ingress_gateway_crd.resources | length > 0
