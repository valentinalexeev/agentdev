---
# kind cluster with gVisor (#106, was 01-cluster.sh). The values match config.env; run.sh passes them with -e.
kind_cluster_name: agentdev
kind_cluster_engine: docker
kind_cluster_gvisor_version: "20261012.0"
kind_cluster_config: "{{ playbook_dir }}/../../manifests/kind-config.yaml"
kind_cluster_min_version: "0.24.0"  # NetworkPolicy enforcement for the egress allow-list (#65)
kind_cluster_smoke_test: true
# Host tools that prereqs.yml (was 00-prereqs.sh) requires, with the install hint. The engine is added by the task.
kind_cluster_tools:
  - {name: kind, hint: brew install kind}
  - {name: kubectl, hint: brew install kubectl}
  - {name: helm, hint: brew install helm}
  - {name: curl, hint: brew install curl}
  - {name: python3, hint: brew install python3}
kind_cluster_min_mem_gib: 6   # below this the prereqs only warn (engine VM)
# teardown (tag teardown,never; was 99-teardown.sh): the repository root, for the spike's .coder directory
kind_cluster_repo_root: "{{ playbook_dir }}/../.."
