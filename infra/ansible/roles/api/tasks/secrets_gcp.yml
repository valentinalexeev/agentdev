---
# Secrets from Secret Manager (gcloud as the caller). Sets the facts api_db_password, api_forge_token, api_siem_lines.
- name: API database password exists in Secret Manager (generated once, hex only so it is safe in SQL)
  ansible.builtin.shell: |
    set -euo pipefail
    name="{{ api_sm_db_password }}"
    p="{{ gcp_project }}"
    if [ -z "$(gcloud secrets versions list "$name" --project "$p" --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
      gcloud secrets describe "$name" --project "$p" >/dev/null 2>&1 \
        || gcloud secrets create "$name" --project "$p" --replication-policy automatic >/dev/null
      openssl rand -hex 24 | tr -d '\n' | gcloud secrets versions add "$name" --project "$p" --data-file=- >/dev/null
      echo created
    fi
  args: {executable: /bin/bash}
  register: api_sm_created
  changed_when: "'created' in api_sm_created.stdout"
  no_log: true

# optional secrets print nothing when absent or without an enabled version; the database password must exist (except in a first --check)
- name: Read the API secrets
  ansible.builtin.shell: |
    set -euo pipefail
    p="{{ gcp_project }}"
    # an optional secret that is absent, or exists without an enabled version, counts as absent
    if [ "{{ item.optional | lower }}" = true ] && [ -z "$(gcloud secrets versions list "{{ item.name }}" --project "$p" \
        --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
      exit 0
    fi
    gcloud secrets versions access latest --secret "{{ item.name }}" --project "$p"
  args: {executable: /bin/bash}
  loop:
    - {name: "{{ api_sm_db_password }}", optional: false}
    - {name: "{{ api_sm_forge_token }}", optional: true}
    - {name: "{{ api_sm_siem }}", optional: true}
    # the agents' GitHub App key (#87): required with forge_kind github, as for the agents' sidecars
    - {name: "{{ sm_github_app_private_key if api_github else '' }}", optional: "{{ not api_github }}"}
  register: api_sm
  changed_when: false
  check_mode: false
  failed_when: api_sm.rc != 0 and not ansible_check_mode
  no_log: true

- name: Keep the API secrets in facts (not logged)
  ansible.builtin.set_fact:
    api_db_password: "{{ api_sm.results[0].stdout | trim }}"
    api_forge_token: "{{ api_sm.results[1].stdout | trim }}"
    api_siem_lines: "{{ api_sm.results[2].stdout_lines | default([]) }}"
    api_github_key: "{{ api_sm.results[3].stdout | default('') }}"
  no_log: true

# console chat sessions (#346): the token key is generated once; the clone and issue tokens are optional owner values
- name: Chat token key exists in Secret Manager (generated once)
  ansible.builtin.shell: |
    set -euo pipefail
    name="{{ api_sm_chat_key }}"
    p="{{ gcp_project }}"
    if [ -z "$(gcloud secrets versions list "$name" --project "$p" --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
      gcloud secrets describe "$name" --project "$p" >/dev/null 2>&1 \
        || gcloud secrets create "$name" --project "$p" --replication-policy automatic >/dev/null
      openssl rand -hex 32 | tr -d '\n' | gcloud secrets versions add "$name" --project "$p" --data-file=- >/dev/null
      echo created
    fi
  args: {executable: /bin/bash}
  register: api_sm_chat_created
  changed_when: "'created' in api_sm_chat_created.stdout"
  when: api_chat and not ansible_check_mode
  no_log: true

- name: Read the chat secrets
  ansible.builtin.shell: |
    set -euo pipefail
    p="{{ gcp_project }}"
    if [ -z "$(gcloud secrets versions list "{{ item }}" --project "$p" --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
      exit 0
    fi
    gcloud secrets versions access latest --secret "{{ item }}" --project "$p"
  args: {executable: /bin/bash}
  loop: ["{{ api_sm_chat_key }}", "{{ api_sm_chat_clone_token }}", "{{ api_sm_chat_issue_token }}"]
  register: api_sm_chat
  changed_when: false
  check_mode: false
  when: api_chat
  no_log: true

- name: Keep the chat secrets in facts (not logged)
  ansible.builtin.set_fact:
    api_chat_key: "{{ (api_sm_chat.results[0].stdout | default('')) | trim if api_chat else '' }}"
    api_chat_clone_token: "{{ (api_sm_chat.results[1].stdout | default('')) | trim if api_chat else '' }}"
    api_chat_issue_token: "{{ (api_sm_chat.results[2].stdout | default('')) | trim if api_chat else '' }}"
    # GitHub: a fine-grained read-only token (any user name works); Gitea: the read-only account's token
    api_chat_clone_user: "{{ 'x-access-token' if api_github else api_forge_user }}"
  no_log: true
