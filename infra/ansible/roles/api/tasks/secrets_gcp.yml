---
# Secrets from Secret Manager (gcloud as the caller). Sets the facts api_db_password, api_forge_token, api_siem_lines.
- name: API database password exists in Secret Manager (generated once, hex only so it is safe in SQL)
  ansible.builtin.shell: |
    set -euo pipefail
    name="{{ api_sm_db_password }}"
    p="{{ gcp_project }}"
    if [ -z "$(gcloud secrets versions list "$name" --project "$p" --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
      gcloud secrets describe "$name" --project "$p" >/dev/null 2>&1 \
        || gcloud secrets create "$name" --project "$p" --replication-policy automatic >/dev/null
      openssl rand -hex 24 | tr -d '\n' | gcloud secrets versions add "$name" --project "$p" --data-file=- >/dev/null
      echo created
    fi
  args: {executable: /bin/bash}
  register: api_sm_created
  changed_when: "'created' in api_sm_created.stdout"
  no_log: true

# optional secrets print nothing when absent; the database password must exist (except in a first --check)
- name: Read the API secrets
  ansible.builtin.shell: |
    set -euo pipefail
    p="{{ gcp_project }}"
    if [ "{{ item.optional | lower }}" = true ] && ! gcloud secrets describe "{{ item.name }}" --project "$p" >/dev/null 2>&1; then
      exit 0
    fi
    gcloud secrets versions access latest --secret "{{ item.name }}" --project "$p"
  args: {executable: /bin/bash}
  loop:
    - {name: "{{ api_sm_db_password }}", optional: false}
    - {name: "{{ api_sm_forge_token }}", optional: true}
    - {name: "{{ api_sm_siem }}", optional: true}
  register: api_sm
  changed_when: false
  check_mode: false
  failed_when: api_sm.rc != 0 and not ansible_check_mode
  no_log: true

- name: Keep the API secrets in facts (not logged)
  ansible.builtin.set_fact:
    api_db_password: "{{ api_sm.results[0].stdout | trim }}"
    api_forge_token: "{{ api_sm.results[1].stdout | trim }}"
    api_siem_lines: "{{ api_sm.results[2].stdout_lines | default([]) }}"
  no_log: true
