---
# Database agentdev (#382): the Job agentdev-db-init-<hash> runs in the cluster, with no kubectl exec. It makes the
# roles (owner/API split, docs/security.md, #70: agentdev_owner NOLOGIN owns the objects, the login agentdev_api may
# only insert, read and call the prune functions), the database, schema.sql as agentdev_owner, the retention, grants.sql
# and last the schema version that the API waits for (images/api, waitSchema). The SQL is in a ConfigMap
# (manifests/db-init/); the passwords come from the Secrets platform-db and agentdev-api-db by name, never from here.
- name: Check the database password
  ansible.builtin.assert:
    that: api_db_password is match('^[0-9a-f]{32,}$')
    # kind (files) has no Secret Manager names (platform_sm_prefix): name the file there
    fail_msg: >-
      {{ ('Secret Manager ' ~ api_sm_db_password) if api_secret_source == 'gcp' else (api_secrets_dir ~ '/pg-agentdev-api') }}
      must hold a hex password (openssl rand -hex 24)
    quiet: true
  when: not ansible_check_mode and api_playbook_secrets
  no_log: true

- name: Job agentdev-db-init (roles, database, schema, retention, grants)
  ansible.builtin.include_tasks: "{{ repo_root }}/infra/ansible/tasks/db_init.yml"
  vars:
    db_init_name: agentdev-db-init
    db_init_image: "{{ api_db_init_image }}"
    db_init_command: [sh, /db-init/agentdev.sh]
    db_init_files: "{{ api_db_init_files }}"
    db_init_env: "{{ api_db_init_env }}"
    # a new API password (agentdev-api-db changed) must reach the role: run the same Job again
    # secrets_mode external: no playbook Secret write here (api_secret_db not set); ESO keeps the name and key
    db_init_rerun: "{{ api_secret_db | default({}) is changed }}"
