---
# agentdev API in {{ platform_ns }} (#46, #104). Runs after the platform role (Postgres). Same steps as 10-api.sh:
# database roles and grants, the Secrets agentdev-api-db, agentdev-api-forge and agentdev-api-siem, then the
# Deployment from manifests/api.yaml.tmpl. Every task that holds a secret value has no_log.
- name: Check the API settings
  ansible.builtin.assert:
    that:
      - api_oidc_issuer is match('^https://')
      - api_oidc_discovery_url is match('^https?://')
      - api_db_retention_days | string is match('^[1-9][0-9]*$')
      - api_max_agents | string is match('^[0-9]{1,6}$')
      - api_max_agents_per_user | string is match('^[0-9]{1,6}$')
    fail_msg: >-
      api.oidc_issuer must be https://, api.db_retention_days a positive number, api.max_agents and
      api.max_agents_per_user whole numbers 0 or more (0 = no limit) (example.vars.yml)
    quiet: true

- name: API image on kind (build or pull, load)
  ansible.builtin.include_tasks: kind_image.yml
  when: api_kind_cluster | length > 0

- name: Read the API secrets
  ansible.builtin.include_tasks: "secrets_{{ api_secret_source }}.yml"

- name: Database roles, schema and grants
  ansible.builtin.include_tasks: database.yml

# kind only: Gitea in the cluster; on GKE the forge token is a manual step (docs/admin.md)
- name: Forge account agentdev-api on Gitea (kind)
  ansible.builtin.include_tasks: forge_gitea.yml
  when: api_secret_source == 'files' and not api_github

- name: Secrets agentdev-api-db, agentdev-api-forge and agentdev-api-siem
  ansible.builtin.include_tasks: secrets_k8s.yml

- name: Value namespace of the project secrets (#202, kind store from step 13)
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    kind: Namespace
    name: "{{ api_secrets_values_ns }}"
  register: api_values_ns
  when: api_secrets_values_ns | length > 0

- name: API Deployment, Service, RBAC and NetworkPolicies
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=api_render) | from_yaml_all | list }}"
  vars:
    api_render:
      src: "{{ repo_root }}/manifests/api.yaml.tmpl"
      values:
        PLATFORM_NS: "{{ platform_ns }}"
        AGENTS_NS: "{{ agents_ns }}"
        API_IMAGE: "{{ api_image }}"
        OIDC_ISSUER: "{{ api_oidc_issuer }}"
        OIDC_DISCOVERY_URL: "{{ api_oidc_discovery_url }}"
        OIDC_AUDIENCE: "{{ api_oidc_audience }}"
        FORGE_URL: "{{ api_forge_url }}"
        GITHUB_URL: "{{ api_github_url }}"
        # same switch as the operator (deploy.yml), so the API and the operator agree on approvals (#67)
        APPROVALS: "{{ approvals.enabled | default(true) | string | lower }}"
        APPROVAL_DENY_ACCOUNTS: "{{ api_approval_deny_accounts | join(',') }}"
        USAGE_FIVE_HOUR: "{{ usage.five_hour | default(80) }}"
        USAGE_WEEKLY: "{{ usage.weekly | default(90) }}"
        MAX_AGENTS: "{{ api_max_agents }}"
        MAX_AGENTS_PER_USER: "{{ api_max_agents_per_user }}"
        # project secrets (#202): the kind store's value namespace, only when step 13 made it; GKE: part 4 (empty = off)
        SECRETS_VALUES_NS: >-
          {{ api_secrets_values_ns if api_secrets_values_ns | length > 0 and api_values_ns.resources | default([]) | length > 0 else '' }}
      replace: []
  register: api_applied

# a new local image on kind keeps its tag, so it also needs a restart.
# a changed Secret does not change the pod template, and the apply may have changed only a Service, RBAC or a
# NetworkPolicy: restart on every Secret change so the API reads the new values
- name: Restart the API after a Secret change
  ansible.builtin.command: kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout restart deploy/agentdev-api
  when: ((api_secrets_changed | default(false)) or (api_load is changed)) and not ansible_check_mode
  changed_when: true

- name: Wait for the API
  ansible.builtin.command: >-
    kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout status deploy/agentdev-api --timeout=180s
  changed_when: false
  when: not ansible_check_mode

# web UI (#48, #120): the same manifests/ui.yaml.tmpl as ./run.sh 11. Users reach it through the role ingress.
- name: Web UI Deployment, Service and NetworkPolicies
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=ui_render) | from_yaml_all | list }}"
  vars:
    ui_render:
      src: "{{ repo_root }}/manifests/ui.yaml.tmpl"
      values:
        PLATFORM_NS: "{{ platform_ns }}"
        UI_IMAGE: "{{ api_ui_image }}"
        OIDC_ISSUER: "{{ api_oidc_issuer }}"
      replace: []
  when: api_ui | bool

- name: Wait for the web UI
  ansible.builtin.command: >-
    kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout status deploy/agentdev-ui --timeout=120s
  changed_when: false
  when: api_ui | bool and not ansible_check_mode
