---
# kind (#106, was 10-api.sh): secrets are files in api_secrets_dir (.secrets/platform, gitignored). Sets the same
# facts as secrets_gcp.yml: api_db_password, api_forge_token, api_siem_lines, api_github_key.
# pg-agentdev-api is generated once (hex, safe in SQL) and never overwritten. siem-webhook is optional KEY=VALUE lines.
# The forge token is not a file: forge_gitea.yml mints it and keeps it in the Secret agentdev-api-forge (as 10-api.sh).
- name: API secrets directory (0700)
  ansible.builtin.file: {path: "{{ api_secrets_dir }}", state: directory, mode: "0700"}

- name: API database password file exists (generated once)
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ api_secrets_dir }}/pg-agentdev-api"
    if [ ! -s "$f" ]; then umask 077; openssl rand -hex 24 > "$f"; chmod 600 "$f"; echo created; fi
  args: {executable: /bin/bash}
  register: api_files_created
  changed_when: "'created' in api_files_created.stdout"
  no_log: true

- name: Read the API secret files
  ansible.builtin.slurp: {src: "{{ item }}"}
  loop:
    - "{{ api_secrets_dir }}/pg-agentdev-api"
    - "{{ api_secrets_dir }}/siem-webhook"
    - "{{ api_github_app_dir }}/private-key.pem"
    - "{{ api_github_app_dir }}/app-id"
  register: api_files
  # siem-webhook and the GitHub App are optional here; the checks below decide. In a first --check nothing exists.
  failed_when: false
  no_log: true

- name: Keep the API secrets in facts (not logged)
  ansible.builtin.set_fact:
    api_db_password: "{{ (api_files.results[0].content | default('')) | b64decode | trim }}"
    api_forge_token: "{{ api_forge_token | default('') }}"
    api_siem_lines: "{{ ((api_files.results[1].content | default('')) | b64decode).splitlines() }}"
    api_github_key: "{{ (api_files.results[2].content | default('')) | b64decode }}"
    api_github_app_id: "{{ (api_files.results[3].content | default('')) | b64decode | trim }}"
  no_log: true

- name: "FORGE_KIND=github needs the App (scripts/github-app.sh, docs/admin.md)"
  ansible.builtin.assert:
    that: api_github_key | length > 0 and api_github_app_id is match('^[1-9][0-9]*$')
    fail_msg: "FORGE_KIND=github: register the App first ({{ api_github_app_dir }}: app-id, private-key.pem)"
    quiet: true
  when: api_github and not ansible_check_mode

# console chat sessions (#346, kind): the token key is a file generated once; the clone uses agentdev-api's read-only
# Gitea token (forge_gitea.yml sets api_forge_token after this file, so main.yml sets the clone token later)
- name: Chat token key file exists (generated once)
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ api_secrets_dir }}/chat-token-key"
    if [ ! -s "$f" ]; then umask 077; openssl rand -hex 32 > "$f"; chmod 600 "$f"; echo created; fi
  args: {executable: /bin/bash}
  register: api_chat_key_created
  changed_when: "'created' in api_chat_key_created.stdout"
  when: api_chat and not ansible_check_mode
  no_log: true

- name: Read the chat files
  ansible.builtin.slurp: {src: "{{ item }}"}
  loop: ["{{ api_secrets_dir }}/chat-token-key", "{{ api_secrets_dir }}/chat-issue-token"]
  register: api_chat_files
  failed_when: false
  when: api_chat
  no_log: true

- name: Keep the chat secrets in facts (not logged)
  ansible.builtin.set_fact:
    api_chat_key: "{{ ((api_chat_files.results[0].content | default('')) | b64decode | trim) if api_chat else '' }}"
    api_chat_issue_token: "{{ ((api_chat_files.results[1].content | default('')) | b64decode | trim) if api_chat else '' }}"
    api_chat_clone_user: "{{ api_forge_user }}"
  no_log: true
