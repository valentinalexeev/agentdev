---
- name: Secret agentdev-api-db
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: agentdev-api-db, namespace: "{{ platform_ns }}"}
      stringData:
        DATABASE_URL: "postgres://agentdev_api:{{ api_db_password }}@platform-db:5432/agentdev?sslmode=disable"
  register: api_secret_db
  no_log: true

# FORGE_API_TOKEN (#100): token of the forge account agentdev-api, scopes read:repository,read:user, admin of the
# agent repositories. Without it every write that needs the forge gives 503 (fail closed), so the Secret is optional.
- name: Secret agentdev-api-forge
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if api_forge_token | length > 0 else 'absent' }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: agentdev-api-forge, namespace: "{{ platform_ns }}"}
      stringData: {FORGE_API_TOKEN: "{{ api_forge_token }}"}
  register: api_secret_forge
  no_log: true

# SIEM outputs (#70, #71): addresses from instance.yml security.siem.*, secret values as KEY=VALUE lines in the
# optional Secret Manager secret sm_security_siem. Same keys as .secrets/platform/siem-webhook on kind (10-api.sh,
# table in docs/admin.md).
- name: Secret agentdev-api-siem
  vars:
    api_siem: "{{ security.siem | default({}) }}"
    api_siem_env:
      SECURITY_WEBHOOK_URL: "{{ api_siem.webhook_url | default('') }}"
      SECURITY_SYSLOG_ADDR: "{{ api_siem.syslog_addr | default('') }}"
      SECURITY_SYSLOG_SERVER_NAME: "{{ api_siem.syslog_server_name | default('') }}"
      SECURITY_OTLP_URL: "{{ api_siem.otlp_url | default('') }}"
      SECURITY_OTLP_SERVER_NAME: "{{ api_siem.otlp_server_name | default('') }}"
    api_siem_data: >-
      {{ api_siem_env | dict2items | rejectattr('value', 'equalto', '') | items2dict
         | combine(dict(api_siem_lines | select('search', '=') | map('split', '=', 1))) }}
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if api_siem_data | length > 0 else 'absent' }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: agentdev-api-siem, namespace: "{{ platform_ns }}"}
      stringData: "{{ api_siem_data }}"
  register: api_secret_siem
  no_log: true

- name: Note a Secret change (the API reads them only at start)
  ansible.builtin.set_fact:
    api_secrets_changed: "{{ api_secret_db.changed or api_secret_forge.changed or api_secret_siem.changed }}"
