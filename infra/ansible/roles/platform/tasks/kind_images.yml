---
# kind (#106, was 08-mcp.sh): pull the platform images and load them into the kind nodes. A local operator tag
# (agentdev-operator:*) is built from images/operator first, as the role operator does.
# #558: a published image is pulled for the engine's platform and re-tagged through a one-line build (the #378 fix of
# the role kind_agents, shared task files): with the containerd image store a plain pull keeps the multi-arch index,
# and `kind load` fails on postgres with "content digest ... not found". Always pulled, so an image already present
# with its index (an older run) is fixed too.
- name: Platform of pulled images
  ansible.builtin.include_tasks: "{{ repo_root }}/infra/ansible/tasks/kind_pull_platform.yml"
  vars: {kind_pull_engine: "{{ platform_container_engine }}"}

- name: Platform images, one platform each
  ansible.builtin.include_tasks: "{{ repo_root }}/infra/ansible/tasks/kind_pull_image.yml"
  vars:
    kind_pull_engine: "{{ platform_container_engine }}"
    kind_pull_ref: "{{ platform_img }}"
  loop: "{{ platform_kind_images }}"
  loop_control: {loop_var: platform_img}

- name: Build the local operator image (obs-mcp)
  ansible.builtin.command:
    argv: ["{{ platform_container_engine }}", build, -q, -t, "{{ operator_image }}", "{{ repo_root }}/images/operator"]
  register: platform_operator_build
  changed_when: false
  when: platform_obs_mcp_enabled | bool and operator_image is match('agentdev-operator:')

- name: Load the platform images into kind
  ansible.builtin.command:
    argv: [kind, load, docker-image, "{{ item }}", --name, "{{ platform_kind_cluster }}"]
  loop: "{{ platform_kind_images + ([operator_image] if platform_operator_build is not skipped else []) }}"
  register: platform_load
  # kind writes "already present on all nodes" to stderr on a skip
  changed_when: "'already present on all nodes' not in (platform_load.stdout ~ platform_load.stderr)"
