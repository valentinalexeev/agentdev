---
# kind (#106, was 08-mcp.sh): the platform secrets are files in platform_secrets_dir (.secrets/platform, gitignored),
# generated once (openssl rand -hex 24, mode 600) and never overwritten, so a redeploy keeps the same database and
# tokens. jwt and enc are two files each (jwt + jwt2, enc + enc2), as 08-mcp.sh wrote them.
- name: Platform secrets directory (0700)
  ansible.builtin.file: {path: "{{ platform_secrets_dir }}", state: directory, mode: "0700"}

- name: Platform secret files exist (generated once)
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ platform_secrets_dir }}/{{ item }}"
    if [ ! -s "$f" ]; then umask 077; openssl rand -hex 24 > "$f"; chmod 600 "$f"; echo created; fi
  args: {executable: /bin/bash}
  loop: "{{ platform_file_keys }}"
  register: platform_files_created
  changed_when: "'created' in platform_files_created.stdout"
  no_log: true

- name: Read platform secret files
  ansible.builtin.slurp: {src: "{{ platform_secrets_dir }}/{{ item }}"}
  loop: "{{ platform_file_keys }}"
  register: platform_files
  # in --check on a first run the files do not exist yet
  failed_when: platform_files.failed | default(false) and not ansible_check_mode
  no_log: true

- name: Keep platform secrets in a fact (not logged)
  ansible.builtin.set_fact:
    platform_secret: >-
      {{ dict(platform_file_keys | zip(platform_files.results
           | map(attribute='content', default='') | map('b64decode') | map('trim')))
         | combine({'jwt': f.get('jwt', '') ~ f.get('jwt2', ''), 'enc': f.get('enc', '') ~ f.get('enc2', '')}) }}
  vars:
    f: "{{ dict(platform_file_keys | zip(platform_files.results | map(attribute='content', default='') | map('b64decode') | map('trim'))) }}"
  no_log: true

- name: Observability MCP backend token file (optional)
  ansible.builtin.slurp: {src: "{{ platform_secrets_dir }}/obs-token"}
  register: platform_obs_file
  failed_when: false
  when: platform_obs_mcp_enabled | bool
  no_log: true

- name: Observability MCP backend token from the file
  ansible.builtin.set_fact:
    platform_obs_token: {stdout: "{{ (platform_obs_file.content | default('')) | b64decode | trim }}"}
  when: platform_obs_mcp_enabled | bool
  no_log: true
