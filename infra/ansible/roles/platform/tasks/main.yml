---
# Postgres + ContextForge in {{ platform_ns }} (#14, #51), then scripts/mcp-sync.sh for each project spec.
# Every task that holds a secret value has no_log.
# platform_secret_source: secret_manager (GKE, deploy.yml) or files (kind, kind.yml: .secrets/platform, #106).
- name: Platform images on kind (pull, load)
  ansible.builtin.include_tasks: kind_images.yml
  when: platform_kind_cluster | length > 0

- name: Platform secrets from files (kind)
  ansible.builtin.include_tasks: secrets_files.yml
  when: platform_secret_source == 'files'

- name: Platform secrets from Secret Manager
  when: platform_secret_source == 'secret_manager'
  block:
    - name: Platform secrets exist in Secret Manager (generated once)
      ansible.builtin.shell: |
        set -euo pipefail
        name="{{ platform_sm_prefix }}{{ item }}"
        p={{ gcp_project }}
        # an enabled version, not only the container: a create that failed at "versions add" is completed here
        if [ -z "$(gcloud secrets versions list "$name" --project "$p" --filter=state:enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
          gcloud secrets describe "$name" --project "$p" >/dev/null 2>&1 \
            || gcloud secrets create "$name" --project "$p" --replication-policy automatic >/dev/null
          openssl rand -hex 48 | tr -d '\n' | gcloud secrets versions add "$name" --project {{ gcp_project }} --data-file=- >/dev/null
          echo created
        fi
      args: {executable: /bin/bash}
      loop: "{{ platform_secret_keys }}"
      register: platform_sm_created
      changed_when: "'created' in platform_sm_created.stdout"
      no_log: true

    - name: Read platform secrets
      ansible.builtin.command: >-
        gcloud secrets versions access latest --secret {{ platform_sm_prefix }}{{ item }} --project {{ gcp_project }}
      loop: "{{ platform_secret_keys }}"
      register: platform_sm
      changed_when: false
      # read-only; in --check on a first run the secrets do not exist yet
      check_mode: false
      failed_when: platform_sm.rc != 0 and not ansible_check_mode
      no_log: true

    - name: Keep platform secrets in a fact (not logged)
      ansible.builtin.set_fact:
        platform_secret: "{{ dict(platform_secret_keys | zip(platform_sm.results | map(attribute='stdout'))) }}"
      no_log: true

# ContextForge (Secret, Deployment, Service, NetworkPolicy, all named contextforge) only when
# platform_contextforge_enabled (default: mcp_projects is not empty, #172). Postgres always: the API uses it.
- name: Postgres, ContextForge and their NetworkPolicies
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: >-
      {{ platform_docs if platform_contextforge_enabled | bool
         else platform_docs | rejectattr('metadata.name', 'equalto', 'contextforge') | list }}
  vars:
    platform_docs: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=platform_render) | from_yaml_all | list }}"
    platform_render:
      src: "{{ repo_root }}/manifests/platform.yaml.tmpl"
      values:
        PLATFORM_NS: "{{ platform_ns }}"
        AGENTS_NS: "{{ agents_ns }}"
        SERVICE_CIDR: "{{ platform_service_cidr }}"
        POSTGRES_IMAGE: "{{ platform_postgres_image }}"
        CONTEXTFORGE_IMAGE: "{{ platform_contextforge_image }}"
        CF_ADMIN_EMAIL: "{{ platform_cf_admin_email }}"
        PG_ADMIN_PASSWORD: "{{ platform_secret['pg-admin'] }}"
        PG_CF_PASSWORD: "{{ platform_secret['pg-contextforge'] }}"
        PG_AGENTDEV_PASSWORD: "{{ platform_secret['pg-agentdev'] }}"
        PG_AUTHENTIK_PASSWORD: "{{ platform_secret['pg-authentik'] }}"
        CF_JWT_SECRET: "{{ platform_secret['jwt'] }}"
        CF_ENC_SECRET: "{{ platform_secret['enc'] }}"
        # same rule as 08-mcp.sh: ContextForge wants upper, lower, digit and symbol
        CF_ADMIN_PASSWORD: "Aa1!{{ platform_secret['cf-admin'] }}"
        CF_DEFAULT_USER_PASSWORD: "Aa1!{{ platform_secret['cf-default-user'] }}"
        CF_BASIC_AUTH_PASSWORD: "Aa1!{{ platform_secret['cf-basic-auth'] }}"
      replace: []
  no_log: true

# wait on the workloads, not on pods by label: right after the apply the pod list can still be empty
- name: Wait for Postgres and ContextForge
  ansible.builtin.command: >-
    kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout status {{ item }} --timeout=600s
  loop: "{{ ['statefulset/platform-db'] + (['deployment/contextforge'] if platform_contextforge_enabled | bool else []) }}"
  changed_when: false
  when: not ansible_check_mode

# No MCP projects (#172): remove ContextForge (its four objects are all named contextforge) and the
# agents' MCP token Secrets that point to it. Its database stays in Postgres for a later re-enable.
- name: Remove ContextForge when it is not enabled
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    namespace: "{{ platform_ns }}"
    name: contextforge
  loop:
    - {api: apps/v1, kind: Deployment}
    - {api: v1, kind: Service}
    - {api: v1, kind: Secret}
    - {api: networking.k8s.io/v1, kind: NetworkPolicy}
  loop_control: {label: "{{ item.kind }}/contextforge"}
  when: not platform_contextforge_enabled | bool

- name: Find MCP token Secrets of the agents (made by mcp-sync)
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    kind: Secret
    namespace: "{{ agents_ns }}"
    label_selectors: [agentdev/mcp-project]
  register: platform_mcp_secrets
  when: not platform_contextforge_enabled | bool
  no_log: true

- name: Remove the MCP token Secrets of the agents
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: absent
    kind: Secret
    namespace: "{{ agents_ns }}"
    name: "{{ item }}"
  loop: "{{ platform_mcp_secrets.resources | default([]) | map(attribute='metadata.name') | list }}"
  when: not platform_contextforge_enabled | bool

# Read-only observability MCP tools (#205): same manifest as 08-mcp.sh. Values are checked like the binary checks them,
# so a bad value stops the run here, not in a crash-looping pod.
- name: Observability MCP settings are valid
  ansible.builtin.assert:
    that:
      - (obs_mcp.prometheus_url | default('')) is match('^(https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?)?$')
      - (obs_mcp.loki_url | default('')) is match('^(https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?)?$')
      - (obs_mcp.cloud_logging_project | default('')) is match('^([a-z][a-z0-9-]{4,28}[a-z0-9])?$')
      - (obs_mcp.prometheus_url | default('')) ~ (obs_mcp.loki_url | default('')) ~ (obs_mcp.cloud_logging_project | default('')) != '' or (obs_mcp.server_checks | default(true) | bool)
      - (obs_mcp.max_output | default(16384) | string) is match('^[0-9]+$')
      - (obs_mcp.rate_per_min | default(30) | string) is match('^[0-9]+$')
      - (obs_mcp.rate_burst | default(10) | string) is match('^[0-9]+$')
    fail_msg: "obs_mcp: URLs http(s)://host[:port][/path] without credentials, a GCP project id, at least one backend, numbers only"
  when: platform_obs_mcp_enabled | bool

- name: Observability MCP backend token from Secret Manager
  ansible.builtin.command: >-
    gcloud secrets versions access latest --secret {{ obs_mcp.token_secret }} --project {{ gcp_project }}
  register: platform_obs_token
  changed_when: false
  check_mode: false
  failed_when: platform_obs_token.rc != 0 and not ansible_check_mode
  when: platform_obs_mcp_enabled | bool and platform_secret_source == 'secret_manager'
    and (obs_mcp.token_secret | default('')) | length > 0
  no_log: true

- name: Observability MCP token Secret (only in obs-mcp's namespace, never in the agents namespace)
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if platform_obs_token.stdout | default('') | length > 0 else 'absent' }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: obs-mcp-token, namespace: "{{ platform_ns }}"}
      stringData: {token: "{{ platform_obs_token.stdout | default('') }}"}
  when: platform_obs_mcp_enabled | bool
  no_log: true

# Probe catalogue (#205): one random token shared by obs-mcp and the operator's probe server. Made once in the
# cluster (never in git or Secret Manager), kept across runs; the operator's probe server is off without it.
- name: Probe token Secret exists
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    kind: Secret
    namespace: "{{ platform_ns }}"
    name: agentdev-probe-token
  register: platform_probe_token
  no_log: true

- name: Probe token Secret (random, platform namespace only)
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: agentdev-probe-token, namespace: "{{ platform_ns }}"}
      stringData: {token: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['hexdigits']) }}"}
  when: (platform_probe_token.resources | default([])) | length == 0
  no_log: true

- name: Observability MCP server (obs-mcp)
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: "{{ 'present' if platform_obs_mcp_enabled | bool else 'absent' }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=obs_render) | from_yaml_all | list }}"
  vars:
    obs_render:
      src: "{{ repo_root }}/manifests/obs-mcp.yaml.tmpl"
      values:
        PLATFORM_NS: "{{ platform_ns }}"
        OPERATOR_IMAGE: "{{ operator_image }}"
        IMAGE_PULL_POLICY: IfNotPresent
        PROMETHEUS_URL: "{{ obs_mcp.prometheus_url | default('') }}"
        LOKI_URL: "{{ obs_mcp.loki_url | default('') }}"
        LOKI_TENANT: "{{ obs_mcp.loki_tenant | default('') }}"
        CLOUD_LOGGING_PROJECT: "{{ obs_mcp.cloud_logging_project | default('') }}"
        OBS_GSA: "{{ obs_mcp.cloud_logging_gsa | default('') }}"
        OBS_MCP_MAX_OUTPUT: "{{ obs_mcp.max_output | default(16384) }}"
        OBS_MCP_RATE_PER_MIN: "{{ obs_mcp.rate_per_min | default(30) }}"
        OBS_MCP_RATE_BURST: "{{ obs_mcp.rate_burst | default(10) }}"
        PROBE_URL: >-
          {{ ('http://agentdev-probe.' + platform_ns + '.svc.cluster.local:8090')
             if (obs_mcp.server_checks | default(true) | bool) else '' }}
      replace: []

# a local operator tag (kind) keeps its name across builds: restart so the pod runs the image just loaded
- name: Restart obs-mcp after a new local image (kind)
  ansible.builtin.command: >-
    kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout restart deployment/obs-mcp
  changed_when: true
  when: platform_obs_mcp_enabled | bool and not ansible_check_mode and platform_load is defined and
    (platform_load.results | default([]) | selectattr('item', 'equalto', operator_image) | selectattr('changed') | list | length > 0)

- name: Wait for obs-mcp
  ansible.builtin.command: >-
    kubectl --context {{ kube_context }} -n {{ platform_ns }} rollout status deployment/obs-mcp --timeout=300s
  changed_when: false
  when: platform_obs_mcp_enabled | bool and not ansible_check_mode

- name: MCP sync for each project spec
  when: mcp_projects | length > 0 and platform_contextforge_enabled | bool and not ansible_check_mode
  block:
    - name: Admin password file for mcp-sync (0600, removed below)
      ansible.builtin.tempfile: {state: file, suffix: .cf}
      register: platform_cf_file

    - name: Write the admin password
      ansible.builtin.copy:
        dest: "{{ platform_cf_file.path }}"
        content: "{{ platform_secret['cf-admin'] }}"
        mode: "0600"
      no_log: true

    # mcp-sync.sh never prints a token; no_log as a second guard (GHAS on #99). Only listed MCP hosts are registered.
    - name: Run scripts/mcp-sync.sh
      ansible.builtin.command:
        argv: ["{{ repo_root }}/scripts/mcp-sync.sh", "{{ item }}"]
      environment:
        KUBECTL: "kubectl --context {{ kube_context }}"
        PLATFORM_NS: "{{ platform_ns }}"
        AGENTS_NS: "{{ agents_ns }}"
        CF_ADMIN_EMAIL: "{{ platform_cf_admin_email }}"
        CF_ADMIN_FILE: "{{ platform_cf_file.path }}"
        MCP_ALLOWED_HOSTS: "{{ mcp_allowed_hosts | join(' ') }}"
      loop: "{{ mcp_projects }}"
      register: platform_mcp_sync
      changed_when: "': registered' in platform_mcp_sync.stdout or 'token scoped' in platform_mcp_sync.stdout or 'removed' in platform_mcp_sync.stdout"
      no_log: true
  always:
    - name: Remove the admin password file
      ansible.builtin.file: {path: "{{ platform_cf_file.path }}", state: absent}
      when: platform_cf_file.path is defined
