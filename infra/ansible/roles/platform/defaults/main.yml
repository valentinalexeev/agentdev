---
# Platform namespace on GKE (#51): Postgres + ContextForge, the same manifests/platform.yaml.tmpl as ./run.sh 08.
platform_postgres_image: postgres:17.11
platform_contextforge_image: ghcr.io/ibm/mcp-context-forge:v1.1.0
# ContextForge runs only when a project uses MCP (#172): it requests 100m CPU / 512Mi. false removes it (Postgres stays).
# Set true to keep it without mcp_projects (for example while specs are synced by hand).
platform_contextforge_enabled: "{{ mcp_projects | length > 0 }}"
platform_cf_admin_email: admin@agentdev.dev
# ContextForge may only call MCP servers in the cluster Service range (SSRF guard); infra/terraform uses 10.30.0.0/20
platform_service_cidr: 10.30.0.0/20
# Secret Manager prefix platform_sm_prefix: group_vars/all.yml (also read by the roles api and authentik, #333).
# Keys match .secrets/platform/ on kind (generated on the first run, never overwritten)
platform_secret_keys:
  - pg-admin
  - pg-contextforge
  - pg-agentdev
  - pg-authentik
  - jwt
  - enc
  - cf-admin
  - cf-default-user
  - cf-basic-auth
# mcp_projects (project specs for scripts/mcp-sync.sh) is in group_vars/all.yml

# Read-only observability MCP tools (#205): settings are `obs_mcp` in group_vars/all.yml. The Deployment uses the
# operator image (operator_image) and is applied before mcp-sync, so a project spec can register it.
platform_obs_mcp_enabled: "{{ obs_mcp.enabled | default(false) | bool }}"

# kind (#106, kind.yml): secrets as files instead of Secret Manager, images loaded into the kind nodes.
platform_secret_source: secret_manager     # files: platform_secrets_dir (kind)
platform_secrets_dir: "{{ repo_root }}/.secrets/platform"
# jwt and enc are two files each on kind (08-mcp.sh wrote jwt + jwt2, enc + enc2); a redeploy keeps them
platform_file_keys: [pg-admin, pg-contextforge, pg-agentdev, pg-authentik, jwt, jwt2, enc, enc2, cf-admin, cf-default-user, cf-basic-auth]
platform_kind_cluster: ""                  # kind cluster name: pull and kind-load the images; empty on GKE
platform_container_engine: docker
platform_kind_images: "{{ [platform_postgres_image] + ([platform_contextforge_image] if platform_contextforge_enabled | bool else []) }}"
