---
# kind (#106, was 09-authentik.sh): the authentik secrets are files in authentik_secrets_dir (.secrets/platform,
# shared with the platform role), generated once (openssl rand -hex 24, mode 600) and never overwritten.
# authentik-secret-key is two files joined (authentik-secret-key + authentik-secret-key2), as 09-authentik.sh did.
- name: Secrets directory (0700)
  ansible.builtin.file: {path: "{{ authentik_secrets_dir }}", state: directory, mode: "0700"}

- name: Authentik secret files exist (generated once)
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ authentik_secrets_dir }}/{{ item }}"
    if [ ! -s "$f" ]; then umask 077; openssl rand -hex 24 > "$f"; chmod 600 "$f"; echo created; fi
  args: {executable: /bin/bash}
  loop: "{{ authentik_file_keys }}"
  register: authentik_files_created
  changed_when: "'created' in authentik_files_created.stdout"
  no_log: true

- name: Read the authentik secret files
  ansible.builtin.slurp: {src: "{{ authentik_secrets_dir }}/{{ item }}"}
  loop: "{{ authentik_file_keys }}"
  register: authentik_files
  failed_when: authentik_files.failed | default(false) and not ansible_check_mode
  no_log: true

- name: Keep them in a fact (not logged)
  ansible.builtin.set_fact:
    authentik_secret: >-
      {{ f | combine({'authentik-secret-key': f.get('authentik-secret-key', '') ~ f.get('authentik-secret-key2', '')}) }}
  vars:
    f: "{{ dict(authentik_file_keys | zip(authentik_files.results | map(attribute='content', default='') | map('b64decode') | map('trim'))) }}"
  no_log: true
