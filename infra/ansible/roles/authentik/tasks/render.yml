---
# Render mode of the role (#447, render.yml): the authentik chart as `helm template` output, the blueprints ConfigMap
# and the database Job, as the fact authentik_objects. The Secret `authentik` (configuration with credentials) is not
# rendered; its name is in SECRETS.md. No Helm hooks and no lookup in the chart output (checked by tests/render_mode.yml).
# The chart's checksum/secret annotation is dropped: it hashes the chart's own (empty) Secret values, never changes
# with existingSecret, and looks like a key to gitleaks. The Jobs
# authentik-db-init-<hash> and authentik-breakglass-<hash> come from tasks/db_init_render.yml (#382), the same objects
# as deploy.yml applies; they read the passwords from the Secrets platform-db and authentik by name.
- name: Check the authentik settings (render)
  ansible.builtin.assert:
    that:
      - authentik_host is match('^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - authentik_version is match('^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}$')
    fail_msg: "authentik needs ingress.auth_host (a DNS name) and authentik.version YYYY.M.P"
    quiet: true

# Restarts on a configuration change (#451 review). deploy.yml sets agentdev/config-hash from the Secret `authentik`.
# The render cannot read it, so it sets two things instead:
#   - agentdev/config-hash on the pods: a hash of the non-secret inputs (values file, blueprints, chart version);
#   - secret.reloader.stakater.com/reload on the Deployments: Reloader (#445) restarts them when the Secret `authentik`
#     or `authentik-sso` changes. Without Reloader, restart them by hand (docs/admin.md).
- name: Values file of the render (annotations only, no secret)
  ansible.builtin.tempfile: {state: file, suffix: .yaml}
  register: authentik_render_values
  changed_when: false

- name: Write the render values
  ansible.builtin.copy:
    dest: "{{ authentik_render_values.path }}"
    mode: "0600"
    content: "{{ authentik_render_annotations | to_nice_yaml }}"
  changed_when: false
  vars:
    authentik_blueprint_files: "{{ query('ansible.builtin.fileglob', repo_root + '/manifests/authentik-blueprint-*.yaml') | sort }}"
    authentik_config_hash: >-
      {{ (([lookup('ansible.builtin.file', repo_root ~ '/manifests/authentik-values.yaml'), authentik_version,
            authentik_admin_email, authentik_trusted_proxy_cidrs | join(','), authentik_ui_callback]
           + query('ansible.builtin.file', *authentik_blueprint_files)) | to_json | hash('sha256'))[:16] }}
    authentik_render_annotations:
      global: {podAnnotations: {agentdev/config-hash: "{{ authentik_config_hash }}"}}
      server: {deploymentAnnotations: {secret.reloader.stakater.com/reload: "authentik,authentik-sso"}}
      worker: {deploymentAnnotations: {secret.reloader.stakater.com/reload: "authentik,authentik-sso"}}

- name: Render the authentik chart (helm template, no cluster access)
  ansible.builtin.command:
    argv: [helm, template, authentik, authentik, --repo, "{{ authentik_chart_repo }}", --version, "{{ authentik_version }}",
           --namespace, "{{ platform_ns }}", --kube-version, "{{ render_kube_version }}",
           -f, "{{ repo_root }}/manifests/authentik-values.yaml", -f, "{{ authentik_render_values.path }}"]
  register: authentik_helm
  changed_when: false
  check_mode: false

- name: Remove the render values file
  ansible.builtin.file: {path: "{{ authentik_render_values.path }}", state: absent}
  changed_when: false

- name: Render the Job authentik-db-init (login and database authentik)
  ansible.builtin.include_tasks: "{{ repo_root }}/infra/ansible/tasks/db_init_render.yml"
  vars:
    db_init_name: authentik-db-init
    db_init_image: "{{ authentik_db_init_image }}"
    db_init_command: [sh, /db-init/authentik.sh]
    db_init_files: "{{ authentik_db_init_files }}"
    db_init_env: "{{ authentik_db_init_env }}"

- name: Keep the authentik-db-init objects
  ansible.builtin.set_fact:
    authentik_db_objects: "{{ [db_init_cm, db_init_job] }}"

- name: Render the Job authentik-breakglass (akadmin into agentdev-admins, add only)
  ansible.builtin.include_tasks: "{{ repo_root }}/infra/ansible/tasks/db_init_render.yml"
  vars:
    db_init_name: authentik-breakglass
    db_init_image: "{{ authentik_image }}"
    db_init_user: 1000
    db_init_memory: 1Gi
    db_init_command: "{{ authentik_breakglass_command }}"
    db_init_files: "{{ authentik_breakglass_files }}"
    db_init_env: "{{ authentik_breakglass_env }}"
    db_init_env_from: "{{ authentik_breakglass_env_from }}"
  when: authentik_breakglass_admin_group | bool

- name: Render the authentik objects
  ansible.builtin.set_fact:
    authentik_objects:
      authentik_db: "{{ authentik_db_objects }}"
      authentik_breakglass: "{{ [db_init_cm, db_init_job] if authentik_breakglass_admin_group | bool else [] }}"
      authentik: >-
        {{ (authentik_helm.stdout | regex_replace('(?m)^\\s*checksum/secret: .*\\n', '') | from_yaml_all | select | list)
           + [{'apiVersion': 'v1', 'kind': 'ConfigMap', 'metadata': {'name': 'authentik-blueprints', 'namespace': platform_ns},
               'data': dict(authentik_blueprint_files | map('basename') | zip(query('ansible.builtin.file', *authentik_blueprint_files)))}] }}
    authentik_secret_names: "{{ [[platform_ns, 'authentik']] }}"
  vars:
    authentik_blueprint_files: "{{ query('ansible.builtin.fileglob', repo_root + '/manifests/authentik-blueprint-*.yaml') | sort }}"
