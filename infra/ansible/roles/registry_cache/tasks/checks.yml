---
# Value checks of the role (#203), for tasks/main.yml and the render mode (#615)
- name: Registry cache settings are valid (#203)
  ansible.builtin.assert:
    that:
      - registry_cache_mode in ['off', 'cluster', 'artifact_registry']
      - registry_cache_mode != 'artifact_registry' or (registry_cache_ar.service_account | default(''))
        is match('^[a-z][-a-z0-9]{4,28}[a-z0-9]@[a-z][-a-z0-9.:]+\\.iam\\.gserviceaccount\\.com$')
      - registry_cache_mode != 'artifact_registry' or (['npm', 'pypi', 'go'] | map('extract', registry_cache_ar)
        | select('match', '^https://[a-z0-9-]+-(npm|python|go)\\.pkg\\.dev/[a-z][-a-z0-9:.]*/[a-z][-a-z0-9]*/$') | list | length == 3)
      - registry_cache_storage is match('^[1-9][0-9]{0,4}(Mi|Gi)$')
    fail_msg: >-
      registry_proxy: off, cluster or artifact_registry. artifact_registry needs registry_cache_ar
      from `terraform output registry_proxy` (service_account, npm, pypi, go).
    quiet: true
