---
- name: Check the registry cache settings
  ansible.builtin.include_tasks: checks.yml

# devpi wants a root password; nobody logs in (the gateway refuses every write), so it is random, kept in the cluster
# only, and never in an agent pod
- name: Existing devpi root password
  kubernetes.core.k8s_info:
    context: "{{ registry_cache_context }}"
    kind: Secret
    namespace: "{{ registry_cache_ns }}"
    name: registry-cache-pypi
  register: registry_cache_pypi_secret
  no_log: true
  when: registry_cache_mode == 'cluster'

- name: Devpi root password Secret (generated once)
  kubernetes.core.k8s:
    context: "{{ registry_cache_context }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: registry-cache-pypi, namespace: "{{ registry_cache_ns }}", labels: "{{ registry_cache_labels }}"}
      stringData: {password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"}
  no_log: true
  when: registry_cache_mode == 'cluster' and (registry_cache_pypi_secret.resources | default([]) | length == 0)

- name: Gateway, caches and settings of the registry cache
  kubernetes.core.k8s:
    context: "{{ registry_cache_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'registry-cache.yaml.j2') | from_yaml_all | list }}"
  when: registry_cache_mode != 'off'

- name: Is the FQDNNetworkPolicy type served?
  kubernetes.core.k8s_info:
    context: "{{ registry_cache_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: fqdnnetworkpolicies.networking.gke.io
  register: registry_cache_fqdn_crd
  when: registry_cache_mode != 'off' and registry_cache_fqdn_policy | bool

- name: Refuse FQDN egress without the FQDNNetworkPolicy CRD (the caches would get no egress at all)
  ansible.builtin.assert:
    that: registry_cache_fqdn_crd.resources | default([]) | length > 0
    fail_msg: >-
      registry_proxy {{ registry_cache_mode }} needs the CRD fqdnnetworkpolicies.networking.gke.io for the egress of
      the caches. Apply infra/terraform (enable_fqdn_network_policy), or set platform.egress.fqdn: none.
  when: registry_cache_mode != 'off' and registry_cache_fqdn_policy | bool

- name: Egress of the caches and the gateway by name (GKE FQDNNetworkPolicy)
  kubernetes.core.k8s:
    context: "{{ registry_cache_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'fqdn-policy.yaml.j2') | from_yaml }}"
  when: registry_cache_mode != 'off' and registry_cache_fqdn_policy | bool and (registry_cache_fqdn_crd.resources | default([]) | length > 0)

- name: Egress of the caches and the gateway to any public address on 443 (no FQDN policy; kind)
  kubernetes.core.k8s:
    context: "{{ registry_cache_context }}"
    state: "{{ 'present' if registry_cache_mode != 'off' and not registry_cache_fqdn_policy | bool else 'absent' }}"
    definition: "{{ lookup('ansible.builtin.template', 'web-policy.yaml.j2') | from_yaml }}"

- name: Registry cache is off - remove its objects (agents fall back to the public registries)
  kubernetes.core.k8s:
    context: "{{ registry_cache_context }}"
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    namespace: "{{ registry_cache_ns }}"
    name: "{{ item.name }}"
  loop: "{{ registry_cache_cleanup }}"
  when: registry_cache_mode == 'off'

- name: Gateway and caches are ready
  ansible.builtin.command:
    argv: [kubectl, --context, "{{ registry_cache_context }}", -n, "{{ registry_cache_ns }}", rollout, status, "deploy/{{ item }}", --timeout=300s]
  loop: "{{ ['registry-cache'] + (['registry-cache-npm', 'registry-cache-pypi', 'registry-cache-go'] if registry_cache_mode == 'cluster' else []) }}"
  changed_when: false
  when: registry_cache_mode != 'off' and not ansible_check_mode
