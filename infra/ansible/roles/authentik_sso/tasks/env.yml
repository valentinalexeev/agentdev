---
# Builds the fact authentik_sso_env (AGENTDEV_SSO_* keys) from authentik.sso and the secret values in
# authentik_sso_idp_cert / authentik_sso_oidc_client_secret. No cluster access: tests/authentik_sso_cfg.yml runs it.
# admin_group and forge_attribute go into blueprint expressions: strict patterns, same as 09-authentik.sh.
- name: Check the SSO settings
  ansible.builtin.assert:
    that:
      - authentik_sso_kind in ['saml', 'oidc']
      - authentik_sso_cfg.admin_group | default('') is match('^[A-Za-z0-9._@+-]{1,128}$')
      - authentik_sso_cfg.allowed_domains | default([]) | length > 0
      - authentik_sso_cfg.allowed_domains | default([]) | reject('match', '^[a-z0-9][a-z0-9.-]{0,252}$') | list == []
      - authentik_sso_cfg.forge_attribute | default('githubLogin') is match('^[A-Za-z][A-Za-z0-9_.]{0,63}$')
      - authentik_sso_cfg.name | default('x') is match('^[A-Za-z0-9 ._()-]{1,64}$')
      - authentik_sso_kind != 'saml' or (authentik_sso_cfg.saml_sso_url | default('')) is match('^https://[^\s]+$')
      - authentik_sso_kind != 'oidc' or (authentik_sso_cfg.oidc_client_id | default('')) is match('^\S+$')
      - authentik_sso_kind != 'oidc' or (authentik_sso_cfg.oidc_authorize_url | default('')) is match('^https://\S+$')
      - authentik_sso_kind != 'oidc' or (authentik_sso_cfg.oidc_token_url | default('')) is match('^https://\S+$')
      - authentik_sso_kind != 'oidc' or (authentik_sso_cfg.oidc_userinfo_url | default('')) is match('^https://\S+$')
    fail_msg: >-
      authentik.sso: kind saml|oidc; admin_group (letters, digits, ._@+-); allowed_domains (a list of lower-case domains); forge_attribute (an attribute name);
      saml_sso_url for saml; oidc_* https URLs for oidc (example.vars.yml)
    quiet: true

- name: Check the secret values
  ansible.builtin.assert:
    that:
      - authentik_sso_kind != 'saml' or (authentik_sso_idp_cert | default('')) is search('-----BEGIN CERTIFICATE-----')
      - authentik_sso_kind != 'oidc' or (authentik_sso_oidc_client_secret | default('')) | length > 0
    fail_msg: >-
      Secret Manager: {{ authentik_sso_sm_idp_cert if authentik_sso_kind == 'saml' else authentik_sso_sm_oidc_client_secret }}
      is missing or empty (README.md)
    quiet: true
  no_log: true

- name: SSO env for the authentik pods
  ansible.builtin.set_fact:
    authentik_sso_env: >-
      {{ {'AGENTDEV_SSO_ADMIN_GROUP': authentik_sso_cfg.admin_group,
          'AGENTDEV_SSO_ALLOWED_DOMAINS': authentik_sso_cfg.allowed_domains | join(','),
          'AGENTDEV_SSO_FORGE_ATTR': authentik_sso_cfg.forge_attribute | default('githubLogin'),
          'AGENTDEV_SSO_NAME': authentik_sso_cfg.name | default('Google Workspace' if authentik_sso_kind == 'saml' else 'Company SSO')}
         | combine({'AGENTDEV_SSO_SAML': 'true',
                    'AGENTDEV_SSO_SAML_SSO_URL': authentik_sso_cfg.saml_sso_url | default(''),
                    'AGENTDEV_SSO_SAML_IDP_CERT': authentik_sso_idp_cert | default('')}
                   if authentik_sso_kind == 'saml' else
                   {'AGENTDEV_SSO_OIDC': 'true',
                    'AGENTDEV_SSO_OIDC_CLIENT_ID': authentik_sso_cfg.oidc_client_id | default(''),
                    'AGENTDEV_SSO_OIDC_CLIENT_SECRET': authentik_sso_oidc_client_secret | default(''),
                    'AGENTDEV_SSO_OIDC_AUTHORIZE_URL': authentik_sso_cfg.oidc_authorize_url | default(''),
                    'AGENTDEV_SSO_OIDC_TOKEN_URL': authentik_sso_cfg.oidc_token_url | default(''),
                    'AGENTDEV_SSO_OIDC_USERINFO_URL': authentik_sso_cfg.oidc_userinfo_url | default('')}) }}
  no_log: true
