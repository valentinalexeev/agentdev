---
# Same result as the old 13-secrets.sh. The playbook kind.yml runs the role operator after this role (tag secrets), so the
# operator turns the ProjectSecret controller on.
- name: External Secrets Operator {{ secrets_store_eso_chart_version }}
  # only the controller and its CRDs: no webhook or cert-controller (the CEL policies below validate instead), no
  # cluster-wide stores, ClusterExternalSecrets or PushSecrets. ESO itself reads and writes Secrets cluster-wide by design.
  kubernetes.core.helm:
    kube_context: "{{ secrets_store_context }}"
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: https://charts.external-secrets.io
    chart_version: "{{ secrets_store_eso_chart_version }}"
    release_namespace: "{{ secrets_store_eso_ns }}"
    create_namespace: true
    wait: true
    timeout: 5m0s
    values:
      installCRDs: true
      serviceAccount: {name: "{{ secrets_store_eso_sa }}"}
      webhook: {create: false}
      certController: {create: false}
      processClusterStore: false
      processClusterExternalSecret: false
      processPushSecret: false
      processClusterPushSecret: false
      resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}

- name: ESO CRDs are established
  kubernetes.core.k8s_info:
    context: "{{ secrets_store_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    wait: true
    wait_condition: {type: Established, status: "True"}
    wait_timeout: 60
  loop: [externalsecrets.external-secrets.io, secretstores.external-secrets.io]
  when: not ansible_check_mode

- name: Namespace {{ secrets_store_agents_ns }}
  kubernetes.core.k8s:
    context: "{{ secrets_store_context }}"
    definition: {apiVersion: v1, kind: Namespace, metadata: {name: "{{ secrets_store_agents_ns }}"}}

- name: CEL policies and the Kubernetes SecretStore
  kubernetes.core.k8s:
    context: "{{ secrets_store_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=item) | from_yaml_all | list }}"
  loop:
    - src: "{{ repo_root }}/manifests/secrets-policy.yaml.tmpl"
      values:
        AGENTS_NS: "{{ secrets_store_agents_ns }}"
        PLATFORM_NS: "{{ secrets_store_platform_ns }}"
        ESO_NS: "{{ secrets_store_eso_ns }}"
        ESO_SA: "{{ secrets_store_eso_sa }}"
      replace: []
    - src: "{{ repo_root }}/manifests/secrets-store-kubernetes.yaml.tmpl"
      values: {AGENTS_NS: "{{ secrets_store_agents_ns }}", SECRETS_VALUES_NS: "{{ secrets_store_values_ns }}"}
      replace: []
  loop_control: {label: "{{ item.src | basename }}"}
  when: not ansible_check_mode   # the policy and store types are unknown before ESO is installed

- name: SecretStore agentdev-secrets is ready
  kubernetes.core.k8s_info:
    context: "{{ secrets_store_context }}"
    api_version: external-secrets.io/v1
    kind: SecretStore
    namespace: "{{ secrets_store_agents_ns }}"
    name: agentdev-secrets
  register: secrets_store_state
  until: >-
    secrets_store_state.resources | length > 0 and
    (secrets_store_state.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length > 0)
  retries: 30
  delay: 2
  when: not ansible_check_mode

# Project secrets API (#202 part 3): the API writes value Secrets into the value namespace, write-only (create, update,
# delete; no get, list or watch). The role api sets SECRETS_VALUES_NS once that namespace exists; an API deployed
# before this role gets it here, as 13-secrets.sh did.
- name: Write-only RBAC of the API in {{ secrets_store_values_ns }}
  kubernetes.core.k8s:
    context: "{{ secrets_store_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=secrets_store_api) | from_yaml_all | list }}"
  vars:
    secrets_store_api:
      src: "{{ repo_root }}/manifests/secrets-api.yaml.tmpl"
      values: {SECRETS_VALUES_NS: "{{ secrets_store_values_ns }}", PLATFORM_NS: "{{ secrets_store_platform_ns }}"}
      replace: []

- name: Deployment agentdev-api
  kubernetes.core.k8s_info:
    context: "{{ secrets_store_context }}"
    kind: Deployment
    namespace: "{{ secrets_store_platform_ns }}"
    name: agentdev-api
  register: secrets_store_api_dep

- name: The API serves /api/secrets (values in {{ secrets_store_values_ns }})
  ansible.builtin.command:
    argv: [kubectl, --context, "{{ secrets_store_context }}", -n, "{{ secrets_store_platform_ns }}", set, env,
           deploy/agentdev-api, "SECRETS_VALUES_NS={{ secrets_store_values_ns }}"]
  register: secrets_store_api_env
  changed_when: "'updated' in secrets_store_api_env.stdout"
  when: secrets_store_api_dep.resources | length > 0 and not ansible_check_mode

# Credential broker (#202 part 2, mode broker): the credproxy image with MODE=broker. It authenticates agents by their
# projected service account token (audience credential-broker) with TokenReview, so its NetworkPolicy allows the API
# server addresses (Service default/kubernetes), as for claude-proxy (#352).
- name: API server addresses (Service default/kubernetes) for the broker egress
  kubernetes.core.k8s_info:
    context: "{{ secrets_store_context }}"
    kind: "{{ item }}"
    namespace: default
    name: kubernetes
  loop: [Service, Endpoints]
  register: secrets_store_kube_api
  when: secrets_store_broker_enabled | bool

- name: Credential broker ServiceAccount, TokenReview RBAC, Deployment, Service and NetworkPolicy
  kubernetes.core.k8s:
    context: "{{ secrets_store_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=secrets_store_broker) | from_yaml_all | list }}"
    wait: true
    wait_timeout: 120
  vars:
    secrets_store_kube_api_ips: >-
      {{ ([secrets_store_kube_api.results[0].resources[0].spec.clusterIP] if secrets_store_kube_api.results[0].resources else [])
         + (secrets_store_kube_api.results[1].resources | map(attribute='subsets', default=[]) | flatten
            | map(attribute='addresses', default=[]) | flatten | map(attribute='ip') | list) }}
    secrets_store_broker:
      src: "{{ repo_root }}/manifests/credential-broker.yaml.tmpl"
      values:
        AGENTS_NS: "{{ secrets_store_agents_ns }}"
        CLAUDE_PROXY_IMAGE: "{{ secrets_store_broker_image }}"
        IMAGE_PULL_POLICY: "{{ secrets_store_broker_pull_policy }}"
        CREDENTIAL_BROKER_URL: "http://credential-broker.{{ secrets_store_agents_ns }}.svc.cluster.local:8080"
        KUBE_API_EGRESS: >-
          {{ lookup('ansible.builtin.template', 'templates/kube-api-egress.j2', template_vars={'kube_api_ips': secrets_store_kube_api_ips}) | trim }}
      replace: []
  when: secrets_store_broker_enabled | bool and not ansible_check_mode
