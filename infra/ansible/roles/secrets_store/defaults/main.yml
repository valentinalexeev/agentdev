---
# Scoped secrets store on kind (#106, was 13-secrets.sh; #202, ADR 0003 D1): External Secrets Operator, the CEL policies
# and the Kubernetes SecretStore. GKE uses GCP Secret Manager instead (#202 part 4).
secrets_store_context: kind-agentdev
secrets_store_enabled: true                      # SECRETS_STORE_ENABLED
secrets_store_eso_chart_version: 2.14.0          # ESO_CHART_VERSION
secrets_store_eso_ns: external-secrets           # ESO_NS
secrets_store_eso_sa: external-secrets           # ESO_SA: the policy lets only it write ps-*
secrets_store_values_ns: agentdev-secret-values  # SECRETS_VALUES_NS: the store's value Secrets
secrets_store_agents_ns: coding-agents
secrets_store_platform_ns: agentdev-platform
