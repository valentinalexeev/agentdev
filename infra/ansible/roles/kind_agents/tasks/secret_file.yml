---
# One generated secret file (openssl rand -hex 32, mode 600), created once and never overwritten, as secret_file() in
# 06-agents.sh. Sets kind_agents_secret[<name>] (not logged) and kind_agents_secret_new[<name>] (created this run).
- name: Secret file exists (generated once) {{ kind_agents_sf }}
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ kind_agents_secrets_dir }}/{{ kind_agents_sf }}"
    if [ ! -s "$f" ]; then umask 077; openssl rand -hex 32 > "$f"; chmod 600 "$f"; echo created; fi
  args: {executable: /bin/bash}
  register: kind_agents_sf_created
  changed_when: "'created' in kind_agents_sf_created.stdout"
  no_log: true

- name: Read secret file {{ kind_agents_sf }}
  ansible.builtin.slurp: {src: "{{ kind_agents_secrets_dir }}/{{ kind_agents_sf }}"}
  register: kind_agents_sf_read
  # in --check on a first run the file does not exist yet
  failed_when: kind_agents_sf_read.failed | default(false) and not ansible_check_mode
  no_log: true

- name: Keep in a fact (not logged) {{ kind_agents_sf }}
  ansible.builtin.set_fact:
    kind_agents_secret: >-
      {{ kind_agents_secret | default({}) | combine({kind_agents_sf: (kind_agents_sf_read.content | default('') | b64decode | trim)}) }}
    kind_agents_secret_new: >-
      {{ kind_agents_secret_new | default({}) | combine({kind_agents_sf: kind_agents_sf_created is changed}) }}
  no_log: true
