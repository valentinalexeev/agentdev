---
# Claude proxy settings of the role kind_agents (#196, #310, #352): the same checks as deploy.yml. Sets
# claude_budget_units_effective and kind_agents_prices. tests/kind_agents.yml runs this file on its own.
- name: "Claude budget in cost units (CLAUDE_BUDGET_TOKENS deprecated, #196)"
  ansible.builtin.include_tasks: "{{ kind_agents_repo_root }}/infra/ansible/tasks/claude_budget.yml"
  vars:
    claude_budget_units: >-
      {{ kind_agents_claude_budget_units
         if (kind_agents_claude_budget_units is not none and kind_agents_claude_budget_units | string | length > 0) else none }}
    claude_budget_tokens: >-
      {{ kind_agents_claude_budget_tokens
         if (kind_agents_claude_budget_tokens is not none and kind_agents_claude_budget_tokens | string | length > 0) else none }}

- name: CLAUDE_PRICES entries are key=number (#196)
  ansible.builtin.assert:
    that: >-
      kind_agents_claude_prices | string | split | reject('match',
      '^(w_in|w_cw5|w_cw1h|w_cr|w_out|usd_per_million_units|model\\.[a-z0-9][a-z0-9.-]{0,62})=[0-9]+(\\.[0-9]{1,6})?$')
      | list | length == 0
    fail_msg: "CLAUDE_PRICES: every entry is key=number (docs/admin.md)"
    quiet: true

- name: Claude prices as a mapping (the ConfigMap claude-proxy-prices)
  ansible.builtin.set_fact:
    kind_agents_prices: "{{ dict(kind_agents_claude_prices | string | split | map('split', '=', 1)) }}"

- name: Claude proxy budget, job limits, auth mode and telemetry
  ansible.builtin.assert:
    that:
      - (claude_budget_units_effective | string) is match('^[0-9]+$')
      - (kind_agents_claude_job_budget_units | string) is match('^[0-9]{1,15}$')
      - (kind_agents_claude_job_approval_units | string) is match('^[0-9]{1,15}$')
      - (kind_agents_claude_job_approval_step_units | string) is match('^[0-9]{1,15}$')
      - >-
        (kind_agents_claude_job_approval_units | int) == 0 or (kind_agents_claude_job_budget_units | int) == 0
        or (kind_agents_claude_job_approval_units | int) < (kind_agents_claude_job_budget_units | int)
      - kind_agents_claude_proxy_auth in ['key', 'both', 'token']
      - (kind_agents_telemetry.instance | default('agentdev')) is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - (kind_agents_telemetry.otlp_url | default('')) is match('^(https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._/-]*)?)?$')
      - (kind_agents_telemetry.scraper_ns | default('monitoring')) is match('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')
      - kind_agents_telemetry.scraper_selector is mapping and kind_agents_telemetry.scraper_selector | length > 0
    fail_msg: >-
      CLAUDE_BUDGET_UNITS and the CLAUDE_JOB_*_UNITS are non-negative integers; CLAUDE_JOB_APPROVAL_UNITS must be lower
      than CLAUDE_JOB_BUDGET_UNITS (#310); CLAUDE_PROXY_AUTH is key, both or token (#352); TELEMETRY_OTLP_URL is an
      https URL; TELEMETRY_INSTANCE and TELEMETRY_SCRAPER_NS are DNS labels; TELEMETRY_SCRAPER_SELECTOR is a JSON object
    quiet: true

- name: Warn when the soft job limit has no approvals (#310)
  ansible.builtin.debug:
    msg: >-
      [WARNING] CLAUDE_JOB_APPROVAL_UNITS is set but APPROVALS=false: a job at the soft limit stops without a question
  when: (kind_agents_claude_job_approval_units | int) > 0 and not (kind_agents_approvals | bool)
