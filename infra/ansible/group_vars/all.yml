# Generic defaults for installing agentdev onto a GKE cluster from infra/terraform.
# Instance values (project, zone, reviewer, agents, image tag) are NOT set here: the deployment repository
# provides them (see examples/deployment/gcp-gke and example.vars.yml). The playbook stops if one is missing.
# Never put secret values in vars files.

cluster_name: agentdev
kube_context: "gke_{{ gcp_project }}_{{ gcp_zone }}_{{ cluster_name }}"
agents_ns: coding-agents
platform_ns: agentdev-platform

# Published images (#28). Deployments pin image_tag to a release (vX.Y.Z, strict SemVer).
image_registry: ghcr.io/valentinalexeev
worker_image: "{{ image_registry }}/agentdev-worker:{{ image_tag }}"
forge_image: "{{ image_registry }}/agentdev-forge:{{ image_tag }}"   # agent pod sidecar, holds the forge token (#64)
router_image: "{{ image_registry }}/agentdev-router:{{ image_tag }}"
operator_image: "{{ image_registry }}/agentdev-operator:{{ image_tag }}"
credproxy_image: "{{ image_registry }}/agentdev-credproxy:{{ image_tag }}"   # Claude credential proxy (#66)

# Claude credential proxy (#66): the only holder of the Claude credentials; agent pods get a per-agent key.
claude_proxy: true                  # false: credential in the agent pod (deprecated rollback, docs/security.md R11)
claude_proxy_upstream_host: api.anthropic.com   # the only egress name of the proxy on GKE (FQDNNetworkPolicy)
claude_budget_tokens: 0             # tokens per agent per 24 h (input, cache and output); 0 = no limit

# Egress allow-list (#65). Agent pods reach the outside only through the egress proxy, and it only these hosts
# (Squid dstdomain: a leading dot = the domain and its subdomains). Add a project's build needs with egress_extra_hosts
# in instance.yml. egress_fqdn_policy also limits the proxy pod itself with a GKE FQDNNetworkPolicy (needs
# enable_fqdn_network_policy on the cluster, set by infra/terraform).
egress_hosts: [api.anthropic.com, .github.com, .githubusercontent.com, registry.npmjs.org, pypi.org,
               files.pythonhosted.org, proxy.golang.org, sum.golang.org, index.crates.io, static.crates.io]
egress_extra_hosts: []
# forge hosts for the forge sidecar only: the proxy refuses them without the sidecar's credential (egress-forge-proxy).
# api.anthropic.com in egress_hosts is dropped for agents while claude_proxy is true (docs/security.md R64).
forge_egress_hosts: [api.github.com, github.com]
egress_fqdn_policy: true
egress_proxy_image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029

forge_kind: github
forge_url: https://api.github.com
poll_seconds: 60                    # webhooks wake agents; polling is the fallback
max_concurrent: 2                   # items per agent in parallel (#20); per-agent override: agents[].max_concurrent
scale_to_zero: false                # stop idle agents, start on events (#35); per agent: agents[].scale_to_zero
idle_seconds: 900                   # cluster-wide (the operator's); per-agent idle time is not in the Agent spec yet
botboard_url: ""                    # agents report work to botboard (#26), e.g. http://botboard.<tailnet>; empty = off

# Secret Manager names (containers created by Terraform; values added by the owner or the UI, #12)
sm_claude_shared: claude-shared
sm_router_register_token: router-register-token
sm_forge_webhook_secret: github-app-webhook-secret
sm_github_app_private_key: github-app-private-key   # PEM from scripts/github-app.sh convert (#2)
sm_security_siem: security-siem          # optional: SIEM output secrets as KEY=VALUE lines (#70, #71)
sm_claude_proxy_signing: claude-proxy-signing   # generated by the playbook on first run (#66)
sm_egress_forge_proxy: egress-forge-proxy       # forge sidecar's egress proxy credential, generated on first run (#65)

# Required from the deployment (no defaults on purpose):
#   gcp_project, gcp_zone, image_tag, reviewer,
#   agents: [{name, user, repos}]   per agent, Secret Manager optionally holds agent-<name>-claude
#                                   (forge_kind gitea: also agent-<name>-forge-token)
#   github_app.app_id               forge_kind github (#2); github_app.installation_id optional
# security events (#70): auto-pause and SecurityEvent retention (operator). Webhook output settings
# (security.siem.{webhook_url, syslog_addr, syslog_server_name, otlp_url, otlp_server_name} in instance.yml,
# secret values in the Secret Manager secret sm_security_siem) fill the Secret agentdev-api-siem (roles/api, #71).
security:
  pause_after: 5                    # more than N events in one job pause the agent
  retention_days: 30                # SecurityEvent objects; the API's Postgres table keeps the history
  max_per_agent: 500
# subscription usage limits (#93): default global thresholds in percent until an admin sets them in the web UI
usage:
  five_hour: 80                     # pause new runs at this use of the 5-hour window
  weekly: 90                        # and of the weekly window
# MCP platform (#51): project specs with an `mcp:` section, synced by scripts/mcp-sync.sh after ContextForge is up.
# Paths on the operator machine (the deployment repo). Images and the Service range: roles/platform/defaults.
mcp_projects: []
# Allow-list of MCP server hosts (host or host:port) that project specs may register (docs/security.md R51).
# MCP tool metadata and outputs reach the model, so list trusted servers only. Empty: no server is registered.
mcp_allowed_hosts: []
approvals:                          # #67: agents ask a project member on the forge (docs/security-model.md)
  enabled: true                     # default on GKE (the API is expected there); needs api.oidc_issuer (#115),
                                    # deploy.yml checks it. kind keeps APPROVALS=false (config.env): no API by default
  timeout_minutes: 30               # no decision in this time: denied (expired)
  retention_days: 90                # Approval objects; decisions stay in the audit log
# deterministic executors (#69): namespace, poll and retention; the executors themselves come from the deployment
exec_ns: agentdev-executors
executor_poll_seconds: 60
executor_retention_days: 30
executor_apply_start_minutes: 30   # an allowed apply starts at most this long after the decision, else nothing applies
executors: []   # [{name, environment, repo, path, image (by digest), plan: [argv], apply: [argv], plan_gsa, apply_gsa, egress_hosts}]
# Executor egress (#135). Executor Jobs reach the outside only through the executor egress proxy, and it only these
# hosts plus the forge's git host and each executor's egress_hosts (Squid dstdomain: a leading dot = the domain and
# its subdomains). Cloud APIs belong to the executor that needs them, for example
# egress_hosts: [oauth2.googleapis.com, storage.googleapis.com, cloudresourcemanager.googleapis.com].
executor_egress_hosts: [registry.terraform.io, releases.hashicorp.com]
# Management API (#104), optional: deployed only when api.oidc_issuer is set. Keys: oidc_issuer (https, required),
# oidc_discovery_url, oidc_audience (agentdev), forge_url, db_retention_days (365). Defaults: roles/api/defaults.
api: {}
# authentik on GKE (#114): deployed by the role authentik when authentik.enabled is true; the default is on when
# ingress.auth_host (the public login host) is set. Then api.oidc_issuer and api.oidc_discovery_url default to
# authentik (an explicit api.oidc_issuer still wins, for another OIDC provider).
authentik_enabled: "{{ (authentik | default({})).enabled | default(((ingress | default({})).auth_host | default('')) | length > 0) | bool }}"
authentik_default_issuer: >-
  {{ ('https://' ~ ingress.auth_host ~ '/application/o/agentdev/') if authentik_enabled | bool and
     ((ingress | default({})).auth_host | default('')) | length > 0 else '' }}
authentik_default_discovery_url: >-
  {{ ('http://authentik-server.' ~ platform_ns ~ '.svc.cluster.local/application/o/agentdev/')
     if authentik_default_issuer | length > 0 else '' }}
# the issuer the playbook uses (api role, approvals check, ingress UI route)
api_effective_issuer: "{{ api.oidc_issuer | default(authentik_default_issuer) }}"
