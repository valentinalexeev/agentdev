# Generic defaults for installing agentdev onto a GKE cluster from infra/terraform.
# Instance values (project, zone, reviewer, agents, image tag) are NOT set here: the deployment repository
# provides them (see examples/deployment/gcp-gke and example.vars.yml). The playbook stops if one is missing.
# Never put secret values in vars files.

cluster_name: agentdev
kube_context: "gke_{{ gcp_project }}_{{ gcp_zone }}_{{ cluster_name }}"
agents_ns: coding-agents

# Published images (#28). Deployments pin image_tag to a release (vX.Y.Z, strict SemVer).
image_registry: ghcr.io/valentinalexeev
worker_image: "{{ image_registry }}/agentdev-worker:{{ image_tag }}"
router_image: "{{ image_registry }}/agentdev-router:{{ image_tag }}"

forge_kind: github
forge_url: https://api.github.com
poll_seconds: 60                    # webhooks wake agents; polling is the fallback
max_concurrent: 2                   # items per agent in parallel (#20); per-agent override: agents[].max_concurrent
scale_to_zero: false                # stop idle agents, start on events (#35); per agent: agents[].scale_to_zero
idle_seconds: 900                   # per agent: agents[].idle_seconds

# Secret Manager names (containers created by Terraform; values added by the owner or the UI, #12)
sm_claude_shared: claude-shared
sm_router_register_token: router-register-token
sm_forge_webhook_secret: github-app-webhook-secret

# Required from the deployment (no defaults on purpose):
#   gcp_project, gcp_zone, image_tag, reviewer,
#   agents: [{name, user, repos}]   per agent, Secret Manager holds agent-<name>-forge-token
#                                   and optionally agent-<name>-claude
