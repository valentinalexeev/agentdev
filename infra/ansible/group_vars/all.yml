# Generic defaults for installing agentdev onto a GKE cluster from infra/terraform.
# Instance values (project, zone, reviewer, agents, image tag) are NOT set here: the deployment repository
# provides them (see examples/deployment/gcp-gke and example.vars.yml). The playbook stops if one is missing.
# Never put secret values in vars files.

cluster_name: agentdev
kube_context: "gke_{{ gcp_project }}_{{ gcp_zone }}_{{ cluster_name }}"
agents_ns: coding-agents
platform_ns: agentdev-platform
# Secret Manager prefix of the platform secrets; read by the roles platform, api and authentik. Here and not in a role's
# defaults: include_role does not make one role's defaults visible to the next role (#333).
platform_sm_prefix: platform-

# Labels (#184), the same as Terraform's `labels`: on the agentdev namespaces and on agent and executor pods (GKE cost
# allocation). Set environment (dev, stage or prod) in instance.yml; service defaults to agentdev.
agentdev_labels: {}
agentdev_effective_labels: "{{ {'service': 'agentdev'} | combine(agentdev_labels) }}"

# Published images (#28). Deployments pin image_tag to a release (vX.Y.Z, strict SemVer).
image_registry: ghcr.io/valentinalexeev
worker_image: "{{ image_registry }}/agentdev-worker:{{ image_tag }}"
forge_image: "{{ image_registry }}/agentdev-forge:{{ image_tag }}"   # agent pod sidecar, holds the forge token (#64)
router_image: "{{ image_registry }}/agentdev-router:{{ image_tag }}"
operator_image: "{{ image_registry }}/agentdev-operator:{{ image_tag }}"
credproxy_image: "{{ image_registry }}/agentdev-credproxy:{{ image_tag }}"   # Claude credential proxy (#66)

# Claude credential proxy (#66): the only holder of the Claude credentials; agent pods get a per-agent key.
claude_proxy: true                  # false: credential in the agent pod (deprecated rollback, docs/security.md R11)
claude_proxy_upstream_host: api.anthropic.com   # the only egress name of the proxy on GKE (FQDNNetworkPolicy)
claude_budget_units: null           # #196: cost units per agent per 24 h (input-token equivalents, docs/admin.md); null/0 = no limit
# claude_budget_tokens: deprecated in 1.2.0, removed in 2.0.0. Used as units (1:1) only when claude_budget_units is null.
# The effective value is claude_budget_units_effective (tasks below).
claude_prices: {}                   # #196: ConfigMap claude-proxy-prices (w_in, w_cw5, w_cw1h, w_cr, w_out, model.<prefix>,
                                    # usd_per_million_units); {} = built-in weights, no USD estimate
# Per job in cost units (#196 D6, #310), 0 = off. claude_job_budget_units: hard limit of one job id. claude_job_approval_units:
# soft limit, lower than the hard one: the agent asks a person (approval source cost), each approval adds
# claude_job_approval_step_units (0 = the soft limit). A rejection or no answer in time ends the job as failed.
claude_job_budget_units: 0
claude_job_approval_units: 0
claude_job_approval_step_units: 0
# Telemetry (#196, ADR 0002 D4/D5): claude-proxy and the operator serve metrics on 9464, reachable only from the
# scraper namespace (Managed Service for Prometheus: gmp-system). otlp_url: https OTLP endpoint for metrics and spans.
telemetry:
  scraper_ns: gmp-system
  scraper_selector: {app.kubernetes.io/name: collector}   # the GMP collector pods; only they reach 9464
  otlp_url: ""
  instance: agentdev   # label agentdev_instance on every metric (#278): one external Grafana for many instances
# How agents prove who they are to the proxy (#352): key = HMAC key only (before 1.1), both = key or projected service
# account token (TokenReview), token = token only. Set token after every agent runs a 1.1 worker (docs/admin.md).
claude_proxy_auth: both

# Egress allow-list (#65). Agent pods reach the outside only through the egress proxy, and it only these hosts
# (Squid dstdomain: a leading dot = the domain and its subdomains). Add a project's build needs with egress_extra_hosts
# in instance.yml. egress_fqdn_policy also limits the proxy pod itself with a GKE FQDNNetworkPolicy (needs
# enable_fqdn_network_policy on the cluster, set by infra/terraform).
egress_hosts: [api.anthropic.com, .github.com, .githubusercontent.com, registry.npmjs.org, pypi.org,
               files.pythonhosted.org, proxy.golang.org, sum.golang.org, index.crates.io, static.crates.io]
egress_extra_hosts: []
# forge hosts for the forge sidecar only: the proxy refuses them without the sidecar's credential (egress-forge-proxy).
# api.anthropic.com in egress_hosts is dropped for agents while claude_proxy is true (docs/security.md R64).
forge_egress_hosts: [api.github.com, github.com]
# toolchain preset downloads (#499): only the init container toolchain, with the egress-setup-proxy credential. The
# hosts of the operator's preset catalogue (images/operator/toolchain.go ToolchainHosts).
setup_egress_hosts: [dl.google.com, static.rust-lang.org]
egress_fqdn_policy: true
# Read-only plan identity (#291, #421): set true together with Terraform create_plan_identity = true. The preflight
# then checks that the apply account may create it. plan_identity_billing_account: Terraform billing_account_id, or
# '' with create_budget = false (required with plan_identity). plan_identity_state_bucket: '' = <gcp_project>-tfstate.
plan_identity: false
plan_identity_state_bucket: ""
egress_proxy_image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029

forge_kind: github
forge_url: https://api.github.com
poll_seconds: 60                    # webhooks wake agents; polling is the fallback
max_concurrent: 2                   # items per agent in parallel (#20); per-agent override: agents[].max_concurrent
max_turns: 40                       # turn limit of one Claude run (#336, 1-500); per-agent override: agents[].max_turns
# Claude model and reasoning effort of the agents' runs (#564, #570): `claude --model`, `--effort`. Empty: the CLI's
# own default, as before. claude_model: an alias (opus, sonnet, haiku, fable) or a claude-proxy price family name
# (claude-opus-..., claude-sonnet-..., optional [1m]), checked against claude_model_re before rendering;
# claude_effort: low, medium, high, xhigh, max. Per-agent override: agents[].model, agents[].effort.
claude_model: ""
claude_effort: ""
# the rule of spec.model (images/operator/render.go modelChars, the CRD pattern, max. 80 characters)
claude_model_re: '^(opus|sonnet|haiku|fable|claude-(opus|sonnet|haiku|fable)(-[a-z0-9]+)*)(\[1m\])?$'
# Toolchain per agent only (#499): agents[].toolchain = {presets: {go: "1.27.4", rust: "1.100.0"}, path: [...],
# refresh: 168h}. Versions from the operator's catalogue; installed read-only before the agent starts.
# Tools added to the default allow-list per agent only (#496): agents[].tools = {allow: ["Bash(npm ci:*)"]}.
# Claude Code permission mode per agent only (#500): agents[].permission = {mode: auto, autoMode: {allow: [...],
# softDeny: [...], environment: [...]}}. Unset: dontAsk. In mode auto a classifier decides calls outside the allow-list.
scale_to_zero: true                 # stop idle agents, start on events (#35, default since #181); per agent: agents[].scale_to_zero
wake_poll_seconds: 300              # the router checks the forge for work of stopped agents (#181); 0 = webhooks only
# webhooks reach the router: GitHub through the public ingress (ingress.webhook_host or ingress.host). With scale to
# zero and wake_poll_seconds 0 the playbook refuses to run without them (agents would stop and never start again).
webhooks_enabled: "{{ ((ingress | default({})).webhook_host | default((ingress | default({})).host | default(''))) | length > 0 }}"
sm_router_poll_token: router-poll-forge-token   # forge_kind gitea only: read-only token of the wake poll (optional)
# External Gitea (#442; forge_kind gitea, forge_url https://gitea.example.com). Default is secrets-only: the owner puts
# the tokens (agent-<name>-forge-token, agentdev-api-forge-token, router-poll-forge-token) and the webhook secret in
# Secret Manager. The host of forge_url is added to the forge sidecar's egress hosts by itself.
# forge_init.enabled: true runs the Job forge-init-<hash> (tasks/forge_init.yml) with an admin token of that Gitea
# (Secret Manager sm_gitea_admin_token, synced by ESO). It sets collaborators, agent:<name> labels, the router webhook
# and branch protection through the Gitea API; it mints no tokens and creates no repository.
# Keys: enabled, create_accounts (false), protect_branch (true), hook_url (in-cluster router; set the public webhook
# URL when Gitea is outside the cluster), api_user (agentdev-api), router_user (agentdev-router), ca_configmap
# (ConfigMap in platform_ns with ca.crt for a private CA), rerun (any new string runs the Job again).
forge_init: {enabled: false}
sm_gitea_admin_token: gitea-admin-token
# the external Gitea host for the forge sidecar (Squid and FQDNNetworkPolicy); empty for GitHub
forge_gitea_egress_hosts: "{{ [forge_url | urlsplit('hostname')] if forge_kind == 'gitea' else [] }}"
# agent volume (#173): one PVC per agent on this StorageClass. deploy.yml creates it as pd-standard (cheapest GCE disk);
# "" = the cluster default. Size: GCE bills at least 10 GB per disk, so 10Gi costs no more than less.
agent_storage_class: agentdev-agent
agent_state_storage: 10Gi
# ephemeral-storage of agent pods (#251): past a limit the kubelet evicts the pod and the StatefulSet recreates it
agent_ephemeral_request: 1Gi        # agent container request
agent_ephemeral_limit: 8Gi          # agent container limit (/tmp, caches outside the state volume)
forge_mirror_limit: 4Gi             # forge sidecar git mirror emptyDir
forge_ephemeral_limit: 5Gi          # forge sidecar limit; at least forge_mirror_limit
idle_seconds: 900                   # cluster-wide (the operator's); per-agent idle time is not in the Agent spec yet
botboard_url: ""                    # agents report work to botboard (#26), e.g. http://botboard.<tailnet>; empty = off

# Secret Manager names (containers created by Terraform; values added by the owner or the UI, #12)
sm_claude_shared: claude-shared
sm_router_register_token: router-register-token
sm_forge_webhook_secret: github-app-webhook-secret
sm_github_app_private_key: github-app-private-key   # PEM from scripts/github-app.sh convert (#2)
sm_security_siem: security-siem          # optional: SIEM output secrets as KEY=VALUE lines (#70, #71)
sm_claude_proxy_signing: claude-proxy-signing   # generated by the playbook on first run (#66)
sm_egress_forge_proxy: egress-forge-proxy       # forge sidecar's egress proxy credential, generated on first run (#65)
sm_egress_setup_proxy: egress-setup-proxy       # toolchain init containers' egress proxy credential, generated on first run (#499)

# Platform secrets (#381). secrets_mode external: Terraform generates the generated secrets (infra/terraform/secrets.tf),
# the External Secrets Operator syncs every platform Secret from Secret Manager, and Stakater Reloader restarts the
# consumers. The playbook then reads no secret value and calls no `gcloud secrets` command (the GitOps install, #388).
# secrets_mode playbook (default in 1.x, so an upgrade changes nothing until you switch): the 1.1 behaviour.
secrets_mode: "{{ (external_secrets | default({})).mode | default('playbook') }}"
external_secrets_store: agentdev-platform-secrets   # SecretStore and its service account, one per namespace
external_secrets_refresh: 15m                       # how often ESO reads Secret Manager again
# agents whose agent-<name>-claude exists in Secret Manager: agents[].own_claude: true (the playbook does not look)
# Reloader (#381): a workload restarts when one of these Secrets changes; see docs/admin.md, Rotate a secret
reloader_annotation: secret.reloader.stakater.com/reload

# Required from the deployment (no defaults on purpose):
#   gcp_project, gcp_zone, image_tag, reviewer,
#   agents: [{name, user, repos}]   per agent, Secret Manager optionally holds agent-<name>-claude
#                                   (forge_kind gitea: also agent-<name>-forge-token)
#   github_app.app_id               forge_kind github (#2); github_app.installation_id optional
# security events (#70): auto-pause and SecurityEvent retention (operator). Webhook output settings
# (security.siem.{webhook_url, syslog_addr, syslog_server_name, otlp_url, otlp_server_name} in instance.yml,
# secret values in the Secret Manager secret sm_security_siem) fill the Secret agentdev-api-siem (roles/api, #71).
security:
  pause_after: 5                    # more than N events in one job pause the agent
  retention_days: 30                # SecurityEvent objects; the API's Postgres table keeps the history
  max_per_agent: 500
# subscription usage limits (#93): default global thresholds in percent until an admin sets them in the web UI
usage:
  five_hour: 80                     # pause new runs at this use of the 5-hour window
  weekly: 90                        # and of the weekly window
# notifications for each user (#347): channels on for the instance (webpush; Bark: #402), the VAPID contact and the
# push services the API may call. Off by default. Users subscribe and mute in the console Settings.
notifications:
  channels: []
  subject: ""                       # mailto:<address> or https://<url>; required with webpush
# MCP platform (#51): project specs with an `mcp:` section; one McpProject each, synced by the operator (#383).
# Paths on the operator machine (the deployment repo). Images and the Service range: roles/platform/defaults.
mcp_projects: []
# Allow-list of MCP server hosts (host or host:port) that project specs may register (docs/security.md R51).
# MCP tool metadata and outputs reach the model, so list trusted servers only. Empty: no server is registered.
mcp_allowed_hosts: []
# Read-only observability MCP tools (#205, docs/admin.md "Give agents the observability tools"): the gateway pod
# obs-mcp holds the backend credential, agents call it through ContextForge only. Off by default. After enabling, add
# {name: obs, url: http://obs-mcp.<platform_ns>.svc.cluster.local:8080/mcp} to a project spec and the host to
# mcp_allowed_hosts. URLs: the instance's Prometheus and Loki (cluster Service range: ContextForge SSRF guard).
obs_mcp:
  enabled: false
  prometheus_url: ""                # for example http://prometheus-server.monitoring.svc.cluster.local
  loki_url: ""                      # for example http://loki-gateway.monitoring.svc.cluster.local
  loki_tenant: ""                   # X-Scope-OrgID, multi-tenant Loki only
  token_secret: ""                  # Secret Manager name of a read-only bearer token for both; empty: none
  cloud_logging_project: ""         # add-on, off when empty: the Cloud Logging tool reads this project
  cloud_logging_gsa: ""             # Google service account with roles/logging.viewer only (Workload Identity)
  max_output: 16384                 # bytes of output per call
  rate_per_min: 30                  # calls per minute per tool, all agents together
  rate_burst: 10
approvals:                          # #67: agents ask a project member on the forge (docs/security-model.md)
  enabled: true                     # default on GKE (the API is expected there); needs api.oidc_issuer (#115),
                                    # deploy.yml checks it. kind keeps it false (kind.yml, kind.vars.yml): no API by default
  timeout_minutes: 30               # no decision in this time: denied (expired)
  retention_days: 90                # Approval objects; decisions stay in the audit log
rollout:                            # #174: upgrades while agents work (docs/admin.md, Upgrade an instance)
  grace_seconds: 300                # on stop, time for the loop to save work in progress (30..3600)
  drain_max_minutes: 60             # an outdated agent pod waits at most this long for its running jobs
# deterministic executors (#69): namespace, poll and retention; the executors themselves come from the deployment
exec_ns: agentdev-executors
executor_poll_seconds: 60
executor_retention_days: 30
executor_apply_start_minutes: 30   # an allowed apply starts at most this long after the decision, else nothing applies
executors: []   # [{name, environment, repo, path, image (by digest), plan: [argv], apply: [argv], plan_gsa, apply_gsa, egress_hosts}]
# Executor egress (#135). Executor Jobs reach the outside only through the executor egress proxy, and it only these
# hosts plus the forge's git host and each executor's egress_hosts (Squid dstdomain: a leading dot = the domain and
# its subdomains). Cloud APIs belong to the executor that needs them, for example
# egress_hosts: [oauth2.googleapis.com, storage.googleapis.com, cloudresourcemanager.googleapis.com].
executor_egress_hosts: [registry.terraform.io, releases.hashicorp.com]
# Management API (#104), optional: deployed only when api.oidc_issuer is set. Keys: oidc_issuer (https, required),
# oidc_discovery_url, oidc_audience (agentdev), forge_url, db_retention_days (365). Defaults: roles/api/defaults.
api: {}
# authentik on GKE (#114): deployed by the role authentik when authentik.enabled is true; the default is on when
# ingress.auth_host (the public login host) is set. Then api.oidc_issuer and api.oidc_discovery_url default to
# authentik (an explicit api.oidc_issuer still wins, for another OIDC provider).
authentik_enabled: "{{ (authentik | default({})).enabled | default(((ingress | default({})).auth_host | default('')) | length > 0) | bool }}"
authentik_default_issuer: >-
  {{ ('https://' ~ ingress.auth_host ~ '/application/o/agentdev/') if authentik_enabled | bool and
     ((ingress | default({})).auth_host | default('')) | length > 0 else '' }}
authentik_default_discovery_url: >-
  {{ ('http://authentik-server.' ~ platform_ns ~ '.svc.cluster.local/application/o/agentdev/')
     if authentik_default_issuer | length > 0 else '' }}
# the issuer the playbook uses (api role, approvals check, ingress UI route)
api_effective_issuer: "{{ api.oidc_issuer | default(authentik_default_issuer) }}"
# ESO template snippets (#381) for the ExternalSecret specs (templates/externalsecrets*.j2). !unsafe: Ansible passes
# them to the cluster as written. eso.<x> is "{{ .<x> }}", the value of the data key <x> of the ExternalSecret.
eso: !unsafe
  webhook: "{{ .webhook }}"
  register: "{{ .register }}"
  wake: "{{ .wake }}"
  forge: "{{ .forge }}"
  appkey: "{{ .appkey }}"
  key: "{{ .key }}"
  token: "{{ .token }}"
  password: "{{ .password }}"
  forge_auth: '^Basic {{ printf "forge:%s" .password | b64enc }}$'
  setup_auth: '^Basic {{ printf "setup:%s" .password | b64enc }}$'
  admin: "{{ .admin }}"
  cf: "{{ .cf }}"
  agentdev: "{{ .agentdev }}"
  authentik: "{{ .authentik }}"
  jwt: "{{ .jwt }}"
  enc: "{{ .enc }}"
  user: "{{ .user }}"
  basic: "{{ .basic }}"
  pw: "{{ .pw }}"
  # KEY=VALUE lines of .raw as Secret keys (empty values skipped)
  env_lines: "{{- range $l := splitList \"\\n\" .raw }}{{- $kv := splitn \"=\" 2 (trim $l) }}{{- if and (ne $kv._0 \"\") (ne (default \"\" $kv._1) \"\") }}{{ $kv._0 }}: {{ $kv._1 | toJson }}\n{{ end }}{{- end }}"  # noqa: jinja[invalid] yaml[line-length]
  # only the two recognised Claude keys (#212), plus CREDENTIAL_FORMAT ok|invalid: the Claude proxy refuses an invalid
  # claude-shared at start and reports every invalid one (images/credproxy/credcheck.go)
  claude_lines: "{{- $ok := false }}{{- range $l := splitList \"\\n\" .raw }}{{- $kv := splitn \"=\" 2 (trim $l) }}{{- if and (has $kv._0 (list \"CLAUDE_CODE_OAUTH_TOKEN\" \"ANTHROPIC_API_KEY\")) (ne (trim (default \"\" $kv._1)) \"\") }}{{- $ok = true }}{{ $kv._0 }}: {{ trim $kv._1 | toJson }}\n{{ end }}{{- end }}CREDENTIAL_FORMAT: {{ if $ok }}ok{{ else }}invalid{{ end }}\n"  # noqa: jinja[invalid] yaml[line-length]
