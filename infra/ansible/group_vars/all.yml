# Generic defaults for installing agentdev onto a GKE cluster from infra/terraform.
# Instance values (project, zone, reviewer, agents, image tag) are NOT set here: the deployment repository
# provides them (see examples/deployment/gcp-gke and example.vars.yml). The playbook stops if one is missing.
# Never put secret values in vars files.

cluster_name: agentdev
kube_context: "gke_{{ gcp_project }}_{{ gcp_zone }}_{{ cluster_name }}"
agents_ns: coding-agents
platform_ns: agentdev-platform

# Published images (#28). Deployments pin image_tag to a release (vX.Y.Z, strict SemVer).
image_registry: ghcr.io/valentinalexeev
worker_image: "{{ image_registry }}/agentdev-worker:{{ image_tag }}"
forge_image: "{{ image_registry }}/agentdev-forge:{{ image_tag }}"   # agent pod sidecar, holds the forge token (#64)
router_image: "{{ image_registry }}/agentdev-router:{{ image_tag }}"
operator_image: "{{ image_registry }}/agentdev-operator:{{ image_tag }}"

forge_kind: github
forge_url: https://api.github.com
poll_seconds: 60                    # webhooks wake agents; polling is the fallback
max_concurrent: 2                   # items per agent in parallel (#20); per-agent override: agents[].max_concurrent
scale_to_zero: false                # stop idle agents, start on events (#35); per agent: agents[].scale_to_zero
idle_seconds: 900                   # cluster-wide (the operator's); per-agent idle time is not in the Agent spec yet
botboard_url: ""                    # agents report work to botboard (#26), e.g. http://botboard.<tailnet>; empty = off

# Secret Manager names (containers created by Terraform; values added by the owner or the UI, #12)
sm_claude_shared: claude-shared
sm_router_register_token: router-register-token
sm_forge_webhook_secret: github-app-webhook-secret
sm_security_siem: security-siem          # optional: SIEM output secrets as KEY=VALUE lines (#70, #71)

# Required from the deployment (no defaults on purpose):
#   gcp_project, gcp_zone, image_tag, reviewer,
#   agents: [{name, user, repos}]   per agent, Secret Manager holds agent-<name>-forge-token
#                                   and optionally agent-<name>-claude
# security events (#70): auto-pause and SecurityEvent retention (operator). Webhook output settings
# (security.siem.{webhook_url, syslog_addr, syslog_server_name, otlp_url, otlp_server_name} in instance.yml,
# secret values in the Secret Manager secret sm_security_siem) fill the Secret agentdev-api-siem (#71).
security:
  pause_after: 5                    # more than N events in one job pause the agent
  retention_days: 30                # SecurityEvent objects; the API's Postgres table keeps the history
  max_per_agent: 500
# MCP platform (#51): project specs with an `mcp:` section, synced by scripts/mcp-sync.sh after ContextForge is up.
# Paths on the operator machine (the deployment repo). Images and the Service range: roles/platform/defaults.
mcp_projects: []
# Allow-list of MCP server hosts (host or host:port) that project specs may register (docs/security.md R46).
# MCP tool metadata and outputs reach the model, so list trusted servers only. Empty: no server is registered.
mcp_allowed_hosts: []
