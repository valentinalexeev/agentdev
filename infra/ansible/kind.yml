---
# Local evaluation on kind (#106): the Ansible rollout that replaces the numbered shell steps, one step at a time.
# GKE uses deploy.yml (cluster from infra/terraform); kind uses this playbook (cluster from kind). Both use the same
# roles and manifests for the steps that are ported.
#
#   cd infra/ansible
#   ansible-playbook kind.yml --tags cluster           # was ./run.sh 01
#   ansible-playbook kind.yml --tags sandbox           # was ./run.sh 02
#   ansible-playbook kind.yml --tags sandbox-test      # was ./run.sh 03
#   ansible-playbook kind.yml --tags forge             # was ./run.sh 05
#   ansible-playbook kind.yml --tags botboard          # was ./run.sh 07 (optional)
#   ansible-playbook kind.yml --tags mcp               # was ./run.sh 08
#
# Ported steps (tag: old run.sh step): cluster: 01, sandbox: 02, sandbox-test: 03, forge: 05, botboard: 07, mcp: 08.
# New on kind only through Ansible: registry-cache (#203; REGISTRY_PROXY in config.env, run.sh 06 calls it).
# The other run.sh steps are still shell scripts. ./run.sh calls this playbook for the ported steps.
- name: Deploy agentdev to kind
  hosts: localhost
  gather_facts: false
  vars:
    kind_cluster_name: agentdev
    # shared with deploy.yml's roles (group_vars/all.yml is GKE-only); config.env values come in with -e (08-mcp.sh)
    repo_root: "{{ playbook_dir }}/../.."
    kube_context: kind-{{ kind_cluster_name }}
    agents_ns: coding-agents
    platform_ns: agentdev-platform
    operator_image: agentdev-operator:dev
    mcp_projects: []
    mcp_allowed_hosts: []
    obs_mcp: {enabled: false}
  tasks:
    - name: Kind cluster with gVisor (was 01-cluster.sh)
      ansible.builtin.include_role:
        name: kind_cluster
        apply: {tags: [cluster]}
      tags: [cluster]

    - name: Agent-sandbox, agent image, template and warm pool (was 02-agent-sandbox.sh)
      ansible.builtin.include_role:
        name: agent_sandbox
        apply: {tags: [sandbox]}
      vars:
        agent_sandbox_context: kind-{{ kind_cluster_name }}
        agent_sandbox_cluster_name: "{{ kind_cluster_name }}"
      tags: [sandbox]

    - name: Checks of the warm pool, suspend and resume (was 03-test-sandbox.sh)
      ansible.builtin.include_role:
        name: sandbox_test
        apply: {tags: [sandbox-test]}
      vars:
        sandbox_test_context: kind-{{ kind_cluster_name }}
      tags: [sandbox-test]

    - name: Gitea forge, owner and agent accounts, seeded repo, branch protection (was 05-forge.sh)
      ansible.builtin.include_role:
        name: gitea_forge
        apply: {tags: [forge]}
      vars:
        gitea_forge_context: kind-{{ kind_cluster_name }}
      tags: [forge]

    # optional (#26): not in the default run. Agents get BOTBOARD_URL from ./run.sh 06 when the namespace exists.
    - name: Botboard dashboard (was 07-botboard.sh)
      ansible.builtin.include_role:
        name: botboard
        apply: {tags: [botboard]}
      vars:
        botboard_context: kind-{{ kind_cluster_name }}
      tags: [botboard, never]
    - name: Registry cache for npm, PyPI and Go (#203); registry_proxy off removes it
      ansible.builtin.include_role:
        name: registry_cache
        apply: {tags: [registry-cache]}
      vars:
        registry_cache_context: kind-{{ kind_cluster_name }}
        registry_cache_ns: coding-agents
        registry_cache_fqdn_policy: false
      tags: [registry-cache]

    # Postgres always; ContextForge and mcp-sync only with mcp_projects (#172); obs-mcp with obs_mcp.enabled (#205).
    # The same role as deploy.yml on GKE, with secrets in .secrets/platform instead of Secret Manager.
    - name: Postgres, ContextForge MCP gateway, obs-mcp, mcp-sync (was 08-mcp.sh)
      ansible.builtin.include_role:
        name: platform
        apply: {tags: [mcp]}
      vars:
        platform_service_cidr: 10.96.0.0/16
        platform_secret_source: files
        platform_kind_cluster: "{{ kind_cluster_name }}"
      tags: [mcp]
