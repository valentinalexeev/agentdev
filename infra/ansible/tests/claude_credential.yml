# Check (#212): the playbook refuses a Claude credential secret without a recognised key (bare token, empty, other
# key) and accepts CLAUDE_CODE_OAUTH_TOKEN=... or ANTHROPIC_API_KEY=... Runs the same task file as preflight.yml (#314).
# Run: ansible-playbook infra/ansible/tests/claude_credential.yml
- name: Claude credential format (#212)
  hosts: localhost
  gather_facts: false
  vars:
    claude_cred_name: claude-shared
    preflight: "{{ lookup('ansible.builtin.file', playbook_dir + '/../preflight.yml') }}"
    deploy: "{{ lookup('ansible.builtin.file', playbook_dir + '/../deploy.yml') }}"
  tasks:
    - name: Accepted values
      ansible.builtin.include_tasks: ../tasks/claude_credential.yml
      loop:
        - "CLAUDE_CODE_OAUTH_TOKEN=sk-ant-oat01-test"
        - "ANTHROPIC_API_KEY=sk-ant-api03-test\n"
        - "# comment\r\nOTHER=1\r\nANTHROPIC_API_KEY=k\r\n"
      loop_control: {loop_var: claude_cred_text}

    - name: Refused values
      ansible.builtin.include_tasks: includes/claude_credential_refused.yml
      loop:
        - "sk-ant-oat01-baretoken"
        - ""
        - "\n\n"
        - "CLAUDE_CODE_OAUTH_TOKEN=  "
        - "OTHER_KEY=value"
        - "claude_code_oauth_token=lowercase"
      loop_control: {loop_var: bad_cred}

    - name: Preflight runs the check for claude-shared and for each agent-<name>-claude, deploy.yml imports it
      ansible.builtin.assert:
        that:
          - preflight is search('claude_cred_name. "\{\{ sm_claude_shared \}\}"')
          - preflight is search('claude_cred_name. "agent-\{\{ item.name \}\}-claude"')
          - deploy is search('import_playbook. preflight.yml')
        quiet: true
