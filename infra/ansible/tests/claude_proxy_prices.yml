# Render check (#196): the playbook renders manifests/claude-proxy.yaml.tmpl with the budget in cost units and the
# prices ConfigMap (values as strings), and the assert of deploy.yml refuses the old token variable and bad prices.
# Run: ansible-playbook infra/ansible/tests/claude_proxy_prices.yml
- name: Claude proxy units and prices (#196)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    agents_ns: coding-agents
    platform_ns: agentdev-platform
    claude_budget_units: 2000000
    claude_prices: {w_cr: 0.1, model.claude-opus: 5, usd_per_million_units: 3}
    claude_job_budget_units: 900000
    claude_job_approval_units: 300000
    claude_job_approval_step_units: 200000
  tasks:
    - name: Render as deploy.yml does
      ansible.builtin.set_fact:
        docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=vars_proxy) | from_yaml_all | list }}"
      vars:
        vars_proxy:
          src: "{{ repo_root }}/manifests/claude-proxy.yaml.tmpl"
          values:
            AGENTS_NS: "{{ agents_ns }}"
            PLATFORM_NS: "{{ platform_ns }}"
            CLAUDE_PROXY_IMAGE: img
            IMAGE_PULL_POLICY: IfNotPresent
            CLAUDE_BUDGET_UNITS: "{{ claude_budget_units | int }}"
            CLAUDE_PRICES_DATA: "{{ dict(claude_prices.keys() | zip(claude_prices.values() | map('string'))) | to_json }}"
            TELEMETRY_OTLP_URL: ""
            TELEMETRY_INSTANCE: agentdev
            TELEMETRY_SCRAPER_NS: gmp-system
            TELEMETRY_SCRAPER_SELECTOR: '{"app.kubernetes.io/name": "collector"}'
            CLAUDE_SECRET_SOURCES: "[]"
            CLAUDE_PROXY_AUTH: both                                    # #352
            CLAUDE_JOB_BUDGET_UNITS: "{{ claude_job_budget_units | int }}"                 # #196
            CLAUDE_JOB_APPROVAL_UNITS: "{{ claude_job_approval_units | int }}"             # #310
            CLAUDE_JOB_APPROVAL_STEP_UNITS: "{{ claude_job_approval_step_units | int }}"   # #310
            KUBE_API_EGRESS: '[{"ipBlock": {"cidr": "10.0.0.1/32"}}]'  # #352
          replace: []

    - name: Units and prices reach the cluster objects
      vars:
        np: "{{ docs | selectattr('kind', 'equalto', 'NetworkPolicy') | selectattr('metadata.name', 'equalto', 'claude-proxy') | first }}"
        cm: "{{ docs | selectattr('kind', 'equalto', 'ConfigMap') | selectattr('metadata.name', 'equalto', 'claude-proxy-prices') | first }}"
        role: "{{ docs | selectattr('kind', 'equalto', 'Role') | selectattr('metadata.name', 'equalto', 'agentdev-claude-proxy-approvals') | first }}"
        rb: "{{ docs | selectattr('kind', 'equalto', 'RoleBinding') | selectattr('metadata.name', 'equalto', 'agentdev-claude-proxy-approvals') | first }}"
        env: "{{ (docs | selectattr('kind', 'equalto', 'Deployment') | first).spec.template.spec.containers[0].env
                 | items2dict(key_name='name', value_name='value') }}"
      ansible.builtin.assert:
        that:
          - cm.data['w_cr'] == '0.1'
          - cm.data['model.claude-opus'] == '5'
          - cm.data['usd_per_million_units'] == '3'
          - env.CLAUDE_BUDGET_UNITS == '2000000'
          - env.CLAUDE_JOB_BUDGET_UNITS == '900000'
          - env.CLAUDE_JOB_APPROVAL_UNITS == '300000'
          - env.CLAUDE_JOB_APPROVAL_STEP_UNITS == '200000'
          - (role.rules | length) == 1 and role.rules[0].resources == ['approvals'] and role.rules[0].verbs == ['get', 'list']
          - rb.subjects[0].name == 'claude-proxy' and rb.roleRef.name == 'agentdev-claude-proxy-approvals'
          - env.PRICES_DIR == '/etc/claude-proxy/prices'
          - "'CLAUDE_BUDGET_TOKENS' not in env"
          - np.spec.ingress[1].from[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'collector'
          - np.spec.ingress[1].from[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'gmp-system'

    - name: The deploy.yml assert accepts these values and refuses bad ones
      ansible.builtin.assert:
        that:
          - >-
            claude_prices.keys()
            | reject('match', '^(w_in|w_cw5|w_cw1h|w_cr|w_out|usd_per_million_units|model\\.[a-z0-9][a-z0-9.-]{0,62})$')
            | list | length == 0
          - claude_prices.values() | map('string') | reject('match', '^[0-9]+(\\.[0-9]{1,6})?$') | list | length == 0
          - bad.keys() | reject('match', '^(w_in|w_cw5|w_cw1h|w_cr|w_out|usd_per_million_units|model\\.[a-z0-9][a-z0-9.-]{0,62})$') | list | length == 1
          - bad.values() | map('string') | reject('match', '^[0-9]+(\\.[0-9]{1,6})?$') | list | length == 2
      vars:
        bad: {"$(id)": 1, w_out: "1e9", w_in: "-1"}

    - name: The deploy.yml assert refuses a soft job limit at or above the hard one (#310)
      ansible.builtin.assert:
        that:
          - ((c.soft | int) == 0 or (c.hard | int) == 0 or (c.soft | int) < (c.hard | int)) != c.refused
      loop:
        - {soft: 300, hard: 900, refused: false}
        - {soft: 0, hard: 900, refused: false}
        - {soft: 300, hard: 0, refused: false}
        - {soft: 900, hard: 900, refused: true}
        - {soft: 901, hard: 900, refused: true}
      loop_control: {loop_var: c}
