---
# Project secrets on GKE (#202 part 4): ansible-playbook infra/ansible/tests/project_secrets_render.yml (no cluster).
# Renders the example instance with external secrets and project_secrets and checks the store, the broker, the
# operator and API settings, and that nothing renders when project_secrets is absent.
- name: Project secrets render
  hosts: localhost
  gather_facts: false
  vars:
    out: "{{ lookup('env', 'RENDER_TEST_DIR') | default('/tmp/agentdev-render-test', true) }}/project-secrets"
    ps_on: >-
      {"external_secrets": {"mode": "external"}, "project_secrets": {"reader_gsa": "agentdev-sm-projsecrets@p.iam.gserviceaccount.com",
       "api_gsa": "agentdev-api-secrets@p.iam.gserviceaccount.com"}}
  tasks:
    - name: Remove old output
      ansible.builtin.file: {path: "{{ out }}", state: absent}

    - name: Render with project secrets
      ansible.builtin.command:
        argv: [ansible-playbook, "{{ playbook_dir }}/../render.yml", -e, "@{{ playbook_dir }}/files/render_instance.yml",
               -e, "render_dir={{ out }}/enabled", -e, "{{ ps_on }}"]
      changed_when: false

    - name: Render without project secrets
      ansible.builtin.command:
        argv: [ansible-playbook, "{{ playbook_dir }}/../render.yml", -e, "@{{ playbook_dir }}/files/render_instance.yml",
               -e, "render_dir={{ out }}/disabled", -e, '{"external_secrets": {"mode": "external"}}']
      changed_when: false

    - name: Read the output
      ansible.builtin.set_fact:
        docs: >-
          {{ docs | default({}) | combine({item: query('ansible.builtin.file', *query('ansible.builtin.fileglob', out ~ '/' ~ item ~ '/*.yaml'))
             | map('from_yaml_all') | map('list') | flatten | select | list}) }}
      loop: [enabled, disabled]

    - name: Store, broker, operator and API settings
      vars:
        pon: "{{ docs['enabled'] }}"
        poff: "{{ docs['disabled'] }}"
        store: "{{ pon | selectattr('kind', 'equalto', 'SecretStore') | selectattr('metadata.name', 'equalto', 'agentdev-secrets') | list }}"
        reader: "{{ pon | selectattr('kind', 'equalto', 'ServiceAccount') | selectattr('metadata.name', 'equalto', 'agentdev-secrets-reader') | first }}"
        broker: "{{ pon | selectattr('kind', 'equalto', 'Deployment') | selectattr('metadata.name', 'equalto', 'credential-broker') | list }}"
        op_env: >-
          {{ (pon | selectattr('kind', 'equalto', 'Deployment') | selectattr('metadata.name', 'equalto', 'agentdev-operator') | first)
             .spec.template.spec.containers[0].env | items2dict(key_name='name', value_name='value') }}
        api_sa: "{{ pon | selectattr('kind', 'equalto', 'ServiceAccount') | selectattr('metadata.name', 'equalto', 'agentdev-api') | list }}"
      ansible.builtin.assert:
        that:
          - store | length == 1
          - reader.metadata.annotations['iam.gke.io/gcp-service-account'] == 'agentdev-sm-projsecrets@p.iam.gserviceaccount.com'
          - >-
            pon | selectattr('kind', 'equalto', 'ValidatingAdmissionPolicy')
            | selectattr('metadata.name', 'equalto', 'agentdev-secrets-reader-no-pods') | list | length == 1
          - broker | length == 1
          - broker[0].spec.template.spec.serviceAccountName == 'credential-broker'
          - op_env.SECRETS_STORE == 'agentdev-secrets'
          - op_env.CREDENTIAL_BROKER_URL is search('^http://credential-broker\.')
          - api_sa | length == 0 or api_sa[0].metadata.annotations['iam.gke.io/gcp-service-account'] == 'agentdev-api-secrets@p.iam.gserviceaccount.com'
          - pon | selectattr('kind', 'equalto', 'Secret') | list | length == 0
          - poff | selectattr('metadata.name', 'equalto', 'credential-broker') | list | length == 0
          - poff | selectattr('kind', 'equalto', 'SecretStore') | selectattr('metadata.name', 'equalto', 'agentdev-secrets') | list | length == 0
