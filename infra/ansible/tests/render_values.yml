# Render check (#121): templates/render.j2 fails on a ${VAR} that the playbook does not set (kind/GKE drift), and the
# role api sets every value of manifests/api.yaml.tmpl and manifests/ui.yaml.tmpl.
# Run: ansible-playbook infra/ansible/tests/render_values.yml
- name: Render guard and API/UI values (#121)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    image_registry: ghcr.io/example
    image_tag: v0.0.0
    platform_ns: agentdev-platform
    agents_ns: coding-agents
    forge_url: https://api.github.com
    sm_security_siem: security-siem
    platform_sm_prefix: platform-
    approvals: {enabled: true}
    usage: {five_hour: 70, weekly: 85}
    api: {oidc_issuer: "https://auth.example.com/application/o/agentdev/", approval_deny_accounts: [bot-a, bot-b], max_agents: 2, chat: {enabled: true}}
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars: ../roles/api/defaults/main.yml

    - name: Render the API with the role's values (same as roles/api/tasks/main.yml)
      ansible.builtin.set_fact:
        api_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=api_render) | from_yaml_all | list }}"
      vars:
        api_render:
          src: "{{ repo_root }}/manifests/api.yaml.tmpl"
          values:
            PLATFORM_NS: "{{ platform_ns }}"
            AGENTS_NS: "{{ agents_ns }}"
            API_IMAGE: "{{ api_image }}"
            OIDC_ISSUER: "{{ api_oidc_issuer }}"
            OIDC_DISCOVERY_URL: "{{ api_oidc_discovery_url }}"
            OIDC_AUDIENCE: "{{ api_oidc_audience }}"
            FORGE_URL: "{{ api_forge_url }}"
            GITHUB_URL: "{{ api_github_url }}"
            APPROVALS: "{{ approvals.enabled | default(true) | string | lower }}"
            APPROVAL_DENY_ACCOUNTS: "{{ api_approval_deny_accounts | join(',') }}"
            USAGE_FIVE_HOUR: "{{ usage.five_hour | default(80) }}"
            USAGE_WEEKLY: "{{ usage.weekly | default(90) }}"
            MAX_AGENTS: "{{ api_max_agents }}"
            MAX_AGENTS_PER_USER: "{{ api_max_agents_per_user }}"
            CHAT_SESSIONS: "{{ api_chat | string | lower }}"
            CHAT_WORKER_IMAGE: "{{ api_chat_worker_image }}"
            CHAT_IMAGE_PULL_POLICY: "{{ api_chat_image_pull_policy }}"
            CHAT_FORGE_URL: "{{ api_chat_forge_url }}"
            CHAT_IDLE_SECONDS: "{{ api_chat_idle_seconds }}"
            CHAT_RETENTION_DAYS: "{{ api_chat_retention_days }}"
            CHAT_MAX_SESSIONS: "{{ api_chat_max_sessions }}"
            CHAT_MAX_SESSIONS_PER_USER: "{{ api_chat_max_sessions_per_user }}"
          replace: []

    - name: The API container gets the values
      vars:
        env: "{{ (api_docs | selectattr('kind', 'equalto', 'Deployment') | first).spec.template.spec.containers[0].env
                 | selectattr('value', 'defined') | items2dict(key_name='name', value_name='value') }}"
      ansible.builtin.assert:
        that:
          - env.APPROVALS == 'true'
          - env.APPROVAL_DENY_ACCOUNTS == 'bot-a,bot-b'
          - env.USAGE_FIVE_HOUR == '70'
          - env.USAGE_WEEKLY == '85'
          - env.MAX_AGENTS == '2'   # #27
          - env.MAX_AGENTS_PER_USER == '0'
          - env.CHAT_SESSIONS == 'true'   # #346
          - env.CHAT_IDLE_SECONDS == '1800'
          - env.CHAT_RETENTION_DAYS == '30'
          - env.CHAT_WORKER_IMAGE == 'ghcr.io/example/agentdev-worker:v0.0.0'
          - >-
            (api_docs | selectattr('kind', 'equalto', 'ValidatingAdmissionPolicy') | first).spec.validations
            | to_json is search('ghcr.io/example/agentdev-worker:v0.0.0')
          - (api_docs | selectattr('kind', 'equalto', 'NetworkPolicy') | selectattr('metadata.name', 'equalto', 'chat-session-server') | list | length) == 1
          - (api_docs | to_json) is not search('\$\{')

    - name: A missing value fails the render and names the placeholder
      block:
        - name: Render the UI without OIDC_ISSUER
          ansible.builtin.set_fact:
            ui_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=ui_render) }}"
          vars:
            ui_render:
              src: "{{ repo_root }}/manifests/ui.yaml.tmpl"
              values: {PLATFORM_NS: "{{ platform_ns }}", UI_IMAGE: img}
              replace: []
        - name: Not reached
          ansible.builtin.fail: {msg: "render.j2 accepted a template with an unset placeholder"}
      rescue:
        - name: The error names the placeholder
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('no value for \$\{OIDC_ISSUER\}')
              - ansible_failed_result.msg is not search('render.j2 accepted')

    # UI OIDC client and scopes (#323): defaults keep authentik as it is; an override reaches the UI and the API audience
    - name: Render the UI with the role defaults
      ansible.builtin.set_fact:
        ui_default_env: "{{ (lookup('ansible.builtin.template', '../templates/render.j2', template_vars=ui_render)
                             | from_yaml_all | selectattr('kind', 'equalto', 'Deployment') | first).spec.template.spec.containers[0].env
                             | selectattr('value', 'defined') | items2dict(key_name='name', value_name='value') }}"
      vars:
        ui_render: &ui_render
          src: "{{ repo_root }}/manifests/ui.yaml.tmpl"
          values:
            PLATFORM_NS: "{{ platform_ns }}"
            UI_IMAGE: img
            OIDC_ISSUER: "{{ api_oidc_issuer }}"
            OIDC_CLIENT_ID: "{{ api_oidc_client_id }}"
            OIDC_SCOPES: "{{ api_ui_oidc_scopes }}"
          replace: []

    - name: The defaults are the authentik values
      ansible.builtin.assert:
        that:
          - ui_default_env.OIDC_CLIENT_ID == 'agentdev'
          - ui_default_env.OIDC_SCOPES == 'openid profile email forge'
          - api_oidc_audience == 'agentdev'

    - name: Render the UI with an override (Pocket ID shape)
      ansible.builtin.set_fact:
        ui_override_env: "{{ (lookup('ansible.builtin.template', '../templates/render.j2', template_vars=ui_render)
                              | from_yaml_all | selectattr('kind', 'equalto', 'Deployment') | first).spec.template.spec.containers[0].env
                              | selectattr('value', 'defined') | items2dict(key_name='name', value_name='value') }}"
        override_audience: "{{ api_oidc_audience }}"
      vars:
        api: {oidc_issuer: "https://id.example.com", oidc_client_id: my-client, ui_oidc_scopes: "openid profile email groups forge"}
        ui_render: *ui_render

    - name: The override reaches the UI, and the API audience follows the client id
      ansible.builtin.assert:
        that:
          - ui_override_env.OIDC_CLIENT_ID == 'my-client'
          - ui_override_env.OIDC_SCOPES == 'openid profile email groups forge'
          - override_audience == 'my-client'
