# kind secret source of the platform role (#106, was 08-mcp.sh): files in platform_secrets_dir are generated once and
# kept; jwt and enc are the two files jwt + jwt2 and enc + enc2 joined, as 08-mcp.sh passed them.
# Run: ansible-playbook infra/ansible/tests/platform_secret_files.yml
- name: Platform secrets from files (#106)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars: ../roles/platform/defaults/main.yml

    - name: Temporary secrets directory
      ansible.builtin.tempfile: {state: directory}
      register: tmp

    - name: Pre-existing pg-admin
      ansible.builtin.shell: mkdir -p {{ tmp.path }}/s && printf 'keepme\n' > {{ tmp.path }}/s/pg-admin
      changed_when: false

    - name: First run
      ansible.builtin.include_tasks: ../roles/platform/tasks/secrets_files.yml
      vars: {platform_secrets_dir: "{{ tmp.path }}/s", platform_obs_mcp_enabled: false}

    - name: Read the generated files
      ansible.builtin.command: cat {{ tmp.path }}/s/jwt {{ tmp.path }}/s/jwt2 {{ tmp.path }}/s/cf-admin
      register: first
      changed_when: false

    - name: Files and fact
      ansible.builtin.assert:
        that:
          - platform_secret['pg-admin'] == 'keepme'
          - platform_secret['jwt'] == first.stdout_lines[0] ~ first.stdout_lines[1]
          - platform_secret['jwt'] | length == 96
          - platform_secret['enc'] | length == 96
          - platform_secret['cf-admin'] == first.stdout_lines[2]
          - platform_secret_keys | difference(platform_secret.keys() | list) | length == 0
          - platform_files_created.results | selectattr('changed') | list | length == platform_file_keys | length - 1

    - name: Mode of the directory and a file
      ansible.builtin.stat: {path: "{{ item }}"}
      loop: ["{{ tmp.path }}/s", "{{ tmp.path }}/s/jwt"]
      register: modes

    - name: Modes 0700 and 0600
      ansible.builtin.assert:
        that: modes.results | map(attribute='stat.mode') | list == ['0700', '0600']

    - name: Second run
      ansible.builtin.include_tasks: ../roles/platform/tasks/secrets_files.yml
      vars: {platform_secrets_dir: "{{ tmp.path }}/s", platform_obs_mcp_enabled: false}

    - name: Nothing regenerated
      ansible.builtin.assert:
        that:
          - platform_files_created.results | selectattr('changed') | list | length == 0
          - platform_secret['cf-admin'] == first.stdout_lines[2]

    - name: Remove the directory
      ansible.builtin.file: {path: "{{ tmp.path }}", state: absent}
