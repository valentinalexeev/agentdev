# kind secret source of the role api (#106, was 10-api.sh): pg-agentdev-api is generated once (hex) and kept,
# siem-webhook lines and the GitHub App files are read when present. No cluster.
# Run: ansible-playbook infra/ansible/tests/api_secret_files.yml
- name: API secrets from files (#106)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars: ../roles/api/defaults/main.yml

    - name: Temporary secrets directory
      ansible.builtin.tempfile: {state: directory}
      register: tmp

    - name: First run (no files, gitea)
      ansible.builtin.include_tasks: ../roles/api/tasks/secrets_files.yml
      vars: {api_secrets_dir: "{{ tmp.path }}/p", api_github_app_dir: "{{ tmp.path }}/gh", api_github: false}

    - name: Password made, nothing optional
      ansible.builtin.assert:
        that:
          - api_files_created is changed
          - api_db_password is match('^[0-9a-f]{48}$')
          - api_siem_lines == []
          - api_github_key == ''
          - api_forge_token == ''
        quiet: true

    - name: Keep the first password
      ansible.builtin.set_fact: {first_pw: "{{ api_db_password }}"}

    - name: SIEM and GitHub App files
      ansible.builtin.shell: |
        printf 'SECURITY_WEBHOOK_URL=https://siem.example/x\nSECURITY_WEBHOOK_TOKEN=a=b\n' > {{ tmp.path }}/p/siem-webhook
        mkdir -p {{ tmp.path }}/gh && printf '12345\n' > {{ tmp.path }}/gh/app-id && printf 'PEM\n' > {{ tmp.path }}/gh/private-key.pem
      changed_when: false

    - name: Second run (github)
      ansible.builtin.include_tasks: ../roles/api/tasks/secrets_files.yml
      vars: {api_secrets_dir: "{{ tmp.path }}/p", api_github_app_dir: "{{ tmp.path }}/gh", api_github: true}

    - name: Password kept, optional files read
      ansible.builtin.assert:
        that:
          - api_files_created is not changed
          - api_db_password == first_pw
          - api_siem_lines | length == 2
          - (dict(api_siem_lines | map('split', '=', 1)))['SECURITY_WEBHOOK_TOKEN'] == 'a=b'
          - api_github_app_id == '12345'
          - api_github_key == 'PEM\n'
        quiet: true

    - name: Missing App with github fails
      block:
        - name: Run without the App
          ansible.builtin.include_tasks: ../roles/api/tasks/secrets_files.yml
          vars: {api_secrets_dir: "{{ tmp.path }}/p", api_github_app_dir: "{{ tmp.path }}/none", api_github: true}
        - name: Not reached
          ansible.builtin.fail: {msg: "the role accepted github without the App"}
      rescue:
        - name: The App check stopped the run
          ansible.builtin.assert:
            that: "'register the App first' in ansible_failed_result.msg"
            quiet: true

    - name: Remove the temporary directory
      ansible.builtin.file: {path: "{{ tmp.path }}", state: absent}
