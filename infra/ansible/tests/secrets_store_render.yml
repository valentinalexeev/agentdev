# Render check for the scoped secrets store (#202): every ${VAR} of the store and policy templates gets a value, and
# the policies pin the names the operator and the API use (ps-<n>, agentdev-ps-<n>, store agentdev-secrets).
# Run: ansible-playbook infra/ansible/tests/secrets_store_render.yml
- name: Secrets store templates (#202)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Render the three templates
      ansible.builtin.set_fact:
        policy_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=policy) | from_yaml_all | list }}"
        k8s_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=k8s) | from_yaml_all | list }}"
        gcp_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=gcp) | from_yaml_all | list }}"
      vars:
        policy:
          src: "{{ repo_root }}/manifests/secrets-policy.yaml.tmpl"
          values: {AGENTS_NS: coding-agents, PLATFORM_NS: agentdev-platform, ESO_NS: external-secrets, ESO_SA: eso-controller}
          replace: []
        k8s:
          src: "{{ repo_root }}/manifests/secrets-store-kubernetes.yaml.tmpl"
          values: {AGENTS_NS: coding-agents, SECRETS_VALUES_NS: agentdev-secret-values}
          replace: []
        gcp:
          src: "{{ repo_root }}/manifests/secrets-store-gcp.yaml.tmpl"
          values: {AGENTS_NS: coding-agents, SECRETS_GSA: eso@p.iam.gserviceaccount.com, GCP_PROJECT: p, GKE_LOCATION: europe-west1, GKE_CLUSTER: agentdev}
          replace: []

    - name: Names and stores
      vars:
        es_policy: >-
          {{ policy_docs | selectattr('kind', 'equalto', 'ValidatingAdmissionPolicy')
             | selectattr('metadata.name', 'equalto', 'agentdev-projectsecret-externalsecret') | first }}
        synced_policy: >-
          {{ policy_docs | selectattr('kind', 'equalto', 'ValidatingAdmissionPolicy')
             | selectattr('metadata.name', 'equalto', 'agentdev-projectsecret-synced') | first }}
        store_k8s: "{{ k8s_docs | selectattr('kind', 'equalto', 'SecretStore') | first }}"
        store_gcp: "{{ gcp_docs | selectattr('kind', 'equalto', 'SecretStore') | first }}"
      ansible.builtin.assert:
        that:
          - (policy_docs + k8s_docs + gcp_docs) | to_json is not search('\$\{')
          - policy_docs | selectattr('kind', 'equalto', 'ValidatingAdmissionPolicyBinding') | list | length == 3
          - es_policy | to_json is search("agentdev-ps-")
          - synced_policy.spec.validations[0].expression is search("system:serviceaccount:external-secrets:eso-controller'")
          - store_k8s.metadata.name == 'agentdev-secrets' and store_gcp.metadata.name == 'agentdev-secrets'
          - store_k8s.spec.provider.kubernetes.remoteNamespace == 'agentdev-secret-values'
          - store_gcp.spec.provider.gcpsm.projectID == 'p'

    - name: Render the credential broker (#202 part 2)
      ansible.builtin.set_fact:
        broker_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=broker) | from_yaml_all | list }}"
      vars:
        broker:
          src: "{{ repo_root }}/manifests/credential-broker.yaml.tmpl"
          values: {AGENTS_NS: coding-agents, CLAUDE_PROXY_IMAGE: "ghcr.io/valentinalexeev/agentdev-credproxy:0.0.0", IMAGE_PULL_POLICY: IfNotPresent,
                   CREDENTIAL_BROKER_URL: "http://credential-broker.coding-agents.svc.cluster.local:8080"}
          replace: []

    - name: Broker names the operator relies on
      vars:
        dep: "{{ broker_docs | selectattr('kind', 'equalto', 'Deployment') | first }}"
      ansible.builtin.assert:
        that:
          - broker_docs | to_json is not search('\$\{')
          - dep.metadata.name == 'credential-broker'
          - dep.spec.template.spec.containers[0].name == 'proxy'
          - dep.spec.template.spec.volumes | selectattr('name', 'equalto', 'values') | map(attribute='projected') | first is defined
          - dep.spec.template.spec.automountServiceAccountToken == false
          - (dep.spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'MODE') | first).value == 'broker'
