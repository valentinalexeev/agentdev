# Render check for the platform ExternalSecrets (#381): every spec template renders, the ESO templates reach the
# manifests as written ({{ .x }}, not rendered by Ansible), names and keys match the Secrets deploy.yml wrote before,
# every ExternalSecret uses the store agentdev-platform-secrets of its own namespace, and no platform-* entry is read
# from the agents namespace. Run: ansible-playbook infra/ansible/tests/external_secrets_render.yml
- name: Platform ExternalSecrets (#381)
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    gcp_project: p
    image_tag: v1
    reviewer: r
  tasks:
    - name: Load group_vars/all.yml and the role defaults the templates read
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - ../group_vars/all.yml
        - ../roles/platform/defaults/main.yml
        - ../roles/api/defaults/main.yml

    # instance values after group_vars (include_vars wins over play vars)
    - name: Instance values
      ansible.builtin.set_fact:
        forge_kind: github
        github_app: {app_id: 12345, installation_id: 678}
        agents: [{name: alice, user: alice, repos: o/r, own_claude: true}, {name: bob, user: bob, repos: o/r}]
        executors: [{name: infra}]
        api: {chat: {enabled: true}}
        notifications: {channels: [webpush], subject: "mailto:a@b.c"}
        security: {siem: {webhook_url: "https://siem.example.com/hook"}}
        mcp_projects: [x]
        obs_mcp: {enabled: true, token_secret: obs-token}

    - name: Render the specs of deploy.yml, platform and api
      ansible.builtin.set_fact:
        es_specs: >-
          {{ (lookup('ansible.builtin.template', '../templates/externalsecrets-agents.j2') | from_yaml)
             + (lookup('ansible.builtin.template', '../roles/platform/templates/externalsecrets.j2') | from_yaml)
             + (lookup('ansible.builtin.template', '../roles/api/templates/externalsecrets.j2') | from_yaml) }}

    - name: Render the ExternalSecret manifests
      ansible.builtin.set_fact:
        es_docs: "{{ lookup('ansible.builtin.template', '../templates/externalsecrets.j2') | from_yaml_all | list }}"

    - name: Names, stores, keys and ESO templates
      vars:
        by_name: "{{ dict(es_docs | map(attribute='metadata.name') | zip(es_docs)) }}"
        agents_remote: >-
          {{ es_docs | selectattr('metadata.namespace', 'equalto', 'coding-agents') | map(attribute='spec.data') | flatten
             | map(attribute='remoteRef.key') | list }}
        # the ESO templates as they must reach the cluster (never rendered by Ansible)
        eso_webhook: !unsafe 'github={{ .webhook }}'  # noqa: jinja[invalid]
        eso_register: !unsafe '{{ .register }}'  # noqa: jinja[invalid]
        eso_appkey: !unsafe '{{ .appkey }}'  # noqa: jinja[invalid]
        eso_auth: !unsafe '^Basic {{ printf "forge:%s" .password | b64enc }}$'  # noqa: jinja[invalid]
        eso_init_re: "CREATE ROLE agentdev LOGIN PASSWORD '[{][{] [.]agentdev [}][}]';"
        eso_cfadmin: !unsafe 'Aa1!{{ .admin }}'  # noqa: jinja[invalid]
        siem_re: "^SECURITY_WEBHOOK_URL: \"https://siem[.]example[.]com/hook\"\n"
        expected: [claude-shared, claude-alice, webhook-router, webhook-router-poll, egress-forge-proxy, egress-setup-proxy, claude-proxy-signing,
                   agent-alice, agent-bob, exec-infra-forge, exec-infra-plan, exec-infra-apply, platform-db, contextforge,
                   obs-mcp-token, agentdev-api-db, agentdev-api-forge, agentdev-api-github, agentdev-api-siem,
                   agentdev-api-chat, agentdev-api-vapid]
      ansible.builtin.assert:
        that:
          - es_docs | map(attribute='metadata.name') | sort == expected | sort
          - es_docs | map(attribute='spec.secretStoreRef.name') | unique | list == ['agentdev-platform-secrets']
          - es_docs | map(attribute='spec.secretStoreRef.kind') | unique | list == ['SecretStore']
          - es_docs | map(attribute='spec.target.creationPolicy') | unique | list == ['Owner']
          - es_docs | selectattr('spec.target.name', 'ne', none) | list | length == es_docs | length
          # acceptance 3: the agents namespace never names a platform-* entry
          - agents_remote | select('match', '^platform-') | list == []
          - by_name['webhook-router'].spec.target.template.data.FORGE_SECRETS == eso_webhook
          - by_name['webhook-router'].spec.target.template.data.REGISTER_TOKEN == eso_register
          - by_name['agent-alice'].spec.target.template.data.GITHUB_APP_ID == '12345'
          - by_name['agent-alice'].spec.target.template.data.GITHUB_APP_PRIVATE_KEY == eso_appkey
          - by_name['agent-bob'].spec.data | map(attribute='remoteRef.key') | sort
            == ['agent-bob-wake-token', 'github-app-private-key', 'router-register-token']
          - by_name['egress-forge-proxy'].spec.target.template.data.auth == eso_auth
          - by_name['claude-shared'].spec.target.template.templateFrom[0].literal is search('CLAUDE_CODE_OAUTH_TOKEN')
          - by_name['claude-alice'].spec.target.deletionPolicy == 'Delete'
          - "'claude-bob' not in by_name"
          - by_name['platform-db'].spec.target.template.data['init.sql'] is search(eso_init_re)
          - by_name['platform-db'].metadata.namespace == 'agentdev-platform'
          - by_name['contextforge'].spec.target.template.data.PLATFORM_ADMIN_PASSWORD == eso_cfadmin
          - by_name['agentdev-api-siem'].spec.target.template.templateFrom[0].literal is search(siem_re)
          - by_name['exec-infra-plan'].metadata.namespace == 'agentdev-executors'
        fail_msg: "ExternalSecrets do not match the Secrets of 1.1 (names, keys, stores)"
        quiet: true

    - name: The platform store template renders
      ansible.builtin.set_fact:
        store_docs: "{{ lookup('ansible.builtin.template', '../templates/render.j2', template_vars=store) | from_yaml_all | list }}"
      vars:
        store:
          src: "{{ repo_root }}/manifests/secrets-store-platform-gcp.yaml.tmpl"
          values: {NS: coding-agents, STORE: agentdev-platform-secrets, GSA: agentdev-sm-agents@p.iam.gserviceaccount.com,
                   GCP_PROJECT: p, GKE_LOCATION: z, GKE_CLUSTER: agentdev}
          replace: []

    - name: The store's service account is bound to its own Google account
      ansible.builtin.assert:
        that:
          - store_docs[0].metadata.annotations['iam.gke.io/gcp-service-account'] == 'agentdev-sm-agents@p.iam.gserviceaccount.com'
          - store_docs[1].spec.provider.gcpsm.auth.workloadIdentity.serviceAccountRef.name == 'agentdev-platform-secrets'
        quiet: true
