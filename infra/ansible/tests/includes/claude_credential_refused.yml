---
# One refused Claude credential for tests/claude_credential.yml (included per case, so each one is checked).
- name: Refuse a credential without a recognised key
  block:
    - name: Try it
      ansible.builtin.include_tasks: ../../tasks/claude_credential.yml
      vars:
        claude_cred_text: "{{ bad_cred }}"
    - name: Not reached
      ansible.builtin.fail:
        msg: a Claude credential without a recognised key was accepted
  rescue:
    - name: Refused as expected, the message names the format and not the value
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Check the Claude credential format'
          - "'CLAUDE_CODE_OAUTH_TOKEN=<token>' in ansible_failed_result.msg"
          - bad_cred | length == 0 or bad_cred not in ansible_failed_result.msg
        quiet: true
