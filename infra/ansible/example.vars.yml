# Example instance vars. Keep the real file in your deployment repo and pass it with -e @instance.yml.
gcp_project: my-agentdev
gcp_zone: europe-west4-a
image_tag: "0.1.0"                # image tag of a release: the git tag without the v (images.yml, #28)
reviewer: my-github-login         # whose Approve lets an agent PR merge
agents:
  - {name: alice, user: alice, repos: my-org/my-repo}
# Optional (#70, #71). Setting security replaces the whole default dict (group_vars/all.yml): repeat the defaults.
