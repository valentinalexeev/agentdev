# Example instance vars. Keep the real file in your deployment repo and pass it with -e @instance.yml.
gcp_project: my-agentdev
gcp_zone: europe-west4-a
image_tag: "0.1.0"                # image tag of a release: the git tag without the v (images.yml, #28)
reviewer: my-github-login         # whose Approve lets an agent PR merge
agents:
  - {name: alice, user: alice, repos: my-org/my-repo}
# Optional management API (#104): deployed only with api.oidc_issuer. Forge token: Secret Manager agentdev-api-forge-token.
# api:
#   oidc_issuer: https://auth.example.com/application/o/agentdev/
#   oidc_audience: agentdev
#   db_retention_days: 365
# Optional public HTTPS entry point (#120): values from `terraform output ingress` (Terraform public_hosts).
# ingress:
#   host: agentdev.example.com              # web UI (DNS A record -> terraform output webhook_ip)
#   webhook_host: hooks.example.com         # optional, default host; GitHub App webhook https://<this>/hook
#   certificate: agentdev-public-1a2b3c4d   # managed certificate name
#   security_policy: agentdev-public        # only with Terraform cloud_armor = true
# Optional company SSO for authentik (#122, docs/admin.md "Sign in with Google Workspace"). The IdP certificate goes
# into the Secret Manager secret authentik-sso-idp-cert (README.md). Members of admin_group become agentdev admins;
# nothing else changes the members of agentdev-admins.
# authentik:
#   sso:
#     kind: saml                                   # Google Workspace SAML app (oidc: another OIDC provider)
#     admin_group: agentdev-admins@example.com     # the Workspace group (its e-mail address)
#     allowed_domains: [example.com]               # only these e-mail domains sign in (required)
#     forge_attribute: githubLogin                 # SAML app attribute with the GitHub login (one per forge, #122)
#     saml_sso_url: https://accounts.google.com/o/saml2/idp?idpid=C0abc123
# Optional SIEM outputs (#70, #71). Setting security replaces the whole default dict (group_vars/all.yml): repeat the
# defaults. Addresses only; secret values go into the Secret Manager secret security-siem (README.md).
# security:
#   pause_after: 5
#   retention_days: 30
#   max_per_agent: 500
#   siem:
#     webhook_url: https://siem.example.com/agentdev
#     syslog_addr: siem.example.com:6514
#     syslog_server_name: siem.example.com
#     otlp_url: https://collector.example.com:4318/v1/logs
#     otlp_server_name: collector.example.com
