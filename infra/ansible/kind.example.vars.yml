# Settings of the kind playbook (#417): they replace the config.env values that run.sh and the step scripts passed
# with -e. Copy this file to kind.vars.yml in the repository root (gitignored), change what you need, and pass it:
#   ansible-playbook infra/ansible/kind.yml -e @kind.vars.yml [--tags <step>]
# Every value below is the default; remove a line to keep it. The comment names the former config.env variable.
# Secrets are never here: FORGE_ADMIN_PASSWORD, the Claude API key and the OAuth token stay in the environment
# (set -a; source .env; set +a) or in .secrets/. scripts/ still read config.env: keep the namespaces the same there.

# ---- shared by several steps (play variables of kind.yml) ----
kind_cluster_name: agentdev                   # CLUSTER_NAME
kind_engine: docker                           # CONTAINER_ENGINE: docker | podman (podman: KIND_EXPERIMENTAL_PROVIDER=podman)
agents_ns: coding-agents                      # AGENTS_NS
platform_ns: agentdev-platform                # PLATFORM_NS
kind_forge_ns: forge                          # FORGE_NS
kind_forge_url: http://localhost:3000         # FORGE_HOST_URL
kind_forge_admin_user: owner                  # FORGE_ADMIN_USER
kind_repo: owner/playground                   # REPO
kind_agent_names: [alice, bob]                # AGENTS (a list now, not a space-separated string)
kind_worker_image: agentdev/worker:mvp        # WORKER_IMAGE
kind_forge_image: agentdev/forge:mvp          # FORGE_IMAGE
kind_service_cidr: 10.96.0.0/16               # SERVICE_CIDR
kind_botboard_ns: botboard                    # BOTBOARD_NS
operator_image: agentdev-operator:dev         # OPERATOR_IMAGE
approvals: {enabled: false}                   # APPROVALS

