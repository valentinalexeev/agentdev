---
# A Claude credential secret (#212) must hold at least one recognised KEY=VALUE line with a value:
# CLAUDE_CODE_OAUTH_TOKEN=... or ANTHROPIC_API_KEY=... (the keys images/credproxy reads). A bare token or an empty
# secret would sync to an empty Kubernetes Secret, and the first agent run would fail with
# "503 claude-proxy: no Claude credential for agent". The message names the format, never the value.
# Inputs: claude_cred_text (the secret text), claude_cred_name (the Secret Manager name, for the message).
# Used by preflight.yml (imported first by deploy.yml); tested by tests/preflight.yml.
- name: Parse the Claude credential (not logged)
  ansible.builtin.set_fact:
    claude_cred_ok: >-
      {{ (claude_cred_text | default('') | string).splitlines() | map('trim')
         | select('match', '^(CLAUDE_CODE_OAUTH_TOKEN|ANTHROPIC_API_KEY)=\S') | list | length > 0 }}
  no_log: true

- name: Check the Claude credential format
  ansible.builtin.assert:
    that: claude_cred_ok | bool
    fail_msg: >-
      Secret Manager secret {{ claude_cred_name }} has no recognised Claude credential. Put one KEY=VALUE line in it:
      CLAUDE_CODE_OAUTH_TOKEN=<token> (from claude setup-token) or ANTHROPIC_API_KEY=<key>. A bare token without the
      key name is not accepted (infra/ansible/README.md, secrets table).
    quiet: true
