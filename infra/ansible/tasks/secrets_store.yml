# Scoped secrets store on GKE (#202 part 4): the same pieces as ./run.sh 13 on kind, with GCP Secret Manager as the
# backend. Needs the Terraform output `secrets_store` (two Google service accounts) in instance.yml:
#   secrets_store: {reader_gsa: agentdev-secrets-reader@<project>.iam.gserviceaccount.com,
#                   api_gsa: agentdev-api-secrets@<project>.iam.gserviceaccount.com}
# Included by deploy.yml when secrets_store.reader_gsa is set.
- name: External Secrets Operator (controller and CRDs only, no webhook, no cluster-wide kinds)
  kubernetes.core.helm:
    kube_context: "{{ kube_context }}"
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: https://charts.external-secrets.io
    chart_version: "{{ eso_chart_version }}"
    release_namespace: "{{ eso_ns }}"
    create_namespace: true
    wait: true
    values:
      installCRDs: true
      webhook: {create: false}
      certController: {create: false}
      processClusterStore: false
      processClusterExternalSecret: false
      processPushSecret: false
      processClusterPushSecret: false
      resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}

- name: Admission policies for ExternalSecrets, ps-* Secrets and secret stores
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_policy) | from_yaml_all | list }}"
  vars:
    vars_policy:
      src: "{{ repo_root }}/manifests/secrets-policy.yaml.tmpl"
      values: {AGENTS_NS: "{{ agents_ns }}", PLATFORM_NS: "{{ platform_ns }}", ESO_NS: "{{ eso_ns }}"}
      replace: []
  when: not ansible_check_mode   # the ESO types do not exist in a dry run

- name: SecretStore agentdev-secrets (Secret Manager, Workload Identity)
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/render.j2', template_vars=vars_store) | from_yaml_all | list }}"
  vars:
    vars_store:
      src: "{{ repo_root }}/manifests/secrets-store-gcp.yaml.tmpl"
      values:
        AGENTS_NS: "{{ agents_ns }}"
        SECRETS_GSA: "{{ secrets_store.reader_gsa }}"
        GCP_PROJECT: "{{ gcp_project }}"
        GKE_LOCATION: "{{ gcp_zone }}"
        GKE_CLUSTER: "{{ cluster_name }}"
      replace: []
  when: not ansible_check_mode
