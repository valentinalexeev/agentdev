---
# Applies the ExternalSecrets in es_specs (#381, templates/externalsecrets.j2) and waits until each required one has
# synced. Used by deploy.yml and the roles platform, authentik, authentik_sso, api and ingress when secrets_mode is
# external. No secret value passes through here: the specs hold only Secret Manager names and ESO templates.
- name: ExternalSecrets ({{ es_specs | map(attribute='name') | join(', ') }})
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    definition: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/externalsecrets.j2') | from_yaml_all | list }}"
  when: es_specs | length > 0 and not ansible_check_mode   # the type is unknown before ESO is installed

# optional values (policy Delete) may have no Secret Manager entry: they never become Ready, and that is fine
- name: Required ExternalSecrets have synced
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    namespace: "{{ item.ns }}"
    name: "{{ item.name }}"
  register: es_state
  until: >-
    es_state.resources | length > 0 and
    (es_state.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length > 0)
  retries: 30
  delay: 4
  loop: "{{ es_specs | rejectattr('policy', 'defined') | list }}"
  loop_control: {label: "{{ item.ns }}/{{ item.name }}"}
  when: not ansible_check_mode
