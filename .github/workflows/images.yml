name: Images

# Publish agentdev images to GHCR (#28):
#   ghcr.io/<owner>/agentdev-worker   Claude Code CLI + agent loop + webhook listener
#   ghcr.io/<owner>/agentdev-router   webhook router
#   ghcr.io/<owner>/agentdev-api      management API (#46)
#   ghcr.io/<owner>/agentdev-operator Agent operator (#47)
#   ghcr.io/<owner>/agentdev-ui       management UI (#48)
# Pull requests build all of them (no push). main pushes :main and :sha-<short>; tags vX.Y.Z push :X.Y.Z, :X.Y and :latest.
# Multi-arch: linux/amd64 (GKE) and linux/arm64 (kind on Apple Silicon).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write        # push to GHCR with GITHUB_TOKEN
  id-token: write        # build provenance attestations
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [worker, router, api, ui, operator, forge, credproxy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentdev-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=agentdev-${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentdev-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
