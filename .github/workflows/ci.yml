name: CI

# Scope (issue #1): one run per PR head / main push, superseded runs are cancelled.
# Every run reports both checks (so branch protection never waits on a skipped workflow),
# but heavy steps run only when their inputs changed:
#   lint          shell/manifest checks only if *.sh, manifests/ or the workflow changed; secret scan always
#   worker-image  docker build only if images/worker/ or the workflow changed
# Docs-only changes (README, CLAUDE.md, docs/, .github templates) finish in seconds.
on:
  push:
    branches: [main, "release/**", "next/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    outputs:
      shell: ${{ steps.f.outputs.shell }}
      image: ${{ steps.f.outputs.image }}
      router: ${{ steps.f.outputs.router }}
      api: ${{ steps.f.outputs.api }}
      operator: ${{ steps.f.outputs.operator }}
      forge: ${{ steps.f.outputs.forge }}
      credproxy: ${{ steps.f.outputs.credproxy }}
      ui: ${{ steps.f.outputs.ui }}
      tools: ${{ steps.f.outputs.tools }}
      terraform: ${{ steps.f.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            files=$(git ls-files)   # first push or unknown base: check everything
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "shell=$(has '(\.sh$|^manifests/|^config\.env$|^infra/ansible/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "image=$(has '(^images/worker/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          # per component: its sources, or a workflow change (which can change how anything is checked)
          echo "router=$(has '(^images/router/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "api=$(has '(^images/api/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "operator=$(has '(^images/operator/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "forge=$(has '(^images/forge/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "credproxy=$(has '(^images/credproxy/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '(^images/ui/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "tools=$(has '(^tools/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "terraform=$(has '(^infra/terraform/|^\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secret scan of the new commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The official image from the gitleaks project, pinned by digest, as in valentinalexeev/headlamp#181. No
          # tarball from the GitHub release CDN (HTTP 504 for hours on 2026-11-08).
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          # first push or unknown base: scan the whole history
          range="$BASE..HEAD"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            range=HEAD
          fi
          for _ in 1 2 3; do docker pull -q "$GITLEAKS_IMAGE" && break; sleep 10; done
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && exec gitleaks git --no-banner --redact --log-opts="$0" .' "$range"
      - name: no tracked build/OS artifacts (__pycache__, *.pyc, .DS_Store, node_modules)
        run: scripts/check-tracked-artifacts.sh
      - name: shellcheck and bash syntax
        if: needs.scope.outputs.shell == 'true'
        run: |
          shellcheck -S warning ./*.sh images/worker/agent-loop.sh
          for f in ./*.sh images/worker/agent-loop.sh; do bash -n "$f"; done
      - name: kubeconform (plain manifests and the rendered agent template)
        if: needs.scope.outputs.shell == 'true'
        run: |
          # kubeconform from its container image on ghcr.io (upstream README, "Github Workflow"), pinned by digest.
          # The image is public, so no login is needed. The release tarball download failed with HTTP 504 several
          # times. ./kubeconform stays a drop-in for the steps below: files are read from the work tree, "-" is stdin.
          img=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          for _ in 1 2 3; do docker pull -q "$img" && break; sleep 10; done
          printf '#!/bin/sh\nexec docker run --rm -i -v "$PWD:/w:ro" -w /w %s "$@"\n' "$img" > kubeconform
          chmod +x kubeconform
          ./kubeconform -strict -summary manifests/gitea.yaml manifests/postgres.yaml
          BOTBOARD_NS=botboard BOTBOARD_IMAGE=img envsubst < manifests/botboard.yaml.tmpl | ./kubeconform -strict -summary -
          PLATFORM_NS=agentdev-platform CONTEXTFORGE_IMAGE=img POSTGRES_IMAGE=img CF_ADMIN_EMAIL=a@b.c SERVICE_CIDR=10.96.0.0/12 \
            CF_ADMIN_PASSWORD=x CF_BASIC_AUTH_PASSWORD=x CF_DEFAULT_USER_PASSWORD=x CF_ENC_SECRET=x CF_JWT_SECRET=x \
            PG_ADMIN_PASSWORD=x PG_AGENTDEV_PASSWORD=x PG_CF_PASSWORD=x PG_AUTHENTIK_PASSWORD=x \
            envsubst < manifests/platform.yaml.tmpl | ./kubeconform -strict -summary -
          # authentik chart with our values (#45): renders, and its core objects validate (CRDs skipped)
          helm repo add authentik https://charts.goauthentik.io >/dev/null
          helm template authentik authentik/authentik --version "$(sed -n 's/^AUTHENTIK_VERSION="${AUTHENTIK_VERSION:-\(.*\)}".*/\1/p' config.env)" \
            -n agentdev-platform -f manifests/authentik-values.yaml | ./kubeconform -strict -summary -ignore-missing-schemas -
          PLATFORM_NS=agentdev-platform AGENTS_NS=coding-agents API_IMAGE=img OIDC_ISSUER=https://i/ OIDC_DISCOVERY_URL=http://d/ \
            OIDC_AUDIENCE=agentdev envsubst < manifests/api.yaml.tmpl | ./kubeconform -strict -summary -
          ./kubeconform -strict -summary -ignore-missing-schemas images/operator/config/crd/
          PLATFORM_NS=agentdev-platform AGENTS_NS=coding-agents OPERATOR_IMAGE=img WORKER_IMAGE=img FORGE_IMAGE=img IMAGE_PULL_POLICY=Never \
            FORGE_URL=http://f FORGE_PUBLIC_URL=http://f FORGE_ADMIN_USER=owner BOTBOARD_URL= POLL_SECONDS=20 IDLE_SECONDS=900 \
            PROBE_RATE_PER_MIN=20 PROBE_RATE_BURST=5 TELEMETRY_OTLP_URL='' TELEMETRY_SCRAPER_NS=monitoring \
            TELEMETRY_SCRAPER_SELECTOR='{"app.kubernetes.io/name": "prometheus"}' \
            envsubst < manifests/operator.yaml.tmpl | ./kubeconform -strict -summary -
          AGENTS_NS=coding-agents PLATFORM_NS=agentdev-platform CLAUDE_PROXY_IMAGE=img IMAGE_PULL_POLICY=Never CLAUDE_BUDGET_TOKENS=0 \
            CLAUDE_BUDGET_UNITS=0 CLAUDE_PRICES_DATA='{}' TELEMETRY_OTLP_URL='' TELEMETRY_SCRAPER_NS=monitoring \
            TELEMETRY_SCRAPER_SELECTOR='{"app.kubernetes.io/name": "prometheus"}' \
            CLAUDE_SECRET_SOURCES="$(scripts/claude-proxy-sources.sh alice)" envsubst < manifests/claude-proxy.yaml.tmpl | ./kubeconform -strict -summary -
          PLATFORM_NS=agentdev-platform UI_IMAGE=img OIDC_ISSUER=https://i/ envsubst < manifests/ui.yaml.tmpl | ./kubeconform -strict -summary -
          # observability MCP tools (#205)
          PLATFORM_NS=agentdev-platform OPERATOR_IMAGE=img IMAGE_PULL_POLICY=Never PROMETHEUS_URL=http://p LOKI_URL='' LOKI_TENANT='' \
            CLOUD_LOGGING_PROJECT='' OBS_GSA='' OBS_MCP_MAX_OUTPUT=16384 OBS_MCP_RATE_PER_MIN=30 OBS_MCP_RATE_BURST=10 PROBE_URL=http://p \
            envsubst < manifests/obs-mcp.yaml.tmpl | ./kubeconform -strict -summary -
      # The checks below cover files that #98 (egress, #65) and #115 (Ansible API role, #104) add; each one is skipped
      # until its file is on the branch, so this workflow can merge first.
      - name: egress proxy (#65) manifests validate and squid.conf parses with the pinned image
        if: needs.scope.outputs.shell == 'true'
        run: |
          [ -f manifests/egress.yaml.tmpl ] || { echo "no egress manifest yet, skipped"; exit 0; }
          set -a; . ./config.env; set +a
          if [ -f manifests/egress-proxy-web.yaml.tmpl ]; then
            AGENTS_NS=coding-agents envsubst < manifests/egress-proxy-web.yaml.tmpl | ./kubeconform -strict -summary -
          fi
          AGENTS_NS=coding-agents PLATFORM_NS=agentdev-platform FORGE_NS=forge BOTBOARD_NS=botboard \
            envsubst < manifests/egress.yaml.tmpl > egress.yaml
          ./kubeconform -strict -summary egress.yaml
          yq 'select(.kind == "ConfigMap") | .data["squid.conf"]' egress.yaml > squid.conf
          docker run --rm -v "$PWD/squid.conf:/etc/squid/squid.conf:ro" --entrypoint squid "$EGRESS_PROXY_IMAGE" -k parse -f /etc/squid/squid.conf
      - name: ansible-lint, syntax check and tests (infra/ansible)
        if: needs.scope.outputs.shell == 'true'
        working-directory: infra/ansible
        run: |
          pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
          printf 'gcp_project: p\ngcp_zone: z\nimage_tag: "0"\nreviewer: r\nagents: [{name: a, user: a, repos: o/r}]\napi: {oidc_issuer: "https://i/"}\n' > /tmp/i.yml
          ansible-playbook deploy.yml -e @/tmp/i.yml --syntax-check
          for t in tests/*.yml; do if [ -f "$t" ]; then ansible-playbook "$t"; fi; done
      - uses: hashicorp/setup-terraform@v3
        if: needs.scope.outputs.shell == 'true' || needs.scope.outputs.terraform == 'true'
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      # Provider cache, as in valentinalexeev/headlamp#181: with a matching lock file, init needs no provider download.
      - uses: actions/cache@v4
        if: needs.scope.outputs.shell == 'true' || needs.scope.outputs.terraform == 'true'
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/versions.tf', 'infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-
      - name: terraform test (infra/terraform, plan-only with mocked providers, no credentials; #202)
        if: needs.scope.outputs.shell == 'true' || needs.scope.outputs.terraform == 'true'
        run: |
          ls infra/terraform/tests/*.tftest.hcl >/dev/null 2>&1 || { echo "no terraform tests yet, skipped"; exit 0; }
          TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"; export TF_PLUGIN_CACHE_DIR
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cd infra/terraform
          # up to 3 tries: a provider download can fail on a short CDN error
          ok=0
          for try in 1 2 3; do
            if terraform init -backend=false -input=false; then ok=1; break; fi
            echo "init failed (try $try of 3)"; sleep $((try * 20))
          done
          [ "$ok" = 1 ] || exit 1
          terraform test
      - name: router tests (no dependencies, a few seconds)
        if: needs.scope.outputs.router == 'true'
        run: node --test images/router/test/*.test.js
      - uses: actions/setup-go@v5
        if: needs.scope.outputs.api == 'true' || needs.scope.outputs.operator == 'true' || needs.scope.outputs.forge == 'true' || needs.scope.outputs.credproxy == 'true' || needs.scope.outputs.tools == 'true'
        with: {go-version-file: images/api/go.mod, cache-dependency-path: images/api/go.sum}
      - name: API vet and tests (#46)
        if: needs.scope.outputs.api == 'true'
        working-directory: images/api
        run: go vet ./... && go test ./...
      - name: operator vet, tests and generated files up to date (#47)
        if: needs.scope.outputs.operator == 'true'
        working-directory: images/operator
        run: |
          go vet ./... && go test ./...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.0 object paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.0 crd rbac:roleName=agentdev-operator paths=./... \
            output:crd:dir=config/crd output:rbac:dir=config/rbac
          git add -N . && git diff --exit-code -- . || { echo "run controller-gen and commit (see images/operator/README.md)"; exit 1; }
      - name: forge sidecar vet and tests (#64)
        if: needs.scope.outputs.forge == 'true'
        working-directory: images/forge
        run: go vet ./... && go test ./...
      - name: Claude credential proxy vet and tests (#66)
        if: needs.scope.outputs.credproxy == 'true'
        working-directory: images/credproxy
        run: go vet ./... && go test ./...
      - name: ghwatch session monitor vet and tests (#232)
        if: needs.scope.outputs.tools == 'true'
        working-directory: tools/ghwatch
        run: go vet ./... && go test -race ./...
      - name: Go dead code (staticcheck U1000, #132)
        if: needs.scope.outputs.api == 'true' || needs.scope.outputs.operator == 'true' || needs.scope.outputs.forge == 'true' || needs.scope.outputs.credproxy == 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for m in api operator forge credproxy; do
            (cd images/$m && "$(go env GOPATH)/bin/staticcheck" -checks U1000 ./...) || exit 1
          done
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.ui == 'true'
        with: {node-version-file: images/ui/package.json, cache: npm, cache-dependency-path: images/ui/package-lock.json}
      - name: UI lint, type check and build (#48)
        if: needs.scope.outputs.ui == 'true'
        working-directory: images/ui
        run: npm ci && npm run lint && npm run build
      - name: UI unused exports, files and dependencies (knip, #132)
        if: needs.scope.outputs.ui == 'true'
        working-directory: images/ui
        run: npx --yes knip@5 --no-progress

  worker-image:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.scope.outputs.image == 'true'
      - name: build and smoke-test the worker image
        if: needs.scope.outputs.image == 'true'
        run: |
          docker build -t agentdev/worker:ci images/worker
          docker run --rm --entrypoint claude agentdev/worker:ci --version
          # Claude guardrails (#59): no tokens in Claude's env, tool allow-list, untrusted text fenced
          docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci test/guard.test.sh
          docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci test/jobs.test.sh
          docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci test/usage.test.sh
          # feedback runs get the issue, PR description and earlier rounds as background (#223)
          docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci test/feedback.test.sh
          # run contract: STATUS line, no push on needs-decision/blocked, resume after an answer (#234)
          docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci test/contract.test.sh
          # tests of open PRs; each runs once its file is on the branch (#175 resume, #174 drain, #196 run guards)
          for t in resume drain guards; do
            if [ -f "images/worker/test/$t.test.sh" ]; then
              docker run --rm -v "$PWD/images/worker:/w" -w /w --entrypoint bash agentdev/worker:ci "test/$t.test.sh"
            fi
          done
          if docker run --rm agentdev/worker:ci 2>err.txt; then echo "loop started without config"; exit 1; fi
          grep -q FORGE_URL err.txt
      - name: skipped (images/worker unchanged)
        if: needs.scope.outputs.image != 'true'
        run: echo "worker image unchanged, build skipped"
