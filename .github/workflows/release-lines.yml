name: Release lines

# ADR 0004: every line contains every lower one (release/X.Y -> ... -> main -> next/X.0).
#   push to a line          report pending forward merges as warnings (main does not go red for a pending hop)
#   PR chore/release-* into a line   fail if a lower line is not merged into the PR head
on:
  push:
    branches: [main, "release/**", "next/**"]
  pull_request:
    branches: [main, "release/**", "next/**"]

permissions:
  contents: read

concurrency:
  group: release-lines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lines
        run: scripts/release-lines.sh list
      - name: Ancestry (report)
        if: github.event_name == 'push'
        run: scripts/release-lines.sh check
      - name: Ancestry (release PR)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'chore/release-')
        env:
          BASE: ${{ github.base_ref }}
        run: scripts/release-lines.sh check --strict "$BASE" HEAD
      - name: Mechanical forward merge (merge/ PR)
        # Classifies a merge/ PR. "mechanical": the head is ONE merge commit of the next-lower line into BASE with the
        # tree git produces unaided; the bot may merge it without a fresh owner approval (ADR 0004). Anything else
        # (a resolved conflict, a later merge of BASE, extra commits) is "resolved": it needs the normal owner approval
        # and review (CLAUDE.md §4). Both outcomes pass: `check` is a required status, and failing here would block a
        # resolved forward merge even after the owner approves it. The result is a notice and the job summary.
        # The step fails only when the lower line is not an ancestor of the head (the PR does not do its job).
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'merge/')
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          lower=$(scripts/release-lines.sh list | grep -B1 -x "$BASE" | head -n1)
          [ -n "$lower" ] && [ "$lower" != "$BASE" ] || { echo "::error::no line below $BASE"; exit 1; }
          git merge-base --is-ancestor "origin/$lower" "$HEAD_SHA" \
            || { echo "::error::origin/$lower is not merged into the head"; exit 1; }
          resolved() { echo "::notice::forward merge is RESOLVED ($1): owner approval and review needed (CLAUDE.md §4)"
                       echo "Forward merge: **resolved** ($1). Owner approval and review needed." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          read -r _ p1 p2 extra < <(git rev-list --parents -n1 "$HEAD_SHA")
          [ -z "${extra:-}" ] && [ "$p1" = "$(git rev-parse "origin/$BASE")" ] && [ "$p2" = "$(git rev-parse "origin/$lower")" ] \
            || resolved "head is not a single merge of origin/$lower into origin/$BASE"
          git -c user.name=ci -c user.email=ci@invalid checkout -q --detach "origin/$BASE"
          git -c user.name=ci -c user.email=ci@invalid merge -q --no-ff --no-edit "origin/$lower" \
            || { git merge --abort || true; resolved "the merge has a conflict"; }
          [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$HEAD_SHA^{tree}")" ] \
            || resolved "tree differs from a mechanical merge"
          echo "::notice::forward merge is MECHANICAL: the bot may merge it with green CI (ADR 0004)"
          echo "Forward merge: **mechanical**." >> "$GITHUB_STEP_SUMMARY"
