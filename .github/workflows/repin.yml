name: Re-pin dependencies

# Monthly check of all pinned dependencies (scripts/repin.sh): Helm charts, GitHub releases and gVisor in config.env,
# image digests and tags, Dockerfile base images, GitHub Actions, Go modules and npm.
# The job only checks (no --write). When a pin is out of date, it opens one chore issue (label `chore`), or updates
# the open one. An agent or a person then does the bump in a normal PR. Nothing here pushes code or opens a PR.
on:
  schedule:
    - cron: "23 4 1 * *"   # 04:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repin
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: images/operator/go.mod, cache: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: images/ui/package.json}
      - name: check the pins
        env:
          REPIN_SUMMARY: ${{ runner.temp }}/repin.md
          GH_TOKEN: ${{ github.token }}   # GitHub API rate limit for the release lookups
        run: |
          scripts/repin.sh
          cat "$REPIN_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: open or update the chore issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ runner.temp }}/repin.md
        run: |
          # rows after the table header that are not "current"
          if ! tail -n +3 "$SUMMARY" | grep -vqE '\| current \|$'; then
            echo "all pins are current"; exit 0
          fi
          month=$(date -u +%Y-%m)
          title="chore(deps): monthly re-pin $month"
          body=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n' \
            "🤖 Monthly pin check (workflow \`repin.yml\`, script \`scripts/repin.sh\`). Some pins are out of date." \
            "$(cat "$SUMMARY")" \
            "## What to do" \
            "1. Run \`scripts/repin.sh --write\` on a branch. It writes the rows \"update\" and \"update (digest)\" in \`config.env\` and the workflows (same major only)." \
            "2. Bump the rows \"newer version\" (\`go get\`, \`npm install\`) and \"newer tag\". Rows \"major\" need their release notes first: bump them in their own PR, or note why they wait." \
            "3. Open one PR with \`Closes\` this issue. CI and a kind e2e check the new versions.")
          gh label create chore --color c5def5 --description "maintenance task" 2>/dev/null || true
          n=$(gh issue list --state open --label chore --search "in:title \"monthly re-pin\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --title "$title" --body "$body"
            gh issue comment "$n" --body "🤖 The check of $month still finds out-of-date pins. The table above is updated."
          else
            gh issue create --title "$title" --label chore --body "$body"
          fi
