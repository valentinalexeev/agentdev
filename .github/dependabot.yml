# Monthly version updates (#repin). scripts/repin.sh (workflow repin.yml) covers the pins Dependabot does not see:
# Helm charts, GitHub releases and gVisor in config.env, and image digests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directories: [/images/*, /tools/claude-stub]
    schedule: {interval: monthly}
    groups: {base-images: {patterns: ["*"]}}
  - package-ecosystem: gomod
    directories: [/images/api, /images/operator, /images/forge, /images/credproxy, /tools/ghwatch]
    schedule: {interval: monthly}
    groups: {go: {patterns: ["*"], update-types: [minor, patch]}}
  - package-ecosystem: npm
    directory: /images/ui
    schedule: {interval: monthly}
    groups: {ui: {patterns: ["*"], update-types: [minor, patch]}}
  - package-ecosystem: terraform
    directories: [/infra/terraform, /infra/terraform/bootstrap]
    schedule: {interval: monthly}
