# The three layers of an instance (agentdev #385). Order only between layers (dependsOn). All layers read the
# GitRepository flux-system that `flux bootstrap` makes (branch `gitops`, written by the deploy workflow).
#   infrastructure  External Secrets Operator and Stakater Reloader (gitops/flux/infrastructure)
#   platform        render.yml output without the agents: CRDs, router, operator, platform, authentik, API, ingress
#   agents          Agent and Executor objects (#58), rendered/agents
# prune: true removes an object that left Git. Drift correction: the kustomize-controller applies the full state at
# each interval (server-side apply, force off), and the HelmReleases have driftDetection enabled.
# No StatefulSet of an agent is in Git: the router owns its replicas (scale to zero), so it is never seen as drift.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentdev-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./gitops/flux/infrastructure
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentdev-platform
  namespace: flux-system
spec:
  dependsOn:
    - name: agentdev-infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./rendered/platform
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentdev-agents
  namespace: flux-system
spec:
  dependsOn:
    - name: agentdev-platform
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./rendered/agents
  prune: true
  # Ready of Agent and Executor (#386): a stopped agent is Ready, so all agents stopped is a healthy instance
  wait: true
