# External Secrets Operator: the same values as infra/ansible/roles/external_secrets (controller and CRDs only),
# plus the system pool (#181).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: external-secrets, namespace: external-secrets}
spec:
  interval: 1h
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef: {kind: HelmRepository, name: external-secrets, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  driftDetection: {mode: enabled}
  values:
    installCRDs: true
    serviceAccount: {name: external-secrets}
    webhook: {create: false}
    certController: {create: false}
    processClusterStore: false
    processClusterExternalSecret: false
    processPushSecret: false
    processClusterPushSecret: false
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
    nodeSelector: {cloud.google.com/gke-nodepool: system}
