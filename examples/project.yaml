# Project spec for scripts/bootstrap-project.sh (#31). Instance values only; no secrets in here.
project: playground
forge:
  type: gitea                 # v1: gitea (GitHub after #2)
  repo: owner/playground      # an existing repo; bootstrap connects it, it does not create it
  owner: owner                # approves agent PRs; defaults to the repo owner
tracker: forge-issues         # v1: issues on the same forge
process: default              # process/<name>: labels + files proposed by PR
max_concurrent: 2             # items each agent works on in parallel (#20)
agents:
  - name: alice
  - name: bob
# limits:                     # #27: a ResourceQuota on the agents namespace (shared by all projects until #17)
#   pods: 4                   # all pods in the namespace: agents, router, interactive sessions
#   cpu: "4"                  # total CPU requests
#   memory: 16Gi              # total memory limits
# mcp:                         # #14: MCP tools for this project, through ContextForge (./run.sh 08)
#   servers:                    # every agent of the project gets these tools; nothing else
#     - {name: docs, url: http://docs-mcp.tools.svc.cluster.local:8080/mcp}
