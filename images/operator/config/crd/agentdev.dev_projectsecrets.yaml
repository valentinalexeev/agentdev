---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: projectsecrets.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: ProjectSecret
    listKind: ProjectSecretList
    plural: projectsecrets
    shortNames:
    - psec
    singular: projectsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectSecretSpec is written by the API for project maintainers (or by admins). Scope, owner and mode never change:
              delete and add again.
            properties:
              agent:
                description: Agent that may use it (scope agent).
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              broker:
                description: |-
                  ProjectSecretBroker is mode broker: the credential broker (generalised credproxy) adds the credential to requests
                  for one upstream. The agent calls the broker as the tool's base URL; it never sees the value.
                properties:
                  header:
                    default: Authorization
                    description: Request header that carries the credential.
                    pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
                    type: string
                  scheme:
                    default: bearer
                    description: |-
                      How the value is written into the header: bearer ("Bearer <value>"), basic ("Basic <value>", the value is
                      already user:password in base64) or raw (the value as is).
                    enum:
                    - bearer
                    - basic
                    - raw
                    type: string
                  upstream:
                    description: Upstream base URL the broker forwards to, https only,
                      for example https://npm.pkg.github.com.
                    maxLength: 300
                    pattern: ^https://[a-z0-9]([-a-z0-9.]*[a-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$
                    type: string
                required:
                - upstream
                type: object
              description:
                description: Free text for people, shown in the UI. Never the value.
                maxLength: 200
                type: string
              env:
                description: |-
                  ProjectSecretEnv is mode env: the value becomes an environment variable of the agent container, readable by the
                  model. Explicit opt-in (owner decision on #202): riskAccepted must be true, the risk is recorded (docs/security.md),
                  and the value is redacted from approval text.
                properties:
                  name:
                    description: |-
                      Variable name. Reserved names are refused (one regular expression, the same in the API, images/api/secrets.go,
                      checked by TestReservedEnvMatchesCRD): every variable agentdev sets on the agent container (REPO, JOB_TIMEOUT,
                      MAX_BUDGET_USD, NO_PROXY, ...), the prefixes AGENTDEV_, ANTHROPIC_, CLAUDE_, FORGE_, GIT_, OTEL_ and the like, and
                      loader and trust hooks (LD_*, NODE_*, JAVA_*, PYTHONSTARTUP, SSL_CERT_FILE, PROMPT_COMMAND, ...). The operator
                      also drops any name it already renders, whatever this list says (secretEnv).
                    pattern: ^[A-Z][A-Z0-9_]{0,63}$
                    type: string
                    x-kubernetes-validations:
                    - message: reserved variable name
                      rule: '!self.matches(''^((AGENTDEV|ANTHROPIC|CLAUDE|FORGE|GIT|GH|GITHUB|SSH|KUBE|KUBERNETES|OTEL|EGRESS|LD|DYLD|NPM_CONFIG|PIP|SSL|CURL|REQUESTS|JAVA|JDK|NODE|PYTHON|PERL|RUBY|BUNDLE|GEM)_[A-Z0-9_]*|PATH|HOME|SHELL|USER|TMPDIR|ENV|BASH_ENV|PROMPT_COMMAND|PS[0-4]|IFS|CDPATH|EDITOR|VISUAL|PAGER|GNUPGHOME|HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|NO_PROXY|PYTHONSTARTUP|PYTHONPATH|PYTHONHOME|PERL5OPT|PERL5LIB|RUBYOPT|RUBYLIB|AGENT_NAME|REPO|REVIEWER|READY_ISSUE|POLL_SECONDS|IDLE_SECONDS|MAX_CONCURRENT|SCALE_TO_ZERO|ROUTER_URL|BOTBOARD_URL|APPROVALS|APPROVALS_URL|APPROVAL_TIMEOUT_MINUTES|WAKE_FILE|SELF_URL|MIRROR_DIR|USAGE_REPORTS|WAKE_TOKEN|REGISTER_TOKEN|REDACT_DIR|JOB_TIMEOUT|MAX_BUDGET_USD)$'')'
                  riskAccepted:
                    description: 'Must be true: the person who sets it accepts that
                      the model can read the value.'
                    type: boolean
                    x-kubernetes-validations:
                    - message: 'mode env needs riskAccepted: true'
                      rule: self == true
                required:
                - name
                - riskAccepted
                type: object
              forge:
                default: gitea
                description: |-
                  Forge of spec.project. A repository is identified by (forge, owner/name): acme/app on in-cluster Gitea, where
                  anyone may create the org, is not acme/app on GitHub.
                enum:
                - gitea
                - github
                type: string
              mode:
                description: |-
                  Delivery mode. identity, executor and ssh (ADR 0003 D2) store no value here: Workload Identity, the Executor's
                  exec-* Secrets and the SSH CA (#204).
                enum:
                - broker
                - env
                type: string
              project:
                description: |-
                  Repository whose agents may use it, owner/name. Scope project: every agent of it. Scope agent: the agent's
                  repository when the secret was created; the secret applies only while the agent still works on it, so an agent
                  recreated under the same name for another repository does not inherit it.
                maxLength: 201
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
              scope:
                enum:
                - project
                - agent
                type: string
            required:
            - mode
            - scope
            type: object
            x-kubernetes-validations:
            - message: scope project needs spec.project and no spec.agent
              rule: self.scope != 'project' || (has(self.project) && !has(self.agent))
            - message: scope agent needs spec.agent and spec.project (the agent's
                repository)
              rule: self.scope != 'agent' || (has(self.agent) && has(self.project))
            - message: mode broker needs spec.broker and no spec.env
              rule: self.mode != 'broker' || (has(self.broker) && !has(self.env))
            - message: mode env needs spec.env and no spec.broker
              rule: self.mode != 'env' || (has(self.env) && !has(self.broker))
            - message: scope, project, agent, forge and mode are immutable
              rule: 'self.scope == oldSelf.scope && self.mode == oldSelf.mode && (has(self.project)
                ? has(oldSelf.project) && self.project == oldSelf.project : !has(oldSelf.project))
                && (has(self.agent) ? has(oldSelf.agent) && self.agent == oldSelf.agent
                : !has(oldSelf.agent)) && (has(self.forge) ? has(oldSelf.forge) &&
                self.forge == oldSelf.forge : !has(oldSelf.forge))'
          status:
            description: ProjectSecretStatus is written by the operator.
            properties:
              message:
                description: Reason for pending or error, from External Secrets Operator.
                  Never contains the value.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: pending (no value yet or not synced), ready (synced into
                  ps-<name>), error.
                type: string
              secretName:
                description: Name of the synced Secret, ps-<name>.
                type: string
              syncedAt:
                description: When the value was last synced (External Secrets Operator's
                  refresh time).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: ProjectSecret name must be at most 50 characters
          rule: size(self.metadata.name) <= 50
        - message: ProjectSecret name must be a DNS label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
