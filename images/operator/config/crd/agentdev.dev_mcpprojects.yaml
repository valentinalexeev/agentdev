---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: mcpprojects.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: McpProject
    listKind: McpProjectList
    plural: mcpprojects
    shortNames:
    - mcpp
    singular: mcpproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: McpProjectSpec lists the servers and the agents of one project.
            properties:
              agents:
                description: Agents of the project (Agent names). One project per
                  agent (#14).
                items:
                  maxLength: 40
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              servers:
                description: 'Servers whose tools every agent of the project gets.
                  Empty: no tools, and the agents'' tokens are revoked.'
                items:
                  description: McpServer is one MCP server of the project.
                  properties:
                    name:
                      description: Short name; the ContextForge gateway is <project>-<name>.
                      maxLength: 40
                      pattern: ^[a-z0-9-]+$
                      type: string
                    url:
                      description: |-
                        Streamable HTTP endpoint, http(s)://host[:port]/path without credentials. ContextForge only calls the cluster
                        Service range (SSRF guard), and the host must be in the instance allow-list.
                      maxLength: 300
                      type: string
                  required:
                  - name
                  - url
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
          status:
            description: McpProjectStatus is written by the operator. It never contains
              a token.
            properties:
              conditions:
                description: |-
                  Ready: True when gateways, virtual server and every agent's token are in place. Reasons for False: InvalidServer,
                  HostNotAllowed, ContextForgeUnavailable, NoTools, SyncFailed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              serverID:
                description: ContextForge id of the virtual server project-<name>.
                type: string
              tokenSecrets:
                description: Token Secrets this McpProject made (agent-<agent>-mcp);
                  a Secret dropped from the spec is revoked and deleted.
                items:
                  type: string
                type: array
              tools:
                description: Names of the tools in the virtual server.
                items:
                  type: string
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: McpProject name (the project) must be a DNS label of at most 50
            characters
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 50
    served: true
    storage: true
    subresources:
      status: {}
