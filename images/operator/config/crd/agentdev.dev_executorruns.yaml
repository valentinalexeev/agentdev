---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: executorruns.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: ExecutorRun
    listKind: ExecutorRunList
    plural: executorruns
    shortNames:
    - exr
    singular: executorrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.executor
      name: Executor
      type: string
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .spec.pr
      name: PR
      type: integer
    - jsonPath: .spec.commit
      name: Commit
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExecutorRunSpec is one action on one commit. Created by the
              operator only; immutable.
            properties:
              action:
                description: plan | apply | snapshot | probe
                enum:
                - plan
                - apply
                - snapshot
                - probe
                type: string
              approval:
                description: 'apply: the Approval that allowed it.'
                maxLength: 63
                type: string
              args:
                description: 'probe: argument values, checked against the patterns.'
                items:
                  maxLength: 128
                  type: string
                maxItems: 4
                type: array
              check:
                description: 'probe: check name (spec.probes[].name).'
                maxLength: 40
                type: string
              commit:
                description: Commit, 40 hex characters (from the forge API, checked
                  by the operator). Empty for snapshot runs.
                pattern: ^([0-9a-f]{40})?$
                type: string
              executor:
                description: Executor name.
                maxLength: 40
                type: string
              notAfter:
                description: 'apply: the Job is not started after this time (decision
                  time plus EXECUTOR_APPLY_START_MINUTES).'
                format: date-time
                type: string
              planHash:
                description: 'apply: SHA-256 of the approved plan file; the Job refuses
                  to apply any other file.'
                pattern: ^([0-9a-f]{64})?$
                type: string
              pr:
                description: Pull request number the results are posted to. 0 for
                  snapshot runs.
                format: int64
                minimum: 0
                type: integer
              specHash:
                description: |-
                  apply: SHA-256 of the Executor spec (image digest, commands, credentials, repo, branch, path) the merge plan ran
                  with and the approval covers; the apply is refused when the Executor differs.
                pattern: ^([0-9a-f]{64})?$
                type: string
              stage:
                description: |-
                  pr: plan of a pull request head (unreviewed code, result informative only). merge: plan of a merge commit of
                  the protected branch (the only plan that can be applied). apply: apply of an approved merge plan. snapshot:
                  scheduled fact gathering (no commit, no PR, #205). drift: scheduled plan of the branch head (commit, no PR).
                  probe: one catalogue check on one server (no commit, no PR), run by the operator itself; a record.
                enum:
                - pr
                - merge
                - apply
                - snapshot
                - drift
                - probe
                type: string
              target:
                description: 'probe: SSHTarget name.'
                maxLength: 63
                type: string
            required:
            - action
            - executor
            - stage
            type: object
          status:
            description: ExecutorRunStatus is written by the operator only.
            properties:
              approval:
                description: 'merge plan: name of the Approval requested for the apply.'
                type: string
              finishedAt:
                format: date-time
                type: string
              message:
                type: string
              phase:
                description: Pending | Running | Succeeded | Failed
                type: string
              planHash:
                description: 'plan: SHA-256 of the plan file, computed by the operator''s
                  own image in the Job (not by the tool).'
                type: string
              reported:
                description: The result is posted to the forge.
                type: boolean
              specHash:
                description: 'merge plan: SHA-256 of the Executor spec the plan ran
                  with (see ExecutorRunSpec.SpecHash).'
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: ExecutorRun spec is immutable
          rule: self.spec == oldSelf.spec
        - message: snapshot and probe runs have no commit and no PR, drift runs a
            commit and no PR, other runs need both
          rule: 'self.spec.stage in [''snapshot'', ''probe''] ? (self.spec.action
            == self.spec.stage && !has(self.spec.commit) && !has(self.spec.pr)) :
            self.spec.stage == ''drift'' ? (self.spec.action == ''plan'' && has(self.spec.commit)
            && size(self.spec.commit) == 40 && !has(self.spec.pr)) : (!(self.spec.action
            in [''snapshot'', ''probe'']) && has(self.spec.commit) && size(self.spec.commit)
            == 40 && has(self.spec.pr) && self.spec.pr >= 1)'
    served: true
    storage: true
    subresources:
      status: {}
