---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: notificationchannels.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: NotificationChannel
    listKind: NotificationChannelList
    plural: notificationchannels
    shortNames:
    - nch
    singular: notificationchannel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.subject
      name: Subject
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NotificationChannel is a notification channel of the instance
          (#347).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NotificationChannel is an instance-level notification channel (#347, owner decision on #347: the instance part is
              a resource like ModelConfig and McpServer; the per-user part, subscriptions and mutes, stays in the API database).
              It lives in the platform namespace next to the API, which reads it; only cluster admins (Ansible) write it. The
              API uses the first valid channel of a type (by name) when the instance value notifications.channels turns the type on.

              Type webpush: the VAPID key pair is in the Secret spec.vapid.secretRef (keys publicKey and privateKey, base64url,
              created once by Ansible); allowedHosts are the push services the API may send to (subscription endpoints on other
              hosts are refused) and the hosts of the API egress policy. Type bark follows with #402.
            properties:
              allowedHosts:
                description: |-
                  Hosts the API may send to: exact names, or *.suffix for any name below suffix. Empty: the default list of the
                  API (fcm.googleapis.com, updates.push.services.mozilla.com, *.push.apple.com, *.notify.windows.com).
                items:
                  maxLength: 253
                  pattern: ^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                  type: string
                maxItems: 20
                type: array
              subject:
                description: 'Contact of the instance for the push services (VAPID
                  "sub", RFC 8292): mailto: or https://.'
                maxLength: 200
                type: string
              type:
                enum:
                - webpush
                type: string
              vapid:
                description: VAPID key pair of type webpush.
                properties:
                  secretRef:
                    description: NotificationSecretRef is a Secret in the namespace
                      of the NotificationChannel.
                    properties:
                      name:
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: type webpush needs spec.vapid
              rule: self.type != 'webpush' || has(self.vapid)
            - message: 'type webpush needs spec.subject mailto: or https://'
              rule: self.type != 'webpush' || (has(self.subject) && (self.subject.startsWith('mailto:')
                || self.subject.startsWith('https://')))
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
