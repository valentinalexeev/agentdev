---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: executors.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: Executor
    listKind: ExecutorList
    plural: executors
    shortNames:
    - exe
    singular: executor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.environment
      name: Env
      type: string
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          The name becomes part of Job names (<name>-merge-<12 hex>): keep it short.
          Credentials are bound to the executor and to the phase: plan and apply never share a Secret or a service account.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExecutorSpec is written by cluster admins only.
            properties:
              apply:
                description: 'Apply command: must apply exactly $(PLAN_FILE).'
                properties:
                  command:
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                required:
                - command
                type: object
              applyCredentials:
                description: Write credentials, used only by the apply Job of an approved
                  plan.
                properties:
                  secretName:
                    description: Secret exec-<executor>-plan (plan) or exec-<executor>-apply
                      (apply). Optional.
                    type: string
                  serviceAccountName:
                    description: Kubernetes service account of the Job, exec-*. Optional.
                    maxLength: 63
                    pattern: ^exec-[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              approvalHours:
                default: 24
                description: Hours an apply approval stays open.
                format: int32
                maximum: 168
                minimum: 1
                type: integer
              branch:
                default: main
                description: Protected branch whose merge commits may be applied.
                maxLength: 100
                pattern: ^[A-Za-z0-9_.][A-Za-z0-9_./-]*$
                type: string
              environment:
                description: 'Environment this executor changes, for example prod.
                  One executor per environment (owner decision on #69).'
                maxLength: 30
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              forge:
                default: gitea
                enum:
                - gitea
                - github
                type: string
              forgeSecret:
                description: |-
                  Secret exec-<executor>-forge with FORGE_TOKEN of the executor's own forge account (read code, set the commit
                  status, comment). This account can never decide an approval (#67: requests of an account are refused from it).
                type: string
              image:
                description: Tool image, pinned by digest (name@sha256:...). Never
                  taken from the repository.
                maxLength: 300
                pattern: ^[a-z0-9][a-z0-9./_:-]*@sha256:[a-f0-9]{64}$
                type: string
              path:
                description: |-
                  Directory in the repository the tool runs in. A pull request is planned only if it changes a file below it.
                  Empty: the repository root and every pull request.
                maxLength: 200
                pattern: ^([A-Za-z0-9_-][A-Za-z0-9_.-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*$
                type: string
              paused:
                description: 'Paused: no new runs are started; running Jobs finish.'
                type: boolean
              plan:
                description: 'Plan command: must write the plan to $(PLAN_FILE).'
                properties:
                  command:
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                required:
                - command
                type: object
              planCredentials:
                description: Read-only credentials, used for every plan (also of unreviewed
                  pull requests).
                properties:
                  secretName:
                    description: Secret exec-<executor>-plan (plan) or exec-<executor>-apply
                      (apply). Optional.
                    type: string
                  serviceAccountName:
                    description: Kubernetes service account of the Job, exec-*. Optional.
                    maxLength: 63
                    pattern: ^exec-[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              repo:
                description: Repository, owner/name.
                maxLength: 201
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
            required:
            - apply
            - environment
            - forgeSecret
            - image
            - plan
            - repo
            type: object
          status:
            description: ExecutorStatus is written by the operator only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastPoll:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ready | paused | invalid | error
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: executor name must be at most 40 characters
          rule: size(self.metadata.name) <= 40
        - message: spec.forgeSecret must be exec-<name>-forge
          rule: self.spec.forgeSecret == 'exec-' + self.metadata.name + '-forge'
        - message: spec.planCredentials.secretName must be exec-<name>-plan
          rule: '!has(self.spec.planCredentials) || !has(self.spec.planCredentials.secretName)
            || self.spec.planCredentials.secretName == ''exec-'' + self.metadata.name
            + ''-plan'''
        - message: spec.applyCredentials.secretName must be exec-<name>-apply
          rule: '!has(self.spec.applyCredentials) || !has(self.spec.applyCredentials.secretName)
            || self.spec.applyCredentials.secretName == ''exec-'' + self.metadata.name
            + ''-apply'''
        - message: plan and apply must use different service accounts
          rule: '!has(self.spec.planCredentials) || !has(self.spec.planCredentials.serviceAccountName)
            || !has(self.spec.applyCredentials) || !has(self.spec.applyCredentials.serviceAccountName)
            || self.spec.planCredentials.serviceAccountName != self.spec.applyCredentials.serviceAccountName'
    served: true
    storage: true
    subresources:
      status: {}
