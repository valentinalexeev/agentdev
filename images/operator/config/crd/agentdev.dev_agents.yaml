---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agents.agentdev.dev
spec:
  group: agentdev.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Name becomes agent-<name> (StatefulSet, Service) and state-agent-<name>-0 (PVC): keep it a short DNS label.
          Secrets are bound to the agent: its own token Secret only, and its own Claude Secret or the shared one. Another
          agent's credentials can never be named, whoever may write Agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec is the desired agent. Defaults match 06-agents.sh.
            properties:
              claudeSecret:
                description: |-
                  Secret with the Claude credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN). Exactly one per agent (#5).
                  Only claude-* names (claude-shared or claude-<agent>), for the same reason.
                pattern: ^claude-[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              forge:
                default: gitea
                description: Forge kind.
                enum:
                - gitea
                - github
                type: string
              forgeSecret:
                description: |-
                  Secret with FORGE_TOKEN (and optional WAKE_TOKEN, REGISTER_TOKEN). Default agent-<name>. Only agent-* names:
                  whoever may write Agents must not be able to mount arbitrary Secrets of the namespace into a pod.
                pattern: ^agent-[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              maxConcurrent:
                default: 2
                description: |-
                  No image field on purpose: the worker image is the operator's (WORKER_IMAGE), so writing an Agent cannot run
                  arbitrary code with the agent's credentials.
                  Parallel items (#20). Memory limit is (1 + maxConcurrent) Gi.
                format: int32
                maximum: 8
                minimum: 1
                type: integer
              paused:
                description: 'Paused: no pod, state kept (day-2 pause/resume, #4).
                  Unlike agentdev/blocked it is the owner''s desired state.'
                type: boolean
              repo:
                description: Repository the agent works on, owner/name.
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
              scaleToZero:
                description: Stop when idle, woken by the router (#35). The router
                  then owns replicas; resuming a paused agent starts it once.
                type: boolean
            required:
            - claudeSecret
            - repo
            type: object
          status:
            description: AgentStatus is observed state, written by the operator only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: running | starting | stopped | paused | blocked
                type: string
              ready:
                description: Ready pods (0 or 1).
                format: int32
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: agent name must be at most 40 characters
          rule: size(self.metadata.name) <= 40
        - message: spec.forgeSecret must be agent-<agent name>
          rule: '!has(self.spec.forgeSecret) || self.spec.forgeSecret == ''agent-''
            + self.metadata.name'
        - message: spec.claudeSecret must be claude-shared or claude-<agent name>
          rule: self.spec.claudeSecret == 'claude-shared' || self.spec.claudeSecret
            == 'claude-' + self.metadata.name
    served: true
    storage: true
    subresources:
      status: {}
